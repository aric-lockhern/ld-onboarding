    [].forEach.call(document.querySelectorAll('select[data-assign]'), function(sel){
      sel.addEventListener('change', function(){
        var task = sel.getAttribute('data-assign');
        api('assignTask', TOKEN, clientId, task, sel.value).then(function(r){
          if (!r.ok){ toast(r.message || 'Could not assign.', true); return; }
          if (r.unchanged) return;
          // Repainted in place rather than by reloading the client: a checklist
          // is twenty rows and a full re-render throws away the scroll position
          // on every single assignment.
          var age = document.querySelector('[data-age="' + task.replace(/"/g, '\\"') + '"]');
          if (age) age.textContent = sel.value ? 'assigned today' : '';
          toast(sel.value ? (task + ' → ' + sel.value) : (task + ' unassigned') + '.');
          CACHE.overview = null;
        }).catch(fail);
      });
    });
    var so = el('startOnb');
    if (so) so.addEventListener('click', function(){
      so.disabled = true; so.textContent = 'Starting…';
      api('startOnboarding', TOKEN, clientId, {
        weeklyCall: el('optCall').checked,
        makeDrive: el('optDrive').checked,
        generatePlan: el('optPlan').checked
      }).then(function(r){
        if (!r.ok){ so.disabled = false; so.textContent = 'Start onboarding';
                    toast(r.message || 'Could not start.', true); return; }
        CACHE.overview = null; CACHE.queue = null;
        toast(r.tasks + ' task' + (r.tasks === 1 ? '' : 's') + ' created.');
        openClient(clientId);
      }).catch(function(e){
        so.disabled = false; so.textContent = 'Start onboarding'; fail(e);
      });
    });

    var mk = el('mkDrive');
    if (mk) mk.addEventListener('click', function(){
      mk.disabled = true; mk.textContent = 'Creating…';
      api('dashCreateDrive', TOKEN, clientId).then(function(r){
        toast(r.ok ? 'Folder created.' : (r.message || 'Failed.'), !r.ok);
        openClient(clientId);
      }).catch(function(e){ mk.disabled = false; mk.textContent = 'Create Drive folder'; fail(e); });
    });
  }).catch(function(e){
    el('view').innerHTML = emptyState('Could not load', (e && e.message) || 'Unknown error.');
  });
}

// ---------------------------------------------------------------- intake

/**
 * Two steps. Step one takes the documents that already exist by the time a
 * deal closes and has Anthropic read them; step two is the ordinary form,
 * pre-filled, with the sentence behind each value shown underneath it.
 *
 * Step one is skippable. Not every client arrives with a transcript, and a
 * flow that cannot be skipped becomes a flow people work around.
 */
var INTAKE_STEP = 'sources';   // 'sources' | 'form'
var EXTRACT = null;            // last extraction result, or null when skipped
var CLICKUP = null;            // whether a ClickUp token is configured

function renderIntake(){
  INTAKE_STEP = 'sources';
  EXTRACT = null;
  READ = [];
  SRCVALS = {};
  DRAFT = null;
  el('view').innerHTML = loading();
  Promise.all([
    CACHE.platforms ? Promise.resolve(CACHE.platforms) : api('getPlatformList'),
    CACHE.options ? Promise.resolve(CACHE.options) : api('getIntakeOptions'),
    CLICKUP === null ? api('hasClickUpToken') : Promise.resolve(CLICKUP),
    api('listDrafts')
  ]).then(function(r){
    CACHE.platforms = r[0]; CACHE.options = r[1]; CLICKUP = r[2];
    DRAFTS = (r[3] && r[3].drafts) || [];
    drawSources();
  }).catch(function(e){
    el('view').innerHTML = emptyState('Could not load', (e && e.message) || 'Unknown error.');
  });
}

var SOURCES = [
  { key:'sales', label:'Sales call transcript',
    hint:'The call where the deal was won. Usually carries the company, the contact, the vertical and what was promised.' },
  { key:'kickoff', label:'Onboarding / kickoff call transcript',
    hint:'Who does what, meeting cadence, approvals, launch expectations.' },
  { key:'sow', label:'Scope of work',
    hint:'The contract. Where MRR, start date, renewal and the platform list actually live.' },
  { key:'deck', label:'Pitch deck',
    hint:'Google Slides link, or upload the PDF. The fees and payment slide is where the monthly figure and its breakdown by channel live.' },
  { key:'form', label:'ClickUp onboarding form',
    hint:'The submitted form as a ClickUp task link — app.clickup.com/t/… . The answers are read from its custom fields, not just the description.' },
  { key:'audit', label:'Audit presentation',
    hint:'The audit deck, or the ClickUp transcript of the call where it was walked through. This is what the action items are built from by default — every finding on it came with a recommendation, and a recommendation shown to a client is one they now expect.' }
];

function drawSources(){
  var h = '<div class="steps">'
    + '<span class="stp on">1 · Sources</span>'
    + '<span class="stp">2 · Review &amp; create</span></div>';

  // Everything read is kept, so the common case after the first week is picking
  // up something already half-done rather than starting from an empty form.
  if (DRAFTS.length){
    h += '<div class="card form"><div class="sect">'
      + '<h3>Pick up where you left off</h3>'
      + '<div class="hint">Documents already read are stored in Drive. Reopening '
      + 'one costs no re-upload — you can swap a source and re-analyse.</div>'
      + '<div id="dlist">'
      + DRAFTS.map(function(d){
          return '<div class="drow">'
            + '<div class="bd"><div class="nm">' + esc(d.name)
            + '<span class="tag ' + (d.status === 'Submitted' ? 'done' : '') + '">'
            + esc(d.status) + '</span></div>'
            + '<div class="mt">' + d.sourceCount + ' document'
            + (d.sourceCount === 1 ? '' : 's')
            + (d.analysed ? ' · analysed' : ' · not analysed yet')
            + ' · updated ' + esc(d.updated) + '</div></div>'
            + '<button type="button" class="btn sm" data-open="' + esc(d.draftId)
            + '">Open</button>'
            + '<button type="button" class="clr" data-del="' + esc(d.draftId)
            + '">Delete</button>'
            + '</div>';
        }).join('')
      + '</div></div></div>';
  }

  h += '<div class="card form"><div class="sect">'
    + '<h3>Drop in what you already have</h3>'
    + '<div class="hint">All optional, but the more you add the less you type. '
    + 'Paste the text, upload a file, or paste a ClickUp link (doc or task), '
    + 'or a Google Doc link, and it will be fetched.</div>';

  if (!CLICKUP){
    h += '<div class="warnbox"><b>ClickUp links will not work yet.</b> '
      + 'No API token is set. In the sheet: Onboarding → Set ClickUp API token. '
      + 'Pasted text and Google Doc links work regardless.</div>';
  }

  h += SOURCES.map(function(s){
    // Carried back from the reading step, so returning here to add a source you
    // forgot does not cost you the four you already pasted.
    var prev = SRCVALS[s.key];
    var ptext = (typeof prev === 'string') ? prev : '';
    var pfile = (prev && typeof prev === 'object') ? (prev.name || 'file') : '';
    return '<div class="f wide" style="margin-bottom:16px">'
      + '<label for="src_' + s.key + '">' + esc(s.label) + '</label>'
      + '<div class="note" style="margin:-2px 0 4px">' + esc(s.hint) + '</div>'
      + '<textarea id="src_' + s.key + '" placeholder="Paste the text, or a link…">'
      + esc(ptext) + '</textarea>'
      + '<div class="drop" id="drop_' + s.key + '">'
      // No accept filter: it makes the OS picker open on "Custom Files" with
      // everything else greyed out, and the list was never right anyway — an
      // .eml, a .pages, a .csv all convert fine through Drive. An unsupported
      // file now fails on its own row with a reason, which is a better answer
      // than being unable to select it.
      + '<input type="file" id="file_' + s.key + '" hidden>'
      + '<button type="button" class="btn sm" data-pick="' + s.key + '">Upload a file</button>'
      + '<span class="fn' + (pfile ? ' has' : '') + '" id="fn_' + s.key + '">'
      + (pfile ? esc(pfile) + ' · attached' : 'PDF, Word, or plain text') + '</span>'
      + '<button type="button" class="clr" data-clear="' + s.key + '"'
      + (pfile ? '' : ' hidden') + '>Remove</button>'
      + '</div></div>';
  }).join('');

  h += '</div><div class="bar">'
    + '<button class="btn" id="skip">Skip, fill in manually</button>'
    + '<span class="sp"></span><span class="note" id="exMsg"></span>'
    + '<button class="btn pri" id="analyse">Analyse and continue</button>'
    + '</div></div>';

  el('view').innerHTML = h;

  [].forEach.call(document.querySelectorAll('[data-pick]'), function(b){
    var k = b.getAttribute('data-pick');
    b.addEventListener('click', function(){ el('file_' + k).click(); });
    el('file_' + k).addEventListener('change', function(){ showFile(k); });
  });
  [].forEach.call(document.querySelectorAll('[data-clear]'), function(b){
    var k = b.getAttribute('data-clear');
    b.addEventListener('click', function(){
      el('file_' + k).value = ''; delete SRCVALS[k]; showFile(k);
    });
  });

  el('skip').addEventListener('click', function(){ EXTRACT = null; drawForm(); });
  el('analyse').addEventListener('click', collectAndRead);

  if (el('dlist')){
    el('dlist').addEventListener('click', function(ev){
      var k;
      if ((k = ev.target.getAttribute('data-open'))) return resumeDraft(k);
      if ((k = ev.target.getAttribute('data-del'))) return removeDraft(k, ev.target);
    });
  }
}

/**
 * Reopens a draft. The stored sources come back as already-read rows, so the
 * reading step shows the same checklist it would after a fresh read — with the
 * same Retry / Replace buttons, and Analyse ready to run again.
 */
function resumeDraft(draftId){
  el('view').innerHTML = loading();
  api('openDraft', draftId).then(function(d){
    if (!d.ok){ toast(d.message || 'Could not open that draft.', true); renderIntake(); return; }

    DRAFT = { draftId: d.draftId, name: d.name, status: d.status,
              folderUrl: d.folderUrl, clientId: d.clientId };
    EXTRACT = d.extraction || null;
    DRAFTFORM = d.form || null;
    SRCVALS = {};

    READ = (d.sources || []).map(function(s){
      return {
        key: s.key, label: s.label, raw: s.origin || '',
        // A source whose Drive file has been deleted is shown as failed rather
        // than quietly dropped — otherwise Analyse would run on less than the
        // checklist claims.
        state: s.gone ? 'fail' : 'ok',
        res: s.gone
          ? { error: 'The stored copy is gone from Drive.',
              hint: 'Read it again, or paste the text in.', via: s.via }
          : { ok:true, key:s.key, label:s.label, via:s.via, fileId:s.fileId,
              originalId:s.originalId || '', originalMime:s.originalMime || '',
              chars:s.chars, words:s.words, preview:s.preview, warn:'' }
      };
    });

    // Missing documents are not toasted: each one already says so on its own
    // row, with the buttons to fix it, and a toast here lands on top of the
    // action bar at exactly the moment it is needed.
    if (!READ.length){ drawSources(); return; }
    drawReading();
  }).catch(function(e){ fail(e); renderIntake(); });
}

function removeDraft(draftId, btn){
  if (btn.getAttribute('data-armed') !== '1'){
    btn.setAttribute('data-armed', '1');
    btn.textContent = 'Really delete?';
    setTimeout(function(){
      if (!btn.parentNode) return;
      btn.removeAttribute('data-armed'); btn.textContent = 'Delete';
    }, 4000);
    return;
  }
  api('deleteDraft', draftId).then(function(){
    DRAFTS = DRAFTS.filter(function(d){ return d.draftId !== draftId; });
    // Deleting the draft you are currently inside has to clear the handle too.
    // Leaving it set means the next upload reuses a draft that no longer
    // exists, and every source fails on save after being fetched in full.
    if (DRAFT && DRAFT.draftId === draftId){
      DRAFT = null; READ = []; EXTRACT = null; DRAFTFORM = null;
    }
    drawSources();
    toast('Draft deleted. Its Drive folder is in the trash.');
  }).catch(fail);
}

// ------------------------------------------------------- reading the sources

/**
 * Fetching is the step that fails. A ClickUp doc in a Space you are not in, a
 * scanned PDF with no text layer, a deck nobody shared — each of those used to
 * surface as one line of raw API error for the whole batch, with no way to fix
 * the one broken document without redoing the rest.
 *
 * So each source is read on its own and reports its own outcome, and a failed
 * one can be retried, replaced with pasted text, or skipped while the others
 * keep their result. Nothing goes to Claude until you say so.
 */
var READ = [];        // [{key,label,raw,state,res}] — wait|read|ok|fail|skip
var SRCVALS = {};     // what was entered on the sources step, for going back
var DRAFT = null;     // the open draft: {draftId, name, status, folderUrl}
var DRAFTS = [];      // the resume list
var DRAFTFORM = null; // form values saved on the draft, applied over EXTRACT
var PENDING_PROFILE = null;  // {clientId, draftId} — build one on first open

function collectAndRead(){
  var b = el('analyse');
  b.disabled = true; b.textContent = 'Reading…';

  // A file wins over the textarea for the same source: picking one is the more
  // deliberate act, and sending both would double the prompt.
  Promise.all(SOURCES.map(function(s){
    var f = el('file_' + s.key).files[0];
    if (f) return readFile(f);
    var typed = el('src_' + s.key).value.trim();
    if (typed) return Promise.resolve(typed);
    var carried = SRCVALS[s.key];
    return Promise.resolve(carried && typeof carried === 'object' ? carried : null);
  })).then(function(vals){
    SRCVALS = {};
    var items = [];
    SOURCES.forEach(function(s, i){
      if (!vals[i]) return;
      SRCVALS[s.key] = vals[i];
      items.push({ key: s.key, label: s.label, raw: vals[i], state: 'wait', res: null });
    });
    if (!items.length){
      b.disabled = false; b.textContent = 'Analyse and continue';
      el('exMsg').textContent = 'Add at least one source, or skip.';
      return;
    }
    READ = items;
    // The draft has to exist before the first read, because that read writes
    // its text into the draft's Drive folder.
    if (DRAFT) { drawReading(); readNext(0); return; }
    return api('createDraft', draftName()).then(function(d){
      DRAFT = { draftId: d.draftId, name: d.name, status: 'Draft',
                folderUrl: d.folderId
                  ? 'https://drive.google.com/drive/folders/' + d.folderId : '' };
      if (d.folderMissing){
        toast('No Drive folder could be created for this draft, so documents '
          + 'will not be stored. Check the Drive Root Folder ID on the Config tab.', true);
      }
      drawReading();
      readNext(0);
    });
  }).catch(function(e){
    b.disabled = false; b.textContent = 'Analyse and continue';
    fail(e);
  });
}

/** A draft is named before anything has been read, so guess from the sources. */
function draftName(){
  var link = '';
  for (var i = 0; i < SOURCES.length; i++){
    var v = SRCVALS[SOURCES[i].key];
    if (v && typeof v === 'object' && v.name){
      return String(v.name).replace(/\.[^.]+$/, '').slice(0, 60);
    }
    if (!link && typeof v === 'string' && v) link = v;
  }
  var d = new Date();
  return 'New client · ' + d.toLocaleDateString();
}

function drawReading(){
  var h = '<div class="steps">'
    + '<span class="stp done" id="backStep">1 · Sources</span>'
    + '<span class="stp on">Reading</span>'
    + '<span class="stp">2 · Review &amp; create</span></div>';

  h += '<div class="card form"><div class="sect">'
    + '<h3>Reading your sources</h3>'
    + '<div class="hint">Each one is fetched separately, so a document that fails '
    + 'does not cost you the others. Nothing is sent to Claude until you press '
    + 'Analyse.</div>'
    + (DRAFT ? '<div class="dbar">Saved as <b id="draftName">' + esc(DRAFT.name) + '</b>'
        + '<button type="button" class="lnk" id="renameDraft">Rename</button>'
        + (DRAFT.folderUrl ? '<a class="lnk" id="draftFolder" href="' + esc(DRAFT.folderUrl)
            + '" target="_blank" rel="noopener">Drive folder</a>' : '')
        + '<span class="sp"></span>Documents are stored — you can come back to '
        + 'this without uploading again.</div>' : '')
    + '<div id="rlist">'
    + READ.map(function(r, i){
        return '<div class="rrow ' + r.state + '" id="rrow_' + r.key + '">'
          + rowInner(i) + '</div>';
      }).join('')
    + '</div></div>'
    + '<div id="thinkWrap"></div>'
    + '<div class="bar rbar">'
    + '<button class="btn" id="backSrc">Back to sources</button>'
    + '<button class="btn" id="skip2">Skip, fill in manually</button>'
    + '<span class="sp"></span><span class="note" id="rdMsg"></span>'
    + '<button class="btn pri" id="goAnalyse" disabled>Analyse</button>'
    + '</div></div>';

  el('view').innerHTML = h;
  el('backSrc').addEventListener('click', drawSources);
  el('backStep').addEventListener('click', drawSources);
  el('skip2').addEventListener('click', function(){ drawForm(); });
  el('goAnalyse').addEventListener('click', doAnalyse);
  if (el('renameDraft')) el('renameDraft').addEventListener('click', promptRename);
  wireRows();
  updateFoot();

  // Reopening an already-analysed draft should not force another API call to
  // see what it said last time.
  if (EXTRACT && el('goAnalyse')){
    el('goAnalyse').insertAdjacentHTML('beforebegin',
      '<button class="btn" id="useLast">Use the last analysis</button>');
    el('useLast').addEventListener('click', function(){ drawForm(); });
    el('goAnalyse').textContent = 'Re-analyse';
  }
}

function promptRename(){
  var next = window.prompt('Name this draft', DRAFT ? DRAFT.name : '');
  if (next === null) return;
  api('renameDraft', DRAFT.draftId, next).then(function(r){
    if (!r.ok){ toast(r.message || 'Could not rename.', true); return; }
    DRAFT.name = String(next).trim() || 'Untitled draft';
    drawReading();
  }).catch(fail);
}

function rowInner(i){
  var r = READ[i], res = r.res || {};
  var icon = { wait: '', read: '', ok: '✓', fail: '!', skip: '–' }[r.state] || '';
  var h = '<div class="ic ' + r.state + '">' + icon + '</div><div class="bd">';

  h += '<div class="nm">' + esc(r.label)
     + (res.via ? '<span class="via">' + esc(res.via) + '</span>' : '')
     + '</div>';

  if (r.state === 'wait'){
    h += '<div class="st">Waiting.</div>';
  } else if (r.state === 'read'){
    h += '<div class="st">Fetching…</div>';
  } else if (r.state === 'skip'){
    h += '<div class="st">Skipped — this one will not be sent to Claude.</div>';
  } else if (r.state === 'ok'){
    h += '<div class="st">Read ' + fmtNum(res.words) + ' words, '
       + fmtNum(res.chars) + ' characters.'
       + (res.warn ? ' ' + esc(res.warn) : '') + '</div>';
    if (res.preview){
      h += '<div class="pv">“' + esc(res.preview) + '…”</div>';
    }
  } else if (r.state === 'fail'){
    h += '<div class="st">' + esc(res.error || 'Could not read it.') + '</div>';
    if (res.hint) h += '<div class="hnt">' + esc(res.hint) + '</div>';
  }

  if (r.state === 'fail' || r.state === 'skip' || r.state === 'ok'){
    h += '<div class="acts">'
      + '<button type="button" class="btn sm" data-retry="' + r.key + '">'
      + (r.state === 'ok' ? 'Read again' : 'Retry') + '</button>'
      + '<button type="button" class="btn sm" data-fix="' + r.key + '">'
      + (r.state === 'ok' ? 'Replace' : 'Paste it in instead') + '</button>'
      + (r.state === 'fail'
          ? '<button type="button" class="btn sm" data-skip="' + r.key
            + '">Skip this one</button>' : '')
      + '</div>'
      + '<div class="fix" id="fix_' + r.key + '">'
      + '<textarea id="fixtx_' + r.key + '" placeholder="Paste the document text here…">'
      + '</textarea>'
      + '<div class="drop">'
      + '<input type="file" id="fixf_' + r.key + '" hidden>'
      + '<button type="button" class="btn sm" data-fixpick="' + r.key + '">Upload a file</button>'
      + '<span class="fn" id="fixfn_' + r.key + '">PDF, Word, or plain text</span>'
      + '<span style="flex:1"></span>'
      + '<button type="button" class="btn sm pri" data-fixgo="' + r.key + '">Use this</button>'
      + '</div></div>';
  }
  return h + '</div>';
}

/** Delegated, because rows are repainted in place as each read finishes. */
function wireRows(){
  var list = el('rlist');
  list.addEventListener('click', function(ev){
    var t = ev.target, k;
    if ((k = t.getAttribute('data-retry'))){ readOne(rowIdx(k)); return; }
    if ((k = t.getAttribute('data-skip'))){ setState(k, 'skip'); return; }
    if ((k = t.getAttribute('data-fix'))){ el('fix_' + k).classList.toggle('on'); return; }
    if ((k = t.getAttribute('data-fixpick'))){ el('fixf_' + k).click(); return; }
    if ((k = t.getAttribute('data-fixgo'))){ applyFix(k); return; }
  });
  list.addEventListener('change', function(ev){
    var id = ev.target.id || '';
    if (id.indexOf('fixf_') !== 0) return;
    var k = id.slice(5);
    var f = el('fixf_' + k).files[0];
    var nm = el('fixfn_' + k);
    nm.textContent = f ? f.name : 'PDF, Word, or plain text';
    nm.className = f ? 'fn has' : 'fn';
  });
}

/** The "Saved as …" line, repainted in place when the draft is replaced. */
function refreshDraftBanner(){
  var n = el('draftName');
  if (n && DRAFT) n.textContent = DRAFT.name;
  var f = el('draftFolder');
  if (f && DRAFT && DRAFT.folderUrl) f.href = DRAFT.folderUrl;
}

function rowIdx(key){
  for (var i = 0; i < READ.length; i++) if (READ[i].key === key) return i;
  return -1;
}

function paintRow(i){
  var node = el('rrow_' + READ[i].key);
  if (!node) return;
  node.className = 'rrow ' + READ[i].state;
  node.innerHTML = rowInner(i);
}

function setState(key, state){
  var i = rowIdx(key);
  if (i < 0) return;
  READ[i].state = state;
  paintRow(i);
  updateFoot();
}

/** Swap in pasted text or a fresh file for one source, then read it again. */
function applyFix(key){
  var i = rowIdx(key);
  if (i < 0) return;
  var f = el('fixf_' + key).files[0];
  var typed = el('fixtx_' + key).value.trim();

  if (f){
    readFile(f).then(function(obj){
      READ[i].raw = obj; SRCVALS[key] = obj; readOne(i);
    }).catch(fail);
    return;
  }
  if (!typed){
    toast('Paste the text or pick a file first.', true);
    return;
  }
  READ[i].raw = typed; SRCVALS[key] = typed;
  readOne(i);
}

function readOne(i){
  if (i < 0) return Promise.resolve();
  var r = READ[i];
  r.state = 'read'; r.res = null;
  paintRow(i); updateFoot();

  return api('readSource', r.key, r.raw, DRAFT && DRAFT.draftId).then(function(res){
    // The draft went away underneath us — deleted here, deleted from the sheet,
    // or a second tab got there first. Start a new one and read again rather
    // than handing back a failure the user can only fix by reloading.
    if (res && res.draftGone){
      return api('createDraft', draftName()).then(function(d){
        DRAFT = { draftId: d.draftId, name: d.name, status: 'Draft',
                  folderUrl: d.folderId
                    ? 'https://drive.google.com/drive/folders/' + d.folderId : '' };
        refreshDraftBanner();
        return api('readSource', r.key, r.raw, DRAFT.draftId);
      });
    }
    return res;
  }).then(function(res){
    r.res = res;
    r.state = res && res.ok ? 'ok' : 'fail';
  }).catch(function(e){
    // A thrown server error rather than a returned one — usually a timeout on a
    // very large file. Same row, same buttons.
    r.res = { error: (e && e.message) || String(e),
              hint: 'Retry, or paste the text in instead.' };
    r.state = 'fail';
  }).then(function(){
    paintRow(i); updateFoot();
  });
}

/** One at a time, so the checklist reads as progress rather than a flicker. */
function readNext(i){
  while (i < READ.length && (READ[i].state === 'ok' || READ[i].state === 'skip')) i++;
  if (i >= READ.length){ updateFoot(); return; }
  readOne(i).then(function(){ readNext(i + 1); });
}

function updateFoot(){
  var b = el('goAnalyse');
  if (!b) return;

  var busy = 0, ok = 0, bad = 0, sk = 0;
  READ.forEach(function(r){
    if (r.state === 'wait' || r.state === 'read') busy++;
    else if (r.state === 'ok') ok++;
    else if (r.state === 'fail') bad++;
    else if (r.state === 'skip') sk++;
  });

  // Reworded rather than set once, because every row change repaints this.
  var verb = EXTRACT ? 'Re-analyse' : 'Analyse';
  b.disabled = !!busy || !ok;
  b.textContent = ok ? verb + ' ' + ok + ' document' + (ok === 1 ? '' : 's') : verb;

  var m = [];
  if (busy){
    m.push('Reading ' + busy + ' more…');
  } else {
    if (ok) m.push(ok + ' read');
    if (bad) m.push(bad + ' failed');
    if (sk) m.push(sk + ' skipped');
    if (bad) m.push('retry, replace, or skip to continue');
    else if (!ok) m.push('nothing left to analyse — skip to the form');
  }
  el('rdMsg').textContent = m.join(' · ');
}

// ------------------------------------------------------------- the analysis

function doAnalyse(){
  var items = [], words = 0;
  READ.forEach(function(r){
    if (r.state !== 'ok' || !r.res || !r.res.fileId) return;
    // originalId rides along so the server can attach the PDF itself, not just
    // the text scraped out of it — a fee table exported as an image has no text.
    items.push({ key: r.key, fileId: r.res.fileId,
                 originalId: r.res.originalId || '',
                 originalMime: r.res.originalMime || '' });
    words += r.res.words || 0;
  });
  if (!items.length){ updateFoot(); return; }

  el('goAnalyse').disabled = true;
  el('backSrc').disabled = true;

  var t0 = Date.now();
  el('thinkWrap').innerHTML = '<div class="sect">'
    + '<div class="thinking"><div class="dots"><i></i><i></i><i></i></div>'
    + '<div><div class="tx">Claude is reading ' + items.length + ' document'
    + (items.length === 1 ? '' : 's') + ' — ' + fmtNum(words) + ' words — for the '
    + 'company, the contract, the fees and who does what.</div>'
    + '<div class="el" id="elap">0s · usually 20–40 seconds</div></div></div></div>';

  // A real elapsed counter rather than a fake progress bar: it is one request,
  // and pretending otherwise would only mislead about where the time goes.
  var timer = setInterval(function(){
    var e = el('elap');
    if (!e){ clearInterval(timer); return; }
    var s = Math.round((Date.now() - t0) / 1000);
    e.textContent = s + 's · ' + (s < 45
      ? 'usually 20–40 seconds'
      : 'longer than usual — long transcripts take more');
  }, 1000);

  var stop = function(){
    clearInterval(timer);
    el('thinkWrap').innerHTML = '';
    if (el('goAnalyse')) el('goAnalyse').disabled = false;
    if (el('backSrc')) el('backSrc').disabled = false;
    updateFoot();
  };

  api('runExtraction', items, DRAFT && DRAFT.draftId).then(function(r){
    if (!r || !r.ok){
      stop();
      toast((r && r.message) || 'Analysis failed.', true);
      return;
    }
    clearInterval(timer);
    EXTRACT = r;
    // A fresh reading supersedes what was typed against the previous one.
    DRAFTFORM = null;
    // Trimming is the one thing that can quietly cost accuracy, so it is said
    // out loud rather than left in the server response.
    if (r.trimmed && r.trimmed.length){
      toast(r.trimmed.map(function(t){
        return t.label + ' was too long and was trimmed to fit ('
          + fmtNum(t.from) + ' → ' + fmtNum(t.to) + ' characters). '
          + 'Check anything it got from that one.';
      }).join(' '), true);
    }
    drawForm();
  }).catch(function(e){
    stop(); fail(e);
  });
}

function fmtNum(n){
  return String(n == null ? 0 : n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

/** Client-side cap, so an oversized file fails instantly instead of after a
    slow upload that the server would reject anyway. */
var MAX_UPLOAD = 12 * 1024 * 1024;

function showFile(key){
  var f = el('file_' + key).files[0];
  var nm = el('fn_' + key);
  var clr = document.querySelector('[data-clear="' + key + '"]');
  if (!f){
    nm.textContent = 'PDF, Word, or plain text';
    nm.className = 'fn';
    clr.hidden = true;
    el('src_' + key).disabled = false;
    return;
  }
  if (f.size > MAX_UPLOAD){
    nm.textContent = f.name + ' is too big (limit 12 MB)';
    nm.className = 'fn bad';
    clr.hidden = false;
    return;
  }
  nm.textContent = f.name + ' · ' + Math.max(1, Math.round(f.size / 1024)) + ' KB';
  nm.className = 'fn has';
  clr.hidden = false;
  // The file supersedes anything typed, so say so rather than silently ignoring it.
  el('src_' + key).disabled = true;
}

function wireFees(){
  [].forEach.call(document.querySelectorAll('.feerow .fa'), function(i){
    i.oninput = recalcFees;
  });
  [].forEach.call(document.querySelectorAll('[data-delfee]'), function(b){
    b.onclick = function(){
      if (document.querySelectorAll('.feerow').length > 1) b.closest('.feerow').remove();
      else { b.closest('.feerow').querySelector('.fl').value = '';
             b.closest('.feerow').querySelector('.fa').value = ''; }
      recalcFees();
    };
  });
  recalcFees();
}

function readFile(f){
  return new Promise(function(res, rej){
    if (f.size > MAX_UPLOAD){ rej(new Error(f.name + ' is over the 12 MB limit.')); return; }
    var r = new FileReader();
    r.onerror = function(){ rej(new Error('Could not read ' + f.name)); };
    r.onload = function(){
      // readAsDataURL gives "data:<mime>;base64,<payload>" — the server wants
      // the payload only.
      var s = String(r.result);
      res({ name: f.name, mimeType: f.type || 'application/octet-stream',
            data: s.slice(s.indexOf(',') + 1) });
    };
    r.readAsDataURL(f);
  });
}

/** A field's extracted value, or '' when nothing was extracted. */
function exVal(name){
  // A saved draft's typed value wins over the extraction: it is the later, more
  // deliberate act. Re-analysing clears the saved form so the fresh reading
  // shows through rather than being masked by what was typed before it.
  if (DRAFTFORM && DRAFTFORM[name] != null && DRAFTFORM[name] !== ''){
    return String(DRAFTFORM[name]);
  }
  var f = EXTRACT && EXTRACT.fields && EXTRACT.fields[name];
  return f && f.value != null ? String(f.value) : '';
}
/** The sentence the value came from, rendered under the input. */
function exQuote(name){
  var f = EXTRACT && EXTRACT.fields && EXTRACT.fields[name];
  if (!f || !f.quote) return '';
  var c = (f.confidence || 'medium').toLowerCase();
  return '<div class="src ' + (c === 'low' ? 'low' : '') + '">'
    + '<span class="cf">' + esc(c) + '</span>'
    + '<span class="qt">“' + esc(String(f.quote).slice(0, 220)) + '”</span>'
    + (f.source ? '<span class="sr">' + esc(f.source) + '</span>' : '')
    + '</div>';
}

function field(id, label, opts){
  opts = opts || {};
  var v = opts.value == null ? '' : String(opts.value);
  var input;
  if (opts.type === 'textarea'){
    input = '<textarea id="' + id + '" placeholder="' + esc(opts.ph || '') + '">' + esc(v) + '</textarea>';
  } else if (opts.options){
    var has = opts.options.indexOf(v) !== -1;
    input = '<select id="' + id + '">'
      + (opts.blank || !has ? '<option value=""' + (has ? '' : ' selected') + '></option>' : '')
      + opts.options.map(function(o){
          return '<option' + (o === v ? ' selected' : '') + '>' + esc(o) + '</option>';
        }).join('') + '</select>';
  } else {
    input = '<input id="' + id + '" type="' + (opts.type || 'text') + '" value="' + esc(v)
      + '" placeholder="' + esc(opts.ph || '') + '">';
  }
  return '<div class="f' + (opts.wide ? ' wide' : '') + (v ? ' filled' : '') + '">'
    + '<label for="' + id + '">' + esc(label) + '</label>' + input
    + (opts.note ? '<div class="note">' + esc(opts.note) + '</div>' : '')
    + (opts.quote || '') + '</div>';
}

function drawForm(){
  INTAKE_STEP = 'form';
  el('view').innerHTML = intakeHtml(CACHE.platforms, CACHE.options);
  wireIntake();
  window.scrollTo(0, 0);
}

function intakeHtml(platforms, options){
  var picked = savedList(DRAFTFORM && DRAFTFORM.platforms)
    || (EXTRACT && EXTRACT.platforms && EXTRACT.platforms.value) || [];
  var h = '<div class="steps">'
    + '<span class="stp done" id="backStep">1 · Sources</span>'
    + '<span class="stp on">2 · Review &amp; create</span></div>';

  if (EXTRACT){
    var n = Object.keys(EXTRACT.fields || {}).length;
    h += '<div class="okbox"><b>' + n + ' field' + (n === 1 ? '' : 's') + ' pre-filled</b> from '
      + esc((EXTRACT.sourcesUsed || []).join(', '))
      + ((EXTRACT.attached || []).length
          ? '. ' + esc(EXTRACT.attached.join(' and ')) + ' also went across as the '
            + 'original file, so pricing laid out as an image could be read'
          : '')
      + '. Every value shows the sentence it came from — check the money and the dates.</div>';

    // Fees are the field most often missing and the most expensive to be wrong
    // about, so when they come back empty the reason is stated rather than left
    // as a blank row the user has to interpret.
    var feeLines = (EXTRACT.fees && EXTRACT.fees.value) || [];
    if (!feeLines.length){
      var why = [];
      (EXTRACT.notAttached || []).forEach(function(n){
        why.push(n.label + ' — ' + n.reason);
      });
      h += '<div class="warnbox"><b>No fees found</b>'
        + '<div>' + (EXTRACT.feePass === 'second-empty'
            ? 'Claude read the attached pages specifically looking for a fee '
              + 'table and did not find one.'
            : EXTRACT.feePass === 'second-failed'
            ? 'The follow-up read of the attached pages failed. Re-analyse to '
              + 'try again.'
            : (EXTRACT.attached || []).length
            ? 'Nothing priced was found in the documents.'
            : 'No document was sent as a page, so a fee table laid out as an '
              + 'image could not be read.') + '</div>'
        + why.map(function(w){ return '<div class="note">' + esc(w) + '</div>'; }).join('')
        + '<div class="note">Upload the contract or deck as a PDF — pasted text '
        + 'loses any pricing that is a picture. Otherwise type the lines below.</div>'
        + '</div>';
    }

    // Something was sold that has no service to put it in. Silence here is how
    // a whole workstream disappears from a scope that names it on page two.
    if ((EXTRACT.unmatchedServices || []).length){
      h += '<div class="warnbox"><b>Sold, but not on the services list</b>'
        + '<div>Nothing was ticked for these. Add them to the Services tab in '
        + 'the sheet if you sell them, or note them in the scope.</div>'
        + EXTRACT.unmatchedServices.map(function(u){
            return '<div class="q">' + esc(u.name || '')
              + (u.quote ? ' — “' + esc(String(u.quote).slice(0, 180)) + '”' : '')
              + '</div>';
          }).join('')
        + '</div>';
    }

    (EXTRACT.conflicts || []).forEach(function(c){
      h += '<div class="warnbox"><b>Sources disagree on ' + esc(c.field || 'something') + '</b>'
        + '<div>' + esc(c.note || '') + '</div>'
        + (c.a ? '<div class="q">' + esc(c.a.source || 'A') + ': “' + esc(c.a.quote || '') + '”</div>' : '')
        + (c.b ? '<div class="q">' + esc(c.b.source || 'B') + ': “' + esc(c.b.quote || '') + '”</div>' : '')
        + '<div class="note">The scope of work reading was used for the field.</div></div>';
    });

    if ((EXTRACT.openQuestions || []).length){
      h += '<div class="qbox"><b>Open questions these documents do not answer</b><ul>'
        + EXTRACT.openQuestions.map(function(q){ return '<li>' + esc(q) + '</li>'; }).join('')
        + '</ul></div>';
    }
  }

  h += '<div class="card form">'
    + '<div class="sect"><h3>Company</h3><div class="hint">Only the company name is required.</div>'
    + '<div class="fields">'
    + field('company', 'Company', {wide:true, value:exVal('company'), quote:exQuote('company')})
    + field('contact', 'Primary contact', {value:exVal('contact'), quote:exQuote('contact')})
    + field('email', 'Contact email', {type:'email', value:exVal('email'), quote:exQuote('email')})
    + field('website', 'Website', {ph:'https://', value:exVal('website'), quote:exQuote('website')})
    + field('vertical', 'Vertical', {value:exVal('vertical'), quote:exQuote('vertical')})
    + '</div></div>'

    + '<div class="sect"><h3>Contract breakdown</h3>'
    + '<div class="hint">Contract start drives every task due date. Blank uses today.</div>'
    + '<div class="fields">'
    + field('contractStart', 'Contract start', {type:'date', value:exVal('contractStart'), quote:exQuote('contractStart')})
    + field('term', 'Contract term', {options:options.terms, value:exVal('term') || 'Month to month', quote:exQuote('term')})
    + field('bizType', 'Business type', {options:options.bizTypes, blank:true, value:exVal('bizType'), quote:exQuote('bizType')})
    + field('cadence', 'Meeting cadence', {options:options.cadences, blank:true, value:exVal('cadence'), quote:exQuote('cadence')})
    + field('owner', 'Onboarding owner', {note:'Blank uses the Config default.', value:exVal('owner'), quote:exQuote('owner')})
    + field('approvals', 'Approvals contact', {value:exVal('approvals'), quote:exQuote('approvals')})
    + field('slack', 'Slack channel', {ph:'#client-name', value:exVal('slack'), quote:exQuote('slack')})
    + field('scope', 'Scope', {type:'textarea', wide:true, ph:'What we are contracted to do.', value:exVal('scope'), quote:exQuote('scope')})
    + '</div></div>'

    + servicesSection(options)

    + '<div class="sect"><h3>Platforms</h3>'
    + '<div class="hint">What we need access to. Ticking a service above adds its platforms automatically; add anything else here.'
    + (picked.length ? ' Pre-selected from the documents.' : '') + '</div>'
    + (EXTRACT && EXTRACT.platforms ? exQuote('__platforms__placeholder') : '')
    + '<div class="checks">' + platforms.map(function(p){
        var on = picked.indexOf(p.name) !== -1;
        return '<label class="chk' + (on ? ' on' : '') + '">'
          + '<input type="checkbox" value="' + esc(p.name) + '"' + (on ? ' checked' : '') + '>'
          + '<span><span class="nm">' + esc(p.name) + '</span><br>'
          + '<span class="cat">' + esc(p.category) + ' · ' + esc(p.method) + '</span></span></label>';
      }).join('') + '</div>'
    + (EXTRACT && EXTRACT.platforms && EXTRACT.platforms.quote
        ? '<div class="src"><span class="cf">' + esc(EXTRACT.platforms.confidence || 'medium')
          + '</span><span class="qt">“' + esc(String(EXTRACT.platforms.quote).slice(0,220))
          + '”</span></div>' : '')
    + '</div>'

    // These two feed the Intake tab, which is what the onboarding plan is
    // written from. When a draft supplied the documents they are filled from it
    // on submit, so asking anyone to paste a transcript they already uploaded
    // is just a large empty box that looks broken.
    + '<div class="sect"><h3>Context</h3>'
    + (READ.length
        ? '<div class="hint">The transcript and contract come from the documents '
          + 'you uploaded, and are written to the Intake tab when the client is '
          + 'created — that is what the onboarding plan is generated from.</div>'
          + '<div class="okbox">' + esc(READ.filter(function(r){ return r.state === 'ok'; })
              .map(function(r){ return r.label; }).join(' · ')) + '</div>'
          + '<div class="fields">'
          + '<textarea id="transcript" hidden></textarea>'
          + '<textarea id="contract" hidden></textarea>'
        : '<div class="hint">Stored on the Intake tab and fed to the onboarding plan. '
          + 'Long text is moved to a Doc automatically.</div>'
          + '<div class="fields">'
          + field('transcript', 'Sales transcript', {type:'textarea', wide:true})
          + field('contract', 'Contract text', {type:'textarea', wide:true}))
    + field('notes', 'Context notes', {type:'textarea', wide:true,
        note: 'Anything the documents do not say. Goes to the onboarding plan.',
        value: EXTRACT && (EXTRACT.openQuestions || []).length
          ? 'Open questions from intake analysis:\n- ' + EXTRACT.openQuestions.join('\n- ') : ''})
    + '</div></div>'

    + '<div class="sect"><h3>What happens next</h3>'
    + '<div class="hint">This creates the client record only. Nothing is sent, '
    + 'no tasks exist yet, and every field above stays editable. You start the '
    + 'onboarding from the client page once the details are right.</div></div>'

    + '<div class="bar"><button class="btn" id="backSrc">Back</button>'
    + (DRAFT ? '<button class="btn" id="saveDraft">Save draft</button>' : '')
    + '<span class="sp"></span>'
    + '<span class="note" id="formMsg"></span>'
    + '<button class="btn pri" id="submit">Create client</button></div></div>';
  return h;
}

/** Everything typed into the form, for both saving a draft and submitting. */
function formPayload(){
  return {
    company: el('company').value.trim(),
    contact: el('contact').value.trim(),
    email: el('email').value.trim(),
    website: el('website').value.trim(),
    vertical: el('vertical').value.trim(),
    bizType: el('bizType').value,
    contractStart: el('contractStart').value,
    term: el('term').value,
    cadence: el('cadence').value,
    owner: el('owner').value.trim(),
    services: readServices(),
    fees: readFees(),
    mrr: readFees().reduce(function(a, l){ return a + (l.amount || 0); }, 0),
    approvals: el('approvals').value.trim(),
    slack: el('slack').value.trim(),
    scope: el('scope').value.trim(),
    platforms: readPlatforms(),
    transcript: el('transcript').value,
    contract: el('contract').value,
    notes: el('notes').value
  };
}

/**
 * Saves the typed form onto the draft without creating anything. This is the
 * "come back to it" button — the record is still not a client, and the
 * documents behind it stay exactly where they are.
 */
function saveDraftNow(btn){
  if (!DRAFT) return;
  btn.disabled = true;
  var was = btn.textContent;
  btn.textContent = 'Saving…';
  api('saveDraft', DRAFT.draftId, { form: formPayload() }).then(function(r){
    btn.disabled = false; btn.textContent = was;
    if (!r.ok){ toast(r.message || 'Could not save the draft.', true); return; }
    el('formMsg').textContent = 'Draft saved ' + (r.saved || '');
  }).catch(function(e){
    btn.disabled = false; btn.textContent = was; fail(e);
  });
}

/**
 * Services are what the client bought. Platforms are what we need access to.
 * They are not the same list and conflating them is how an access email ends
 * up asking for a Merchant Center on a lead-gen account.
 *
 * The fee table mirrors the pricing slide line for line, discounts included,
 * so a mid-term upsell is one more row rather than an edit to a single number
 * nobody can explain later.
 */
function servicesSection(options){
  var sold = savedList(DRAFTFORM && DRAFTFORM.services)
    || (EXTRACT && EXTRACT.services && EXTRACT.services.value) || [];
  var lines = savedList(DRAFTFORM && DRAFTFORM.fees)
    || (EXTRACT && EXTRACT.fees && EXTRACT.fees.value) || [];
  var list = options.services || [];

  // Belt and braces on top of the prompt now reading the Services tab: if the
  // model still returns a name with no checkbox — the tab changed since the
  // analysis, someone deleted a row — say so rather than dropping it. A ticked
  // box the user can see is the only place a service actually lands.
  var noHome = sold.filter(function(n){
    return !list.some(function(sv){ return sv.name === n; });
  });

  var h = '<div class="sect"><h3>Services sold</h3>'
    + '<div class="hint">What we are being paid to do. Each one pulls in the '
    + 'platform access it needs.</div>'
    + '<div class="checks">' + list.map(function(sv){
        var on = sold.indexOf(sv.name) !== -1;
        return '<label class="chk' + (on ? ' on' : '') + '">'
          + '<input type="checkbox" data-service="' + esc(sv.name) + '"'
          + ' value="' + esc(sv.name) + '"' + (on ? ' checked' : '') + '>'
          + '<span><span class="nm">' + esc(sv.name) + '</span><br>'
          + '<span class="cat">' + esc(svPlatformLabel(sv)) + '</span>'
          + '</span></label>';
      }).join('') + '</div>'
    + (noHome.length
        ? '<div class="warnbox" style="margin-top:12px"><b>No checkbox for '
          + esc(noHome.join(', ')) + '</b><div>The documents sold '
          + (noHome.length === 1 ? 'this' : 'these') + ', but the Services tab '
          + 'has no row for it, so nothing was ticked and no platform access '
          + 'was pulled in. Add the row in the sheet, then re-analyse.</div></div>'
        : '')
    + (EXTRACT && EXTRACT.services && EXTRACT.services.quote
        ? '<div class="src"><span class="cf">' + esc(EXTRACT.services.confidence || 'medium')
          + '</span><span class="qt">“' + esc(String(EXTRACT.services.quote).slice(0,220))
          + '”</span></div>' : '')
    + '</div>';

  h += '<div class="sect"><h3>Monthly fees</h3>'
    + '<div class="hint">One line per channel, discounts as negative numbers. '
    + 'The total is the MRR written to the client record.</div>'
    + '<div id="feeRows">'
    + (lines.length ? lines.map(feeRow).join('') : feeRow({label:'', amount:''}))
    + '</div>'
    + '<div class="feefoot">'
    + '<button type="button" class="btn sm" id="addFee">Add line</button>'
    + '<span class="sp"></span><span class="feetot">Monthly total '
    + '<b id="feeTotal">0</b></span></div>'
    + (EXTRACT && EXTRACT.fees && EXTRACT.fees.quote
        ? '<div class="src"><span class="cf">' + esc(EXTRACT.fees.confidence || 'medium')
          + '</span><span class="qt">“' + esc(String(EXTRACT.fees.quote).slice(0,220))
          + '”</span></div>' : '')
    + '</div>';
  return h;
}

function feeRow(l){
  l = l || {};
  return '<div class="feerow">'
    + '<input class="fl" placeholder="Channel or line item" value="' + esc(l.label || '') + '">'
    + '<input class="fa" type="number" step="any" placeholder="0" value="'
    + (l.amount === 0 || l.amount ? esc(l.amount) : '') + '">'
    + '<button type="button" class="clr" data-delfee="1">Remove</button></div>';
}

/** Platform subtitle, marking the ones that depend on the business type. */
function svPlatformLabel(sv){
  var rules = sv.platformRules || (sv.platforms || []).map(function(p){
    return { name: p, onlyFor: '' };
  });
  if (!rules.length) return 'no platform access';
  return rules.map(function(r){
    return r.onlyFor ? r.name + ' (' + r.onlyFor + ' only)' : r.name;
  }).join(', ');
}

function readServices(){
  return [].filter.call(document.querySelectorAll('[data-service]'),
    function(i){ return i.checked; }).map(function(i){ return i.value; });
}

function readPlatforms(){
  return [].filter.call(
    document.querySelectorAll('.checks .chk input[type=checkbox][value]'),
    function(i){ return i.checked; }).map(function(i){ return i.value; });
}

/**
 * A saved draft value only wins over the extraction if it actually holds
 * something.
 *
 * [] is truthy in JavaScript, and readFees() on an untouched form returns
 * [{label:'', amount:0}] — so once a draft was saved with no fees, the saved
 * blank masked every later extraction of them, permanently. Re-reading the
 * documents, re-analysing, attaching the PDF: none of it could get past a
 * truthy empty array. Typing over a value is a deliberate act; leaving a row
 * untouched is not.
 */
function savedList(v){
  if (!Array.isArray(v) || !v.length) return null;
  var real = v.filter(function(x){
    if (x == null) return false;
    if (typeof x === 'string') return !!x.trim();
    return !!String(x.label || '').trim() || !!Number(x.amount);
  });
  return real.length ? v : null;
}

function readFees(){
  return [].map.call(document.querySelectorAll('.feerow'), function(r){
    return { label: r.querySelector('.fl').value.trim(),
             amount: Number(r.querySelector('.fa').value || 0) };
  }).filter(function(l){ return l.label || l.amount; });
}

function recalcFees(){
  var t = readFees().reduce(function(a, l){ return a + (l.amount || 0); }, 0);
  el('feeTotal').textContent = t.toLocaleString();
}

/** Ticking a service ticks the platforms it implies. Unticking never removes
    them — the platform may have been wanted on its own, and silently dropping
    an access request is worse than an extra tick to clear. */
/**
 * Ticking a service ticks the platforms it needs — but some of those depend on
 * the kind of business. Shopping and PMax need a Merchant Center, so Google Ads
 * pulls one in for an eCommerce client and not for a lead-gen one, which has no
 * feed and no use for it.
 */
function applyServicePlatforms(name){
  var sv = (CACHE.options.services || []).find(function(x){ return x.name === name; });
  if (!sv) return;
  var biz = el('bizType') ? el('bizType').value : '';
  (sv.platformRules || sv.platforms.map(function(p){ return {name:p, onlyFor:''}; }))
    .filter(function(r){
      return !r.onlyFor || r.onlyFor.toLowerCase() === String(biz).toLowerCase();
    })
    .forEach(function(r){
      var box = document.querySelector('.checks .chk input[value="'
        + r.name.replace(/"/g, '\\"') + '"]:not([data-service])');
      if (box && !box.checked){
        box.checked = true;
        box.closest('.chk').classList.add('on');
      }
    });
}

/**
 * Platforms that follow from the kind of business rather than from anything
 * sold. An eCommerce client needs a Merchant Center whether or not a document
 * happened to mention one.
 */
function applyBizTypePlatforms(){
  var biz = el('bizType') ? String(el('bizType').value).toLowerCase() : '';
  var map = (CACHE.options && CACHE.options.bizPlatforms) || {};
  (map[biz] || []).forEach(function(name){
    var box = document.querySelector('.checks .chk input[value="'
      + name.replace(/"/g, '\\"') + '"]:not([data-service])');
    if (box && !box.checked){
      box.checked = true;
      box.closest('.chk').classList.add('on');
    }
  });
}

/** Business type changes what the ticked services need, so re-apply them all. */
function reapplyPlatformsForBizType(){
  readServices().forEach(applyServicePlatforms);
  applyBizTypePlatforms();
}

function wireIntake(){
  [].forEach.call(document.querySelectorAll('.chk input'), function(i){
    i.addEventListener('change', function(){ i.closest('.chk').classList.toggle('on', i.checked); });
  });
  [].forEach.call(document.querySelectorAll('[data-service]'), function(i){
    i.addEventListener('change', function(){
      if (i.checked) applyServicePlatforms(i.value);
    });
    // Services arriving pre-ticked from the extraction never fire a change
    // event, so their platforms have to be applied on first render too —
    // otherwise AI Search SEO is selected with no Search Console access.
    if (i.checked) applyServicePlatforms(i.value);
  });
  // Switching to eCommerce should pull in what an eCommerce client needs — the
  // extraction sets both fields, but a correction here has to follow through.
  if (el('bizType')){
    el('bizType').addEventListener('change', reapplyPlatformsForBizType);
    // The extraction fills bizType in without firing a change event, so the
    // business-type platforms have to be applied on first render as well —
    // otherwise eCommerce is selected and no Merchant Center is requested.
    applyBizTypePlatforms();
  }
  if (el('addFee')){
    el('addFee').addEventListener('click', function(){
      el('feeRows').insertAdjacentHTML('beforeend', feeRow({}));
      wireFees();
    });
    wireFees();
  }

  // Back returns to the reading checklist when there is one, so the sources
  // stay visible and swappable; only a form reached with no sources at all
  // falls through to the empty sources screen.
  var back = function(){ READ.length ? drawReading() : drawSources(); };
  if (el('backSrc')) el('backSrc').addEventListener('click', back);
  if (el('backStep')) el('backStep').addEventListener('click', back);
  if (el('saveDraft')){
    el('saveDraft').addEventListener('click', function(){ saveDraftNow(this); });
  }

  el('submit').addEventListener('click', function(){
    var b = el('submit');
    var company = el('company').value.trim();
    if (!company){
      el('formMsg').textContent = 'Company is required.';
      el('company').focus();
      return;
    }
    var payload = formPayload();
    payload.makeDrive = false;
    // The draft is kept and marked submitted, not consumed — its Drive folder
    // becomes the deal's document record.
    if (DRAFT) payload.draftId = DRAFT.draftId;

    b.disabled = true;
    b.textContent = 'Creating…';
    el('formMsg').textContent = '';
    api('submitIntake', payload).then(function(r){
      CACHE.overview = null; CACHE.queue = null;
      // Picked up by openClient, which builds the profile once the page is up
      // rather than making Create client sit on a 30-second API call.
      PENDING_PROFILE = { clientId: r.clientId, draftId: r.draftId || '' };
      toast('Created ' + company + ' — review, then start onboarding.');
      openClient(r.clientId);
    }).catch(function(e){
      b.disabled = false; b.textContent = 'Create client';
      el('formMsg').textContent = '';
      fail(e);
    });
  });
}

</script>
</body>
</html>
