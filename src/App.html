          toast('Connected to ' + r.team + ', but missing: ' + r.missing.join(', ')
            + '. Add them under OAuth & Permissions, then reinstall the app.', true);
        } else {
          toast('Connected to ' + r.team + ' as ' + r.botUser + '. All scopes present.');
        }
      }).catch(function(e){
        b.disabled = false; b.textContent = 'Test connection'; fail(e);
      });
    });
  }

  if (el('slackPing')){
    el('slackPing').addEventListener('click', function(){
      var b = this; b.disabled = true; b.textContent = 'Posting…';
      api('slackPingOutstanding', TOKEN, clientId, '').then(function(r){
        b.disabled = false; b.textContent = 'Ping outstanding items';
        toast(r.ok ? ('Posted ' + r.posted + ' items to ' + r.channel + '.')
                   : r.message, !r.ok);
      }).catch(function(e){
        b.disabled = false; b.textContent = 'Ping outstanding items'; fail(e);
      });
    });
  }

  // The picker is a second call, so the card paints without waiting on Slack.
  //
  // Every outcome here has to land as visible text in the box. It painted
  // "Loading the team…" and stopped, which reads as a hung request when the
  // real answer might be "no token", "no Team tab" or "the reply came back
  // empty" — three different fixes behind one identical screen.
  api('slackPeople').then(function(r){
    var box = el('slackPeople');
    if (!box) return;
    box.className = 'hint';

    if (!r){
      box.innerHTML = 'The server returned nothing for the team. That usually '
        + 'means a cell on the Team tab holds a formula error.';
      return;
    }
    if (r.teamEmpty){
      box.innerHTML = 'Nobody on the team yet — a channel would be created '
        + 'empty. <a href="#" id="toTeam">Add people on the Team page</a>.';
      if (el('toTeam')){
        el('toTeam').addEventListener('click', function(e){ e.preventDefault(); go('team'); });
      }
      return;
    }

    box.className = 'checks';
    box.innerHTML = (r.people || []).map(function(p){
      return '<label class="chk' + (p.matched ? '' : ' off') + '">'
        + '<input type="checkbox" data-slack-id="' + esc(p.slackId) + '"'
        + (p.matched ? '' : ' disabled') + '>'
        + '<span><span class="nm">' + esc(p.name) + '</span><br>'
        + '<span class="cat">' + esc(p.matched
            ? (p.role || p.email) : ('not matched — ' + (p.why || '')))
        + '</span></span></label>';
    }).join('');

    if (r.noToken){
      toast('No Slack token set, so nobody could be matched. In the sheet: '
        + 'Onboarding → Set Slack bot token.', true);
    }
    if (r.scopeProblem) toast(r.scopeProblem, true);
  }).catch(function(e){
    if (el('slackPeople')){
      el('slackPeople').className = 'hint';
      el('slackPeople').textContent = 'Could not read the team: '
        + ((e && e.message) || 'unknown error') + '.';
    }
  });

  function pickedIds(){
    return [].filter.call(document.querySelectorAll('[data-slack-id]'),
      function(i){ return i.checked && i.getAttribute('data-slack-id'); })
      .map(function(i){ return i.getAttribute('data-slack-id'); });
  }

  if (el('slackAdd')){
    el('slackAdd').addEventListener('click', function(){
      var b = this;
      var ids = pickedIds();
      if (!ids.length){ toast('Tick who should be added first.', true); return; }
      b.disabled = true; b.textContent = 'Adding…';
      api('slackInvite', TOKEN, clientId, ids).then(function(r){
        b.disabled = false; b.textContent = 'Add to channel';
        toast(r.ok ? (r.already ? 'Everyone picked is already in ' + r.channel + '.'
                                : 'Added ' + r.invited + ' to ' + r.channel + '.')
                   : r.message, !r.ok);
      }).catch(function(e){
        b.disabled = false; b.textContent = 'Add to channel'; fail(e);
      });
    });
  }

  if (el('slackJoin')){
    el('slackJoin').addEventListener('click', function(){
      var b = this; b.disabled = true; b.textContent = 'Joining…';
      api('slackJoinChannel', TOKEN, clientId).then(function(r){
        b.disabled = false; b.textContent = 'Add bot to channel';
        // A private channel needs a human to run /invite, so the instruction
        // has to stay on screen long enough to copy — a toast that clears in
        // three seconds is not a place to put a command.
        if (!r.ok && r.needsInvite){
          var box = el('slackPick');
          if (box) box.innerHTML = '<div class="okbox" style="margin-top:14px">'
            + '<b>Invite the bot by hand</b><div>' + esc(r.message) + '</div></div>';
          return;
        }
        toast(r.ok ? r.message : r.message, !r.ok);
      }).catch(function(e){
        b.disabled = false; b.textContent = 'Add bot to channel'; fail(e);
      });
    });
  }

  if (el('slackPickBtn')){
    el('slackPickBtn').addEventListener('click', function(){
      var b = this, box = el('slackPick');
      if (box.innerHTML){ box.innerHTML = ''; return; }
      b.disabled = true; b.textContent = 'Reading channels…';
      box.innerHTML = '<div class="hint">Reading the workspace…</div>';
      api('slackChannels').then(function(r){
        b.disabled = false; b.textContent = c.slack ? 'Change channel' : 'Use an existing channel';
        if (!r || !r.ok){
          box.innerHTML = '<div class="hint">'
            + esc((r && r.message) || 'The server returned nothing.') + '</div>';
          return;
        }
        var chans = r.channels || [];
        if (!chans.length){
          box.innerHTML = '<div class="hint">No channels came back. A bot can '
            + 'only see public channels plus private ones it has been invited '
            + 'to, so an empty list usually means missing channels:read.</div>';
          return;
        }
        var hidden = chans.filter(function(x){ return x.isPrivate && !x.isMember; }).length;
        box.innerHTML = '<div class="f" style="margin-top:14px">'
          + '<label>Existing channel</label>'
          + '<select id="slackChanSel">'
          + chans.map(function(x){
              return '<option value="' + esc(x.id) + '"'
                + (('#' + x.name) === c.slack ? ' selected' : '') + '>'
                + (x.isPrivate ? '🔒 ' : '# ') + esc(x.name)
                + (x.members ? ' · ' + x.members : '')
                + (x.isMember ? '' : ' · bot not in it') + '</option>';
            }).join('')
          + '</select>'
          // A bot cannot list a private channel it was never invited to. That
          // is Slack's rule, not a scope, so the manual field stays the way out.
          + '<span class="note">Public channels, plus private ones the bot is in. '
          + 'A private channel it has never been invited to cannot be listed at '
          + 'all — set the Slack channel field under Details by hand for those.</span>'
          + '</div>'
          + '<div class="startrow"><button class="btn pri" id="slackLink">'
          + 'Link this channel</button></div>';

        el('slackLink').addEventListener('click', function(){
          var lb = this;
          lb.disabled = true; lb.textContent = 'Linking…';
          api('slackLinkChannel', TOKEN, clientId, el('slackChanSel').value)
            .then(function(res){
              lb.disabled = false; lb.textContent = 'Link this channel';
              if (!res.ok){ toast(res.message, true); return; }
              toast('Linked ' + res.name + (res.joined ? ', bot joined' : '') + '.');
              if (res.warn) toast(res.warn, true);
              openClient(clientId);
            }).catch(function(e){
              lb.disabled = false; lb.textContent = 'Link this channel'; fail(e);
            });
        });
      }).catch(function(e){
        b.disabled = false; b.textContent = c.slack ? 'Change channel' : 'Use an existing channel';
        box.innerHTML = '<div class="hint">Could not read the channels: '
          + esc((e && e.message) || 'unknown error') + '.</div>';
      });
    });
  }

  if (!el('slackMake')) return;

  el('slackMake').addEventListener('click', function(){
    var b = this;
    var ids = pickedIds();

    b.disabled = true; b.textContent = 'Creating…';
    api('slackCreateChannel', TOKEN, clientId, {
      isPrivate: !(el('slackPublic') && el('slackPublic').checked),
      memberIds: ids
    }).then(function(r){
      b.disabled = false; b.textContent = 'Create channel';
      if (!r.ok){ toast(r.message, true); return; }
      toast('Created ' + r.name + (r.invited ? ' and invited ' + r.invited : '') + '.');
      (r.failed || []).forEach(function(f){ toast(f, true); });
      openClient(clientId);
    }).catch(function(e){
      b.disabled = false; b.textContent = 'Create channel'; fail(e);
    });
  });
}

function loadActions(clientId){
  api('getActionItems', clientId).then(function(r){
    if (!el('actWrap')) return;
    el('actWrap').innerHTML = actionsCard(r);
    wireActions(clientId, r);
  }).catch(function(){
    if (el('actWrap')) el('actWrap').innerHTML =
      '<h3>Action items</h3><div class="hint">Could not read them.</div>';
  });
}

function actionsCard(r){
  var items = (r && r.items) || [];
  if (!items.length){
    return '<h3>None yet</h3>'
      + '<div class="hint">Reads the documents you pick, finds everything '
      + 'specific that was said would be done, and writes it as work with an '
      + 'owner chosen by skill. Anything promised that sits outside the '
      + 'contract comes back flagged rather than queued.</div>'
      + sourcePicker(r)
      // No pickable documents means the button can only ever answer "tick at
      // least one" against a list with nothing in it. Say why instead, and do
      // not render an action that cannot succeed.
      + (((r && r.sources) || []).length
        ? '<div class="startrow"><button class="btn pri" id="mkActions">'
          + 'Build action items</button></div>'
        : '<div class="hint" style="margin-top:10px"><strong>Nothing to read.</strong> '
          + esc((r && r.sourcesNote) || 'No documents are available on the draft.')
          + '</div>');
  }

  var byPri = { 'Now': [], 'Next': [], 'Later': [] };
  items.forEach(function(i){ (byPri[i.priority] || byPri.Later).push(i); });

  var h = '';
  ['Now', 'Next', 'Later'].forEach(function(p){
    if (!byPri[p].length) return;
    h += '<div class="pri-h">' + p + ' <span>' + byPri[p].length + '</span></div>';
    h += byPri[p].map(function(i){
      return '<div class="act' + (i.status === 'Done' ? ' done' : '') + '">'
        + '<div class="bd"><div class="nm">' + esc(i.action) + '</div>'
        + (i.why ? '<div class="mt">' + esc(i.why) + '</div>' : '')
        + '<div class="meta">' + esc(i.source || '')
        + (i.effort ? ' · ' + esc(i.effort) : '')
        + (i.owner ? '' : ' · <b>unassigned</b>') + '</div></div>'
        // Owner is a dropdown off the Team page rather than the name the model
        // guessed. Skill matching gets it right often enough to be worth doing
        // and wrong often enough that reassigning has to take one click.
        + '<div class="acts">'
        + '<select data-act-row="' + i.row + '" data-act-field="owner">'
        + '<option value="">Unassigned</option>'
        + (r.team || []).map(function(n){
            return '<option' + (n === i.owner ? ' selected' : '') + '>' + esc(n) + '</option>';
          }).join('')
        + (i.owner && (r.team || []).indexOf(i.owner) === -1
            ? '<option selected>' + esc(i.owner) + '</option>' : '')
        + '</select>'
        + '<select data-act-row="' + i.row + '" data-act-field="status">'
        + (r.statuses || []).map(function(s){
            return '<option' + (s === i.status ? ' selected' : '') + '>' + esc(s) + '</option>';
          }).join('') + '</select></div></div>';
    }).join('');
  });

  return '<h3>' + items.length + ' action item' + (items.length === 1 ? '' : 's')
    + '</h3><div class="hint">What we said we would do, in the context of what '
    + 'was sold.</div>'
    + h
    + sourcePicker(r)
    + '<div class="startrow">'
    + (((r && r.sources) || []).length
      ? '<button class="btn" id="mkActions">Rebuild</button>'
      : '<span class="hint">'
        + esc((r && r.sourcesNote) || 'No documents available to rebuild from.')
        + '</span>')
    + '<span class="note">Anything already started is kept.</span></div>';
}

/**
 * Which documents to read.
 *
 * Size is on every row because it is the thing that decides whether the request
 * finishes at all — a 62k transcript and a 19k deck are not comparable choices,
 * and two labels alone make them look identical. Ticking everything is what
 * pushed this past the fetch deadline and returned "Address unavailable".
 */
function sourcePicker(r){
  var src = (r && r.sources) || [];
  if (!src.length) return '';

  var total = src.filter(function(s){ return s.suggested; })
    .reduce(function(n, s){ return n + s.chars; }, 0);

  return '<div class="pri-h">Read from <span id="srcSum">'
    + Math.round(total / 1000) + 'k characters</span></div>'
    + '<div class="checks">' + src.map(function(s){
        return '<label class="chk"><input type="checkbox" data-src="' + esc(s.key)
          + '" data-chars="' + s.chars + '"' + (s.suggested ? ' checked' : '') + '>'
          + '<span><span class="nm">' + esc(s.label) + '</span><br>'
          + '<span class="cat">' + Math.round(s.chars / 1000) + 'k'
          + (s.isCall ? ' · transcript' : '') + '</span></span></label>';
      }).join('') + '</div>'
    + '<div class="hint" style="margin:8px 0 0">The deck is where promises are '
    + 'made and the scope of work says which of them are in contract, so both '
    + 'start ticked. Transcripts are long — add one at a time.</div>';
}

function wireActions(clientId, r){
  if (el('mkActions')){
    el('mkActions').addEventListener('click', function(){
      var b = this;
      b.disabled = true; b.textContent = 'Reading the audit…';
      var picked = [].filter.call(document.querySelectorAll('[data-src]'),
        function(i){ return i.checked; })
        .map(function(i){ return i.getAttribute('data-src'); });
      if (!picked.length){ b.disabled = false; b.textContent = 'Build action items';
        toast('Tick at least one document to read.', true); return; }
      api('buildActionItems', clientId, picked).then(function(res){
        b.disabled = false; b.textContent = 'Build action items';
        if (!res.ok){ toast(res.message || 'Could not build them.', true); return; }
        if (res.nothing){ toast(res.message, true); return; }
        var bits = [res.written + ' written'];
        if (res.preserved) bits.push(res.preserved + ' already started, kept');
        if (res.unassigned) bits.push(res.unassigned + ' unassigned');
        toast(bits.join(' · ') + '.');
        if (res.teamEmpty){
          toast('Nobody on the Team tab, so nothing could be assigned. '
            + 'Add people in the sheet and rebuild.', true);
        }
        (res.outOfScope || []).forEach(function(o){
          toast('Out of scope: ' + o.item + ' — ' + o.why, true);
        });
        loadActions(clientId);
      }).catch(function(e){
        b.disabled = false; b.textContent = 'Build action items'; fail(e);
      });
    });
  }
  [].forEach.call(document.querySelectorAll('[data-src]'), function(i){
    i.addEventListener('change', function(){
      var n = [].filter.call(document.querySelectorAll('[data-src]'),
        function(x){ return x.checked; })
        .reduce(function(t, x){ return t + Number(x.getAttribute('data-chars')); }, 0);
      if (el('srcSum')) el('srcSum').textContent = Math.round(n / 1000) + 'k characters';
    });
  });

  [].forEach.call(document.querySelectorAll('[data-act-row]'), function(sel){
    sel.addEventListener('change', function(){
      api('updateActionItem', TOKEN, Number(sel.getAttribute('data-act-row')),
          sel.getAttribute('data-act-field'), sel.value)
        .then(function(res){
          toast(res.ok ? 'Saved.' : (res.message || 'Could not save.'), !res.ok);
          if (res.ok) loadActions(clientId);
        }).catch(fail);
    });
  });
}

/**
 * Meeting notes in ClickUp that mention this client.
 *
 * Scanned rather than searched by title: the notetaker names a doc after the
 * date, and the client appears in the attendee list and the body. That costs a
 * fetch per doc, so it is on a button rather than on page load.
 */
/**
 * The last few calls, and what has changed since the deal documents.
 *
 * Links rather than imports: opening the notes is the common case, and reading
 * 55,000 characters into Drive to do that is a cost nobody asked for. Import
 * stays on the ClickUp card for when a call should actually feed the profile.
 */
/**
 * The scope confirmation, drafted from the contract rather than a template.
 *
 * A shared template cannot do this job: a scope confirmation is a restatement
 * of one specific contract, and a template version is either so vague it
 * confirms nothing or a set of blanks somebody fills in by copying out of the
 * SOW by hand — which is how a fee gets transcribed wrong, and a fee
 * transcribed wrong in writing is a fee you have agreed to.
 */
function scopeCard(r){
  if (!r){
    return '<h3>Not drafted yet</h3>'
      + '<div class="hint">Reads the signed scope of work and writes the email '
      + 'that restates it — what was bought, what it costs, and what is not '
      + 'included. It comes back for you to read and edit; nothing is sent.</div>'
      + '<div class="startrow"><button class="btn pri" id="mkScope">'
      + 'Draft from the contract</button></div>';
  }
  if (!r.ok){
    return '<h3>Could not draft it</h3>'
      + '<div class="hint">' + esc(r.message) + '</div>'
      + '<div class="startrow"><button class="btn" id="mkScope">Try again</button></div>';
  }

  return '<h3>Draft</h3>'
    + '<div class="hint">From ' + esc((r.read || []).join(', '))
    + '. Read it before it goes anywhere — it restates a contract, and a number '
    + 'restated wrong in writing is a number you have agreed to.</div>'
    + (r.gaps && r.gaps.length
        ? '<div class="okbox" style="margin:0 0 14px"><b>The contract does not say</b>'
          + '<div>' + r.gaps.map(function(g){ return esc(g); }).join('<br>')
          + '</div></div>'
        : '')
    + '<div class="fields">'
    + '<div class="f wide"><label>Subject</label>'
      + '<input id="scSubject" value="' + esc(r.subject) + '"></div>'
    + '<div class="f wide"><label>Body</label>'
      + '<textarea id="scBody" style="min-height:300px">' + esc(r.body) + '</textarea></div>'
    + '</div>'
    + '<div class="startrow">'
    + '<button class="btn" id="mkScope">Redraft</button>'
    + '<button class="btn pri" id="scCopy">Copy</button></div>';
}

function wireScope(clientId){
  if (el('mkScope')){
    el('mkScope').addEventListener('click', function(){
      var b = this; b.disabled = true; b.textContent = 'Reading the contract…';
      api('draftScopeEmail', TOKEN, clientId).then(function(r){
        if (!el('scopeWrap')) return;
        el('scopeWrap').innerHTML = scopeCard(r || { ok:false,
          message:'The server returned nothing.' });
        wireScope(clientId);
      }).catch(function(e){
        b.disabled = false; b.textContent = 'Draft from the contract'; fail(e);
      });
    });
  }
  if (el('scCopy')){
    el('scCopy').addEventListener('click', function(){
      var text = el('scSubject').value + '\n\n' + el('scBody').value;
      // No clipboard API in the Apps Script sandbox — a hidden textarea and
      // execCommand is the only route that works inside the iframe.
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      ta.remove();
      toast(ok ? 'Copied — subject and body.'
               : 'Could not copy automatically; select the text and copy it.', !ok);
    });
  }
}

function recentCard(r){
  if (!r || !r.ok){
    return '<h3>Recent context</h3><div class="hint">'
      + esc((r && r.message) || 'Could not read it.') + '</div>';
  }

  var h = '';
  var calls = r.calls || [];

  if (calls.length){
    h += '<div class="pri-h">Last ' + calls.length + ' call'
      + (calls.length === 1 ? '' : 's') + '</div>'
      + calls.map(function(c){
          var id = c.key || c.docId;
          return '<div class="crow"><div class="bd">'
            + '<div class="nm"><a href="' + esc(c.url) + '" target="_blank">'
            + esc(c.name) + '</a>'
            + (c.source === 'manual' ? ' <span class="pill">added by hand</span>' : '')
            + '</div>'
            + '<div class="meta">' + esc(c.at)
            + (c.chars ? ' · ' + Math.round(c.chars / 1000) + 'k chars' : '')
            + '</div></div>'
            + '<button class="btn sm" data-delcall="' + esc(id) + '">Remove</button>'
            + '</div>';
        }).join('');
  } else {
    h += '<div class="hint">' + (r.scanInstalled
      ? 'No ClickUp calls have matched this client yet. The scan runs each '
        + 'morning; use Find recent calls below to check now.'
      : 'The daily call scan is not switched on. In the sheet: Onboarding → '
        + 'Enable daily call scan. Until then, use Find recent calls below.')
      + '</div>';
  }

  // Not every call goes through the notetaker. A Google Doc someone typed up,
  // a transcript the client mailed over, notes from a call nothing recorded —
  // this is the way in for those, and it files them as documents so the
  // profile and the action items read them like any other call.
  h += '<div class="pri-h">Add a call</div>'
    + '<div class="hint">A Google Doc or ClickUp link, or paste the transcript. '
    + 'It is stored with the deal documents and read by the profile and the '
    + 'action items. Calls added here are kept when the daily scan runs.</div>'
    + '<div class="fields">'
    + '<div class="f"><label>What it was</label>'
      + '<input id="mcName" placeholder="Q3 planning call"></div>'
    + '<div class="f"><label>Date</label>'
      + '<input id="mcDate" placeholder="' + esc(r.today || '') + '"></div>'
    + '<div class="f wide"><label>Link, or paste the transcript</label>'
      + '<textarea id="mcText" style="min-height:90px" placeholder="'
      + 'https://docs.google.com/document/d/… — or the whole transcript"></textarea>'
      + '</div></div>'
    + '<div class="startrow"><button class="btn" id="addCall">Add call</button></div>';

  var notes = r.notes || [];
  h += '<div class="pri-h">Notes' + (r.scanned
    ? ' <span>scanned ' + esc(r.scanned) + '</span>' : '') + '</div>';

  h += notes.length
    ? notes.map(function(n, i){
        return '<div class="crow"><div class="bd">'
          + '<div class="nm" style="font-weight:400">' + esc(n.text) + '</div>'
          + '<div class="meta">' + esc(n.at) + (n.by ? ' · ' + esc(n.by) : '')
          + '</div></div>'
          + '<button class="btn sm" data-delnote="' + i + '">Remove</button></div>';
      }).join('')
    : '<div class="hint">Nothing yet. A changed promo, a new contact, a target '
      + 'revised on a call — anything true now that the deal documents do not '
      + 'say.</div>';

  h += '<div class="fields" style="margin-top:14px">'
    + '<div class="f wide"><label>Add a note</label>'
    + '<input id="ntxNote" placeholder="What changed"></div></div>'
    + '<div class="startrow"><button class="btn" id="addNote">Add note</button></div>';

  return h;
}

/**
 * The stored documents.
 *
 * Its own function because adding a call adds a document — leaving the list
 * showing what was there a minute ago is how somebody files a transcript and
 * concludes nothing happened.
 */
function loadDocs(clientId){
  api('getClientDocs', clientId).then(function(r){
    if (el('docsWrap')) el('docsWrap').innerHTML = docsCard(r);
    wireDocs();
  }).catch(function(){
    if (el('docsWrap')) el('docsWrap').innerHTML =
      '<h3>Documents</h3><div class="hint">Could not read them.</div>';
  });
}

function loadRecent(clientId){
  api('getRecentContext', clientId).then(function(r){
    if (!el('recentWrap')) return;
    el('recentWrap').innerHTML = recentCard(r);
    wireRecent(clientId);
  }).catch(function(e){
    if (el('recentWrap')) el('recentWrap').innerHTML =
      '<h3>Recent context</h3><div class="hint">Could not read it: '
      + esc((e && e.message) || 'unknown error') + '.</div>';
  });
}

function wireRecent(clientId){
  if (el('addNote')){
    el('addNote').addEventListener('click', function(){
      var b = this, v = el('ntxNote').value.trim();
      if (!v){ toast('Nothing to add.', true); return; }
      b.disabled = true; b.textContent = 'Adding…';
      api('addRecentNote', TOKEN, clientId, v).then(function(r){
        b.disabled = false; b.textContent = 'Add note';
        if (!r.ok){ toast(r.message, true); return; }
        loadRecent(clientId);
      }).catch(function(e){
        b.disabled = false; b.textContent = 'Add note'; fail(e);
      });
    });
  }
  if (el('addCall')){
    el('addCall').addEventListener('click', function(){
      var b = this, v = el('mcText').value.trim();
      if (!v){ toast('Paste the transcript or give a link to it.', true); return; }
      // A long transcript is a real fetch or a real write, so the button says
      // so — a silent 20 seconds reads as nothing having happened, and the
      // second click files it twice under a second key.
      b.disabled = true; b.textContent = 'Reading…';
      api('addManualCall', TOKEN, clientId, el('mcName').value.trim(), v,
          el('mcDate').value.trim())
        .then(function(r){
          b.disabled = false; b.textContent = 'Add call';
          if (!r.ok){ toast(r.message, true); return; }
          toast('Filed ' + Math.round(r.chars / 1000) + 'k characters as '
            + r.label + '.');
          loadRecent(clientId);
          // The document list and the action-item picker both change.
          loadDocs(clientId);
        }).catch(function(e){
          b.disabled = false; b.textContent = 'Add call'; fail(e);
        });
    });
  }
  [].forEach.call(document.querySelectorAll('[data-delcall]'), function(b){
    b.addEventListener('click', function(){
      api('deleteRecentCall', TOKEN, clientId, b.getAttribute('data-delcall'))
        .then(function(r){
          if (!r.ok){ toast(r.message, true); return; }
          toast('Removed from the list. The transcript is still on file.');
          loadRecent(clientId);
        }).catch(fail);
    });
  });
  [].forEach.call(document.querySelectorAll('[data-delnote]'), function(b){
    b.addEventListener('click', function(){
      api('deleteRecentNote', TOKEN, clientId, Number(b.getAttribute('data-delnote')))
        .then(function(r){
          if (!r.ok){ toast(r.message, true); return; }
          loadRecent(clientId);
        }).catch(fail);
    });
  });
}

      + '<div class="startrow"><button class="btn" id="findCalls">'
      + 'Try again</button></div>';

  var calls = r.calls || [];

    return '<h3>No calls found</h3>'

function profileCard(text){
  if (!text || !String(text).trim()){
    return '<h3>Not built yet</h3>'
      + '<div class="hint">A profile is written from the sales and kickoff calls '
      + 'when the client is created — how they communicate, what they care about, '
      + 'what will annoy them. This one has none, usually because it was created '
      + 'before the feature existed or without any documents.</div>'
      + '<div class="startrow"><button class="btn" id="mkProfile">Build profile</button></div>';
  }
  var p = parseProfile(text);

  // Nothing to collapse — a profile written before the headings existed, or a
  // short one. Rendering an accordion with a single "everything" section in it
  // would be furniture around one paragraph.
  if (!p.sections.length){
    return '<div class="prof">' + mdLite(text) + '</div>'
      + '<div class="startrow"><button class="btn" id="mkProfile">'
      + 'Rebuild from the documents</button></div>';
  }

  var h = '<div class="pro-lead">' + esc(p.lead) + '</div>';

  h += '<div class="pro-bar">'
    + '<span class="note">' + p.sections.length + ' sections · '
    + p.points + ' points</span><div class="sp"></div>'
    + '<button class="btn sm" id="proAll">Expand all</button></div>';

  h += '<div class="pro-secs">' + p.sections.map(function(s, i){
    return '<div class="pro-sec' + (s.warn ? ' warn' : '') + '" data-sec="' + i + '">'
      + '<button class="pro-head" data-sechead="' + i + '">'
      + '<span class="tw">▶</span>'
      + '<span class="ti">' + esc(s.title) + '</span>'
      + '<span class="te">' + esc(s.teaser) + '</span>'
      + '<span class="ct">' + s.count + '</span></button>'
      + '<div class="pro-body">' + s.html + '</div></div>';
  }).join('') + '</div>';

  return h + '<div class="startrow"><button class="btn" id="mkProfile">'
    + 'Rebuild from the documents</button></div>';
}

/**
 * Splits the profile into its lead and its sections.
 *
 * The profile is markdown because the Clients tab is read by people and half
 * the team works in the sheet — so the browser gets the same text everyone
 * else sees and has to make it skimmable here rather than ask for a second
 * format nobody would maintain.
 */
function parseProfile(text){
  var lines = String(text).split(/\n/);
  var lead = [], sections = [], cur = null;

  lines.forEach(function(line){
    var t = line.trim();
    if (t.indexOf('## ') === 0){
      cur = { title: t.slice(3), items: [], paras: [] };
      sections.push(cur);
    } else if (!t){
      return;
    } else if (!cur){
      lead.push(t);
    } else if (t.indexOf('- ') === 0){
      cur.items.push(t.slice(2));
    } else {
      cur.paras.push(t);
    }
  });

  var points = 0;
  sections.forEach(function(s){
    s.count = s.items.length || s.paras.length;
    points += s.items.length;
    // Warning tone for the section that is a list of ways to lose the account.
    // One section, not a palette: colour here marks the part you must not skip.
    s.warn = /annoy|avoid|watch/i.test(s.title);
    s.teaser = teaseFrom_(s.items[0] || s.paras[0] || '');
    s.html = (s.paras.map(function(x){ return '<p>' + esc(x) + '</p>'; })
      .concat(s.items.map(renderPoint))).join('');
  });

  return { lead: lead.join(' '), sections: sections, points: points };
}

/** The first clause of a point, short enough to sit on one line unwrapped. */
function teaseFrom_(s){
  var q = String(s).match(/^["“](.+?)["”]/);
  var m = q ? null : String(s).match(/^(.+?[.!?])\s/);
  var t = q ? q[1] : (m ? m[1] : String(s));
  return t.length > 96 ? t.slice(0, 95).replace(/\s+\S*$/, '') + '…' : t;
}

/**
 * One bullet, weighted.
 *
 * Two shapes appear in practice. A quote line is `"…" — what it means`, and
 * gets the quote set apart from the reading of it. Everything else is a claim
 * followed by its evidence, and bolding the claim is what lets a section be
 * taken in at a glance instead of read in full every time.
 */
function renderPoint(s){
  var q = String(s).match(/^["“](.+?)["”]\s*[—–-]\s*(.+)$/);
  if (q){
    return '<div class="pro-q"><span class="qt">“' + esc(q[1]) + '”</span>'
      + '<span class="qw">' + esc(q[2]) + '</span></div>';
  }

  // Only split where the claim really is a short opener. A 200-character first
  // sentence in bold is worse than no split at all.
  var m = String(s).match(/^(.{0,120}?[.!?])\s+(\S[\s\S]*)$/);
  if (!m) return '<div class="pro-pt"><span class="cl">' + esc(s) + '</span></div>';
  return '<div class="pro-pt"><span class="cl">' + esc(m[1]) + '</span>'
    + '<span class="ev">' + esc(m[2]) + '</span></div>';
}

function wireProfileSections(){
  [].forEach.call(document.querySelectorAll('[data-sechead]'), function(b){
    b.addEventListener('click', function(){
      var sec = b.parentNode;
      sec.classList.toggle('on');
      syncProAll();
    });
  });
  if (el('proAll')){
    el('proAll').addEventListener('click', function(){
      var secs = document.querySelectorAll('.pro-sec');
      var anyClosed = [].some.call(secs, function(s){ return !s.classList.contains('on'); });
      [].forEach.call(secs, function(s){ s.classList.toggle('on', anyClosed); });
      syncProAll();
    });
  }
}

function syncProAll(){
  if (!el('proAll')) return;
  var secs = document.querySelectorAll('.pro-sec');
  var anyClosed = [].some.call(secs, function(s){ return !s.classList.contains('on'); });
  el('proAll').textContent = anyClosed ? 'Expand all' : 'Collapse all';
}

/**
 * Just enough markdown for what the profile actually contains: ## headings,
 * - bullets, and paragraphs. Not a general renderer — a general renderer here
 * would be a lot of code to display six shapes.
 */
function mdLite(text){
  var out = [], list = null;
  String(text).split(/\n/).forEach(function(line){
    var t = line.trim();
    if (!t){ if (list){ out.push('</ul>'); list = null; } return; }
    if (t.indexOf('## ') === 0){
      if (list){ out.push('</ul>'); list = null; }
      out.push('<h4>' + esc(t.slice(3)) + '</h4>');
    } else if (t.indexOf('- ') === 0){
      if (!list){ out.push('<ul>'); list = true; }
      out.push('<li>' + esc(t.slice(2)) + '</li>');
    } else {
      if (list){ out.push('</ul>'); list = null; }
      out.push('<p>' + esc(t) + '</p>');
    }
  });
  if (list) out.push('</ul>');
  return out.join('');
}

/**
 * Builds or rebuilds the profile in place.
 *
 * Reads the draft's documents server-side, so this costs one API call and no
 * uploads however long ago the client was created — as long as the draft still
 * exists, which it does unless someone deleted it.
 */
function makeProfile(clientId, draftId, btn){
  if (btn){ btn.disabled = true; btn.textContent = 'Reading the documents…'; }
  api('buildClientProfile', clientId, draftId || '').then(function(r){
    if (!r.ok){
      if (btn){ btn.disabled = false; btn.textContent = 'Build profile'; }
      toast(r.message || 'Could not build the profile.', true);
      return;
    }
    if (DETAIL && DETAIL.client) DETAIL.client.profile = r.profile;
    if (el('profWrap')){
      el('profWrap').innerHTML = profileCard(r.profile);
      wireProfile(clientId, draftId);
    }
    toast('Profile built from ' + (r.sources || []).join(', ') + '.');
  }).catch(function(e){
    if (btn){ btn.disabled = false; btn.textContent = 'Build profile'; }
    fail(e);
  });
}

function wireProfile(clientId, draftId){
  // The accordion is wired first: the build button is absent once a profile
  // exists, and returning early on that would leave every section stuck shut.
  wireProfileSections();
  if (!el('mkProfile')) return;
  el('mkProfile').addEventListener('click', function(){
    makeProfile(clientId, draftId, this);
  });
}

function openClient(clientId){
  el('hTitle').textContent = 'Client';
  el('hSub').textContent = '';
  el('view').innerHTML = loading();
  // getClientDetail returns billingOptions but not cadences, so the intake
  // options are fetched alongside rather than duplicating CADENCES here.
  Promise.all([
    api('getClientDetail', TOKEN, clientId),
    CACHE.options ? Promise.resolve(CACHE.options) : api('getIntakeOptions')
  ]).then(function(res){
    var d = res[0];
    CACHE.options = res[1];

    // A deleted row, or a response the server could not serialise, used to
    // reach `d.client` and throw a TypeError that told nobody anything.
    if (!d || !d.client){
      el('hTitle').textContent = 'Client';
      // Two different failures, and telling them apart is the whole point: a
      // structured notFound means the row is gone, while a null means the
      // server could not serialise its reply — usually a formula error in a
      // cell — and no amount of looking at the Clients tab will explain it.
      el('view').innerHTML = '<button class="back" id="back">← All clients</button>'
        + emptyState(d && d.notFound ? 'Client not found' : 'Could not read this client',
            (d && d.message) || 'The server returned nothing for ' + clientId
            + '. That usually means a cell on its row holds a formula error '
            + '(#REF!, #N/A, #VALUE!). Check the row in the Clients tab.');
      el('back').addEventListener('click', function(){ go('clients'); });
      return;
    }

    DETAIL = d;
    var c = d.client || {};
    el('hTitle').textContent = c.company || 'Client';
    el('hSub').textContent = (c.status || '') + (c.owner ? ' · ' + c.owner : '');

    var h = '<button class="back" id="back">← All clients</button>';

    // Creating a client and committing it to an onboarding are separate acts.
    // Once tasks exist there are due dates, owners and a queue entry, so the
    // second one gets its own deliberate button.
    if (c.onboarding !== 'Started' && c.onboarding !== 'Complete'){
      h += '<div class="okbox" style="margin-top:14px"><b>Onboarding not started</b>'
        + '<div>Check the details below, then start it. That builds the dated task '
        + 'checklist from the services and platforms, and creates the Drive folder.</div>'
        + '<div class="startrow">'
        + '<label class="mini"><input type="checkbox" id="optCall" checked> Weekly onboarding call</label>'
        + '<label class="mini"><input type="checkbox" id="optDrive" checked> Create Drive folder</label>'
        + '<label class="mini"><input type="checkbox" id="optPlan"> Generate onboarding plan</label>'
        + '<button class="btn pri" id="startOnb">Start onboarding</button></div></div>';
    }

    // Who they are and where they are, above everything else. This was
    // scattered down the page in an editable form, so answering "what is their
    // website" meant scrolling past ten thousand characters of profile.
    h += factsCard(c);

    var ps = d.phaseState || {};
    var s = d.summary || {done:0, total:0, pct:0};
    if (ps.phases && ps.phases.length){
      h += '<div class="grp">Phase</div><div class="card"><div class="rail">'
        + ps.phases.map(function(p){
            var cls = p.phase < ps.current ? 'done' : (p.phase === ps.current ? 'cur' : '');
            return '<div class="step ' + cls + '"><div class="p">Phase ' + p.phase + '</div>'
              + '<div class="n">' + esc(p.name) + '</div></div>';
          }).join('')
        + '</div><div class="row" style="border-top:1px solid var(--line)">'
        + '<div class="who"><div class="co">' + s.done + ' of ' + s.total
        + ' tasks complete</div><div class="meta">' + s.pct + '%</div></div>'
        + ticks(s.done, s.total) + '</div></div>';
    } else {
      h += '<div class="grp">Progress</div><div class="card"><div class="row">'
        + '<div class="who"><div class="co">' + s.done + ' of ' + s.total
        + ' tasks complete</div><div class="meta">' + s.pct + '%</div></div>'
        + ticks(s.done, s.total) + '</div></div>';
    }

    h += '<div class="grp">Client profile</div><div class="card">'
      + '<div class="sect prof-half" id="profWrap">' + profileCard(c.profile) + '</div></div>';

    h += '<div class="grp">Recent context</div><div class="card">'
      + '<div class="sect" id="recentWrap">' + loading() + '</div></div>';

    h += '<div class="grp"><button class="phtog" id="scopeTog">'
      + '<span class="tw">▶</span>Scope confirmation '
      + '<span class="st">drafted from the signed contract</span></button></div>'
      + '<div class="card" id="scopeCard" style="display:none">'
      + '<div class="sect" id="scopeWrap">' + scopeCard(null) + '</div></div>';

    h += '<div class="grp"><button class="phtog" id="slackTog">'
      + '<span class="tw">▶</span>Slack <span class="st">'
      + (c.slack ? esc(c.slack) : 'no channel yet') + '</span></button></div>'
      + '<div class="card" id="slackCard" style="display:none">'
      + '<div class="sect" id="slackWrap">' + slackCard(c) + '</div></div>';

    h += '<div class="grp">Action items</div><div class="card">'
      + '<div class="sect" id="actWrap">' + loading() + '</div></div>';

    // Filled in after the page paints. The documents are a second read and
    // should not hold up everything else on the page.
    h += '<div class="grp">Deal documents</div><div class="card">'
      + '<div class="sect" id="docsWrap">' + loading() + '</div>'
      + '<div class="sect" id="callsWrap">' + callsCard(null) + '</div></div>';

    var tasks = d.tasks || [];
    var byPhase = {};
    tasks.forEach(function(t){ (byPhase[t.phase] = byPhase[t.phase] || []).push(t); });
    var canPing = !!(c.slack);
    var curPhase = (d.phaseState && d.phaseState.current) || 1;
    Object.keys(byPhase).sort().forEach(function(k){
      // Only what is still open can be nudged, so a phase that is finished
      // offers nothing rather than a button that posts "nothing outstanding".
      var openHere = byPhase[k].filter(function(t){
        return t.status !== 'Complete' && t.status !== 'N/A';
      });
      // A phase that is finished, or has not begun, is folded away. Five open
      // phases is most of the page and only one of them is this week's work.
      var doneHere = byPhase[k].length - openHere.length;
      var allDone = !openHere.length;
      var notStarted = doneHere === 0 && Number(k) > curPhase;
      var shut = allDone || notStarted;
      var state = allDone ? 'all done'
        : (notStarted ? 'not started' : doneHere + ' of ' + byPhase[k].length + ' done');

      h += '<div class="grp"><button class="phtog" data-ph="' + esc(k) + '">'
        + '<span class="tw">' + (shut ? '▶' : '▼') + '</span>Phase ' + esc(k)
        + ' <span class="n">' + byPhase[k].length + '</span>'
        + '<span class="st">' + state + '</span></button>'
        + (canPing && openHere.length
            ? '<button class="gact" data-pingphase="' + esc(k) + '">Ping '
              + openHere.length + ' outstanding</button>' : '')
        + '</div><div class="card phbody" data-phbody="' + esc(k) + '"'
        + (shut ? ' style="display:none"' : '') + '>';
      h += byPhase[k].map(function(t){
        var open = t.status !== 'Complete' && t.status !== 'N/A';
        return '<div class="task"><div class="n">' + esc(t.task)
          + (t.gate ? ' <span class="pill">gate</span>' : '') + '</div>'
          + assignCell(t, d.assignees || [])
          + '<select data-task="' + esc(t.task) + '">'
          + (d.statuses || []).map(function(o){
              return '<option' + (o === t.status ? ' selected' : '') + '>' + esc(o) + '</option>';
            }).join('') + '</select>'
          + (canPing && open
              ? '<button class="ping" data-ping="' + esc(t.task)
                + '" title="Ping this in ' + esc(c.slack) + '">◎</button>'
              : '<span class="ping" style="visibility:hidden"></span>')
          + '</div>';
      }).join('');
      h += '</div>';
    });

    h += '<div class="grp">Add a task</div><div class="card"><div class="sect">'
      + '<div class="hint">The seeded checklist covers access and the standard '
      + 'beats. It cannot cover "chase the dev for the theme file" — and a '
      + 'checklist you cannot add to is one people stop using.</div>'
      + '<div class="fields">'
      + '<div class="f wide"><label>Task</label>'
      + '<input id="ntName" placeholder="What needs doing"></div>'
      + '<div class="f"><label>Phase</label><select id="ntPhase">'
      + [1,2,3,4,5].map(function(n){
          return '<option' + (n === curPhase ? ' selected' : '') + '>' + n + '</option>';
        }).join('') + '</select></div>'
      + '<div class="f"><label>Owner</label><select id="ntOwner">'
      + '<option value="">Unassigned</option>'
      + (d.assignees || []).map(function(p){
          return '<option>' + esc(p.name) + '</option>';
        }).join('') + '</select></div>'
      + '<div class="f"><label>Due</label><input id="ntDue" type="date"></div>'
      + '<div class="f"><label>Notes</label><input id="ntNotes"></div>'
      + '</div><div class="startrow">'
      + '<button class="btn pri" id="addTask">Add task</button></div></div></div>';

    // Only the fields updateClientField accepts — anything else silently
    // returns { ok:false, message:'Unknown field.' }.
    h += '<div class="grp">Details</div><div class="card"><div class="sect"><div class="fields">'
      + pField('status', 'Status', c.status, CLIENT_STATUSES)
      + pField('owner', 'Onboarding owner', c.owner)
      + pField('cadence', 'Meeting cadence', c.cadence, d.cadences || CACHE.options.cadences)
      + pField('term', 'Contract term', c.term, d.terms)
      + pField('bizType', 'Business type', c.bizType, d.bizTypes)
      // Completed belongs on this list. By the time anyone opens the client
      // page the call has usually happened, and a state list that cannot say so
      // leaves it reading "Scheduled" forever.
      + pField('call', 'Onboarding call', c.call,
               CALL_STATES.concat(['Completed']))
      + pField('slack', 'Slack channel', c.slack)
      + pField('alias', 'Email alias', c.alias)
      + pField('approvals', 'Approvals contact', c.approvals)
      + pField('scope', 'Scope', c.scope, null, true)
      + '</div></div></div>';

    h += '<div class="grp">Links</div><div class="card"><div class="row">'
      + '<div class="who"><div class="meta">'
      + (c.alias ? 'Alias ' + esc(c.alias) : 'No alias yet') + '</div></div>'
      + (c.drive ? '<a class="btn sm" href="' + esc(c.drive) + '" target="_blank">Drive</a>'
                 : '<button class="btn sm" id="mkDrive">Create Drive folder</button>')
      + '</div></div>';

    h += '<div class="grp">Danger zone</div><div class="card"><div class="sect">'
      + '<h3>Delete this client</h3>'
      + '<div class="hint">Removes the client row, its task checklist, its intake '
      + 'row and any generated plans. The draft it came from is kept, along with '
      + 'every document in Drive — it goes back to the resume list so you can '
      + 'create the client again.</div>'
      + '<div class="startrow"><button class="btn danger" id="delClient">'
      + 'Delete client</button></div></div></div>';

    el('view').innerHTML = h;
    el('back').addEventListener('click', function(){ go('clients'); });

    if (el('slackTog')){
      el('slackTog').addEventListener('click', function(){
        var b = el('slackCard');
        var shut = b.style.display === 'none';
        b.style.display = shut ? '' : 'none';
        el('slackTog').querySelector('.tw').textContent = shut ? '▼' : '▶';
      });
    }
    if (el('scopeTog')){
      el('scopeTog').addEventListener('click', function(){
        var b = el('scopeCard');
        var shut = b.style.display === 'none';
        b.style.display = shut ? '' : 'none';
        el('scopeTog').querySelector('.tw').textContent = shut ? '▼' : '▶';
      });
    }
    wireScope(clientId);
    wireSlack(clientId, c);
    wireCalls(clientId);
    loadRecent(clientId);
    loadActions(clientId);

    loadDocs(clientId);

    el('delClient').addEventListener('click', function(){
      var b = this;
      if (b.getAttribute('data-armed') !== '1'){
        b.setAttribute('data-armed', '1');
        b.textContent = 'Really delete ' + (c.company || clientId) + '?';
        setTimeout(function(){
          if (!b.parentNode) return;
          b.removeAttribute('data-armed'); b.textContent = 'Delete client';
        }, 5000);
        return;
      }
      b.disabled = true; b.textContent = 'Deleting…';
      api('deleteClient', TOKEN, clientId).then(function(r){
        if (!r.ok){
          b.disabled = false; b.textContent = 'Delete client';
          toast(r.message || 'Could not delete.', true);
          return;
        }
        CACHE.overview = null; CACHE.queue = null;
        var bits = [];
        if (r.removed.tasks) bits.push(r.removed.tasks + ' tasks');
        if (r.removed.intake) bits.push('the intake row');
        if (r.removed.plans) bits.push(r.removed.plans + ' plans');
        toast('Deleted ' + (c.company || clientId)
          + (bits.length ? ' and ' + bits.join(', ') : '')
          + (r.draftFreed ? '. The draft is back in the list.' : '.'));
        go('clients');
      }).catch(function(e){
        b.disabled = false; b.textContent = 'Delete client'; fail(e);
      });
    });

    // The draft that produced this client is where the documents live, so the
    // profile can be rebuilt months later without re-uploading anything.
    var draftId = (PENDING_PROFILE && PENDING_PROFILE.clientId === clientId)
      ? PENDING_PROFILE.draftId : (c.draftId || '');
    wireProfile(clientId, draftId);

    // Straight after Create client, build it without being asked — that is the
    // moment the documents are certainly still there and the request was to
    // have this happen on create.
    if (PENDING_PROFILE && PENDING_PROFILE.clientId === clientId){
      var pend = PENDING_PROFILE;
      PENDING_PROFILE = null;
      if (!c.profile) makeProfile(clientId, pend.draftId, el('mkProfile'));
    }

    [].forEach.call(document.querySelectorAll('[data-field]'), function(inp){
      inp.addEventListener('change', function(){
        api('updateClientField', TOKEN, clientId, inp.getAttribute('data-field'), inp.value)
          .then(function(r){
            toast(r.ok ? 'Saved.' : (r.message || 'Could not save.'), !r.ok);
            CACHE.overview = null; CACHE.queue = null;
          }).catch(fail);
      });
    });

    [].forEach.call(document.querySelectorAll('select[data-task]'), function(sel){
      sel.addEventListener('change', function(){
        api('updateTaskStatus', TOKEN, clientId, sel.getAttribute('data-task'), sel.value)
          .then(function(r){

            CACHE.overview = null; CACHE.queue = null;
          }).catch(fail);
      });
    });

    // One handler for both: a single-task ping is a list of one, so the two
    // buttons differ only in how many names they send.
    function pingTasks(btn, tasks, label){
      var was = btn.innerHTML;
      btn.disabled = true; btn.innerHTML = '…';
      api('slackPingTasks', TOKEN, clientId, tasks).then(function(r){
        btn.disabled = false; btn.innerHTML = was;
        if (!r.ok){ toast(r.message, !r.nothing); return; }
        toast('Posted ' + r.posted + ' to ' + r.channel
          + (r.owners > 1 ? ', grouped by owner' : '')
          + (r.joined ? ' (bot joined the channel)' : '') + '.');
      }).catch(function(e){
        btn.disabled = false; btn.innerHTML = was; fail(e);
      });

    [].forEach.call(document.querySelectorAll('[data-ph]'), function(b){
      b.addEventListener('click', function(){

      });

    if (el('addTask')){
      el('addTask').addEventListener('click', function(){
        var b = this;

          task: name,
          phase: Number(el('ntPhase').value) || 1,
          owner: el('ntOwner').value,

        }).then(function(r){

          toast('Added "' + r.task + '" to phase ' + r.phase + '.');
          CACHE.overview = null;
          openClient(clientId);
        }).catch(function(e){
          b.disabled = false; b.textContent = 'Add task'; fail(e);

    [].forEach.call(document.querySelectorAll('[data-ping]'), function(b){

    [].forEach.call(document.querySelectorAll('[data-pingphase]'), function(b){
      b.addEventListener('click', function(){
        var phase = b.getAttribute('data-pingphase');
        var names = (d.tasks || []).filter(function(t){

        }).map(function(t){ return t.task; });

      });
