<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Lockhern Digital brand.
     Blues and greys come from the brand sheet. Tertiary navy (#0E2970) is
     used for text and the logo mark only, never as a surface — it makes the
     whole tool feel like a database admin panel.

     Status colours are darker steps than the stock palette so all four clear
     3:1 against both the card and the page (the lighter amber and orange did
     not). They are reserved for state, never decoration, and every one renders
     beside its own word — "3 overdue", "1 blocked" — so hue never carries the
     meaning by itself. Blocked and overdue deliberately share a red: they are
     both problems, and the label is what tells them apart. */
  :root{
    --blue:#317AE0; --blue-dk:#2A62B4; --blue-ink:#0E2970;
    --blue-wash:#EAF1FC; --blue-line:#CFE0F7;
    --ink:#0E0E0E; --muted:#6B7A99; --faint:#8E9BB5;
    --line:#E7ECF4; --mid:#BAC3D6;
    --paper:#F7F9FC; --surface:#FFFFFF;
    --good:#0F7B2E; --warning:#B26A00; --critical:#C22B2B; --serious:#C22B2B;
    --tick-off:#DDE4EF;
    --sidebar-w:216px;
    --shadow:0 1px 2px rgba(14,41,112,.05), 0 1px 3px rgba(14,41,112,.04);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0; background:var(--paper); color:var(--ink);
    font:15px/1.55 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased; font-feature-settings:"cv11","ss01"}
  .num,.stat .v,.frac{font-variant-numeric:tabular-nums}
  .eyebrow{font-size:12.5px; font-weight:500; color:var(--muted); letter-spacing:0;
    text-transform:none}
  h1,h2,h3{margin:0; font-weight:600; letter-spacing:-.011em}
  a{color:var(--blue); text-decoration:none}
  a:hover{text-decoration:underline}

  /* ---------------------------------------------------------------- gate */
  #gate{max-width:340px; margin:14vh auto; padding:0 20px}
  #gate .mark{width:42px; height:42px; border-radius:10px; background:var(--blue);
    display:grid; place-items:center; color:#fff; font-size:16px; font-weight:700;
    margin-bottom:20px; letter-spacing:-.02em}
  #gate h1{font-size:24px; margin:0 0 6px}
  #gate p{color:var(--muted); font-size:14.5px; margin:0 0 22px}
  #pin{width:100%; padding:13px 14px; border:1px solid var(--line); border-radius:9px;
    font:17px/1 "Inter",sans-serif; letter-spacing:.22em; text-align:center;
    background:var(--surface); color:var(--ink)}
  #pin::placeholder{letter-spacing:.1em; color:var(--mid)}
  #pin:focus{outline:none; border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-wash)}
  #gateMsg{margin-top:12px; font-size:13.5px; color:var(--critical); min-height:18px}

  /* --------------------------------------------------------------- shell */
  #app{display:none; min-height:100%}
  #app.on{display:grid; grid-template-columns:var(--sidebar-w) 1fr;
    background:linear-gradient(90deg, var(--surface) 0, var(--surface) var(--sidebar-w),
      var(--paper) var(--sidebar-w))}

  nav{background:var(--surface); border-right:1px solid var(--line); padding:18px 12px;
    position:sticky; top:0; height:100vh; display:flex; flex-direction:column}
  nav .brand{display:flex; align-items:center; gap:10px; padding:2px 8px 22px}
  nav .brand .mark{width:30px; height:30px; border-radius:8px; background:var(--blue);
    display:grid; place-items:center; color:#fff; font-size:12.5px; font-weight:700;
    letter-spacing:-.02em}
  nav .brand b{font-size:15px; font-weight:600; color:var(--blue-ink); letter-spacing:-.012em}
  nav button{display:flex; align-items:center; gap:11px; width:100%; text-align:left;
    background:none; border:0; color:var(--muted); padding:9px 10px; cursor:pointer;
    font:500 14.5px/1.2 "Inter",sans-serif; border-radius:8px; margin-bottom:2px}
  nav button:hover{color:var(--blue-ink); background:var(--paper)}
  nav button.on{color:var(--blue); background:var(--blue-wash); font-weight:600}
  nav button .ic{width:18px; text-align:center; font-size:15px; opacity:.85}
  nav .spacer{flex:1}
  nav .foot{padding:12px 10px 0; font-size:12.5px; color:var(--faint); border-top:1px solid var(--line)}
  nav .foot button{padding:5px 0; font-size:13px; color:var(--muted)}
  nav .foot button:hover{background:none; color:var(--blue)}

  main{min-width:0; display:flex; flex-direction:column}
  header{display:flex; align-items:center; gap:14px; padding:20px 28px 16px;
    background:var(--paper); position:sticky; top:0; z-index:5;
    border-bottom:1px solid var(--line)}
  header h1{font-size:21px; margin-right:auto}
  header .sub{color:var(--muted); font-size:13.5px}
  .wrap{padding:22px 28px 48px; max-width:1120px; width:100%}

  /* --------------------------------------------------------------- bits */
  button.btn{border:1px solid var(--line); background:var(--surface); color:var(--ink);
    padding:8px 14px; border-radius:8px; cursor:pointer;
    font:500 13.5px/1.2 "Inter",sans-serif; box-shadow:var(--shadow)}
  button.btn:hover{border-color:var(--mid); background:var(--paper)}
  button.btn.pri{background:var(--blue); border-color:var(--blue); color:#fff; font-weight:600}
  button.btn.pri:hover{background:var(--blue-dk); border-color:var(--blue-dk)}
  button.btn:disabled{opacity:.5; cursor:default}
  button.btn.sm{padding:6px 11px; font-size:13px}
  a.btn{display:inline-block; text-decoration:none}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:12px;
    box-shadow:var(--shadow)}
  .grp{font-size:13.5px; font-weight:600; color:var(--muted); letter-spacing:0;
    text-transform:none; padding:26px 2px 10px; display:flex; align-items:center; gap:8px}
  .grp .n{color:var(--faint); font-weight:400}

  /* Stat tiles, not charts — each is a single headline number, so a plot
     would add nothing but ink. */
  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:12px}
  .stat{padding:16px 18px}
  .stat .k{display:flex; align-items:center; gap:7px; margin-bottom:9px}
  .stat .v{font-size:32px; font-weight:600; line-height:1; letter-spacing:-.025em}
  .stat .cap{font-size:13px; color:var(--faint); margin-top:6px}
  .dot{width:9px; height:9px; border-radius:50%; flex:none; display:inline-block}
  .dot.good{background:var(--good)} .dot.warning{background:var(--warning)}
  .dot.serious{background:var(--serious)} .dot.critical{background:var(--critical)}
  .dot.idle{background:var(--mid)}

  .row{display:flex; align-items:center; gap:13px; padding:14px 18px;
    border-top:1px solid var(--line)}
  .row:first-child{border-top:0}
  .row .who{flex:1; min-width:0}
  .row .co{font-weight:600; font-size:15px; letter-spacing:-.01em; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap}
  .row .meta{color:var(--muted); font-size:13.5px; margin-top:2px}
  .row .act{display:flex; gap:8px; flex:none}
  .row.clickable{cursor:pointer}
  .row.clickable:hover{background:var(--paper)}

  .pill{font-size:12.5px; font-weight:500; letter-spacing:0; text-transform:none;
    padding:4px 10px; border-radius:20px; background:var(--paper); color:var(--muted);
    flex:none; display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line)}
  .pill.critical{background:#FDECEC; color:#9B2020; border-color:#F6D5D5}
  .pill.warning{background:#FDF3E3; color:#8A5200; border-color:#F3E2C4}
  .pill.serious{background:#FDECEC; color:#9B2020; border-color:#F6D5D5}
  .pill.good{background:#E9F6EE; color:#0D6528; border-color:#CDE9D8}

  /* One tick per task, filled = complete. Magnitude against a known whole. */
  .ticks{display:flex; gap:2px; flex:none}
  .tick{width:6px; height:16px; border-radius:2px; background:var(--tick-off)}
  .tick.on{background:var(--blue)}
  .frac{font-size:13px; color:var(--muted); flex:none; min-width:52px; text-align:right}

  .empty{padding:34px 20px; text-align:center; color:var(--faint); font-size:14px}
  .empty b{display:block; color:var(--muted); font-weight:600; margin-bottom:4px; font-size:15px}
  .skel{height:13px; background:linear-gradient(90deg,#EDF1F7,#F7F9FC,#EDF1F7);
    background-size:200% 100%; animation:sh 1.3s infinite; border-radius:5px}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}

  .toast{position:fixed; right:22px; bottom:22px; background:var(--blue-ink); color:#fff;
    padding:13px 17px; border-radius:10px; font-size:14px; max-width:360px; z-index:50;
    box-shadow:0 8px 26px rgba(14,41,112,.22)}
  .toast.bad{background:#8F2020}

  /* --------------------------------------------------------------- forms */
  .form{max-width:760px}
  .sect{padding:22px 24px; border-top:1px solid var(--line)}
  .sect:first-child{border-top:0}
  .sect h3{font-size:16px; margin-bottom:3px}
  .sect .hint{color:var(--faint); font-size:13.5px; margin-bottom:18px}
  .fields{display:grid; grid-template-columns:1fr 1fr; gap:16px}
  .f{display:flex; flex-direction:column; gap:6px}
  .f.wide{grid-column:1/-1}
  .f label{font-size:13.5px; font-weight:500; color:var(--muted); letter-spacing:0;
    text-transform:none}
  .f input,.f select,.f textarea{padding:10px 12px; border:1px solid var(--line);
    border-radius:8px; font:14.5px/1.5 "Inter",sans-serif; background:var(--surface);
    color:var(--ink); width:100%}
  .f textarea{min-height:92px; resize:vertical}
  .f input::placeholder,.f textarea::placeholder{color:var(--mid)}
  .f input:focus,.f select:focus,.f textarea:focus{outline:none; border-color:var(--blue);
    box-shadow:0 0 0 3px var(--blue-wash)}
  .f .note{font-size:12.5px; color:var(--faint)}
  .checks{display:grid; grid-template-columns:repeat(auto-fill,minmax(232px,1fr)); gap:9px}
  .chk{display:flex; align-items:flex-start; gap:10px; padding:11px 13px;
    border:1px solid var(--line); border-radius:9px; cursor:pointer; background:var(--surface)}
  .chk:hover{border-color:var(--blue-line); background:var(--paper)}
  .chk.on{border-color:var(--blue); background:var(--blue-wash)}
  .chk input{margin:2px 0 0; accent-color:var(--blue); width:15px; height:15px}
  .chk .nm{font-size:14px; font-weight:500}
  .chk .cat{font-size:12.5px; color:var(--faint)}
  .bar{display:flex; gap:12px; align-items:center; padding:18px 24px;
    border-top:1px solid var(--line); background:var(--paper); border-radius:0 0 12px 12px}
  .bar .sp{flex:1}
  /* The reading bar runs to four controls plus a status line; without this the
     status text steals width and clips the label off the primary button. */
  .bar .btn{flex:none; white-space:nowrap}
  .bar .note{min-width:0}
  /* The reading bar can reach five controls once a draft offers its previous
     analysis. Status gets its own line rather than competing for width. */
  .bar.rbar{flex-wrap:wrap; row-gap:10px}
  .bar.rbar .note{flex:1 0 100%; order:-1}

  /* -------------------------------------------------------------- detail */
  .back{background:none; border:0; color:var(--muted); cursor:pointer; padding:0;
    font:500 13.5px/1 "Inter",sans-serif}
  .back:hover{color:var(--blue)}
  .rail{display:flex; gap:8px; padding:18px; overflow-x:auto}
  .step{flex:1; min-width:118px; padding:11px 13px; border-radius:9px;
    background:var(--paper); border:1px solid var(--line)}
  .step.done{background:#EDF7F1; border-color:#CFE7DA}
  .step.cur{background:var(--blue); border-color:var(--blue); color:#fff}
  .step .p{font-size:12px; font-weight:500; opacity:.72}
  .step .n{font-size:14px; font-weight:600; margin-top:4px; letter-spacing:-.008em}
  .task{display:flex; align-items:center; gap:12px; padding:12px 18px;
    border-top:1px solid var(--line)}
  .task .n{flex:1; min-width:0; font-size:14.5px}
  .task select{padding:7px 9px; border:1px solid var(--line); border-radius:7px;
    font:13.5px/1 "Inter",sans-serif; background:var(--surface); width:148px; flex:none;
    color:var(--ink)}
  .task select:focus{outline:none; border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-wash)}
  .modal{position:fixed; inset:0; background:rgba(14,41,112,.34); display:grid;
    place-items:center; padding:24px; z-index:40}
  .modal .box{background:var(--surface); border-radius:14px; max-width:660px; width:100%;
    max-height:86vh; overflow:auto; box-shadow:0 18px 50px rgba(14,41,112,.26)}
  .modal .hd{padding:18px 22px; border-bottom:1px solid var(--line); display:flex;
    align-items:center; gap:11px; position:sticky; top:0; background:var(--surface)}
  .modal .hd h3{font-size:16px; margin-right:auto}
  .modal .bd{padding:18px 22px; font-size:14.5px; white-space:pre-wrap; line-height:1.62;
    color:#26303F}
  .modal .subj{font-size:13.5px; color:var(--muted); padding:0 22px 14px}
  .modal .subj b{color:var(--ink); font-weight:600}

  /* ------------------------------------------------------- intake step 1 */
  /* Banners share the form's measure so the column has one left and right
     edge rather than two competing ones. */
  .steps,.okbox,.warnbox,.qbox{max-width:760px}
  .steps{display:flex; gap:8px; align-items:center; margin-bottom:16px}
  .stp{font-size:13px; font-weight:500; color:var(--faint); padding:5px 12px;
    border-radius:20px; background:var(--surface); border:1px solid var(--line)}
  .stp.on{color:var(--blue); border-color:var(--blue-line); background:var(--blue-wash);
    font-weight:600}
  .stp.done{color:var(--muted); cursor:pointer}
  .stp.done:hover{border-color:var(--mid); color:var(--blue-ink)}

  .okbox,.warnbox,.qbox{border-radius:10px; padding:14px 16px; margin-bottom:12px;
    font-size:13.5px; line-height:1.55}
  .okbox{background:var(--blue-wash); border:1px solid var(--blue-line); color:var(--blue-ink)}
  .warnbox{background:#FDF3E3; border:1px solid #F3E2C4; color:#7A4A00}
  .qbox{background:var(--surface); border:1px solid var(--line); color:var(--ink)}
  .okbox b,.warnbox b,.qbox b{display:block; margin-bottom:3px; font-weight:600}
  .qbox ul{margin:6px 0 0; padding-left:20px}
  .qbox li{margin-bottom:4px}
  .warnbox .q{margin-top:5px; color:#6B4A10; font-style:italic}
  .warnbox .note{margin-top:6px; color:#8A6A30; font-style:normal}

  /* The sentence a value came from. Shown by default, not behind a hover —
     the whole point is checking the number without going looking for it. */
  .src{display:flex; align-items:flex-start; gap:7px; margin-top:5px; font-size:12px;
    color:var(--muted); line-height:1.45}
  .src .cf{flex:none; padding:1px 7px; border-radius:20px; background:var(--blue-wash);
    color:var(--blue-ink); font-weight:500; font-size:11px; text-transform:capitalize}
  .src.low .cf{background:#FDF3E3; color:#8A5200}
  .src .qt{flex:1; min-width:0; font-style:italic}
  .src .sr{flex:none; color:var(--faint)}
  .f.filled input,.f.filled select,.f.filled textarea{background:#FCFDFF;
    border-color:var(--blue-line)}

  .drop{display:flex; align-items:center; gap:10px; margin-top:7px}
  .drop .fn{font-size:12.5px; color:var(--faint)}
  .drop .fn.has{color:var(--blue-ink); font-weight:500}
  .drop .fn.bad{color:var(--critical)}
  .drop .clr{background:none; border:0; color:var(--muted); font:500 12.5px/1 "Inter",sans-serif;
    cursor:pointer; padding:4px}
  .drop .clr:hover{color:var(--critical)}
  .f textarea:disabled{background:var(--paper); color:var(--faint)}

  /* Client profile — prose, so it gets reading measure and spacing */
  .prof{max-width:760px; font-size:14px; line-height:1.65; color:var(--ink)}
  .prof p{margin:0 0 10px}
  .prof h4{font-size:12px; font-weight:600; text-transform:uppercase;
    letter-spacing:.05em; color:var(--muted); margin:18px 0 7px}
  .prof h4:first-child{margin-top:0}
  .prof ul{margin:0 0 10px; padding-left:18px}
  .prof li{margin-bottom:5px}

  /* Draft resume list */
  .drow{display:flex; gap:12px; align-items:center; padding:12px 0;
    border-top:1px solid var(--line)}
  .drow:first-child{border-top:0}
  .drow .bd{flex:1; min-width:0}
  .drow .nm{font-size:14px; font-weight:500; color:var(--ink);
    display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .drow .tag{font-size:11px; font-weight:600; text-transform:uppercase;
    letter-spacing:.03em; padding:2px 7px; border-radius:5px;
    background:var(--blue-wash); color:var(--blue-ink)}
  .drow .tag.done{background:#E6F4EA; color:var(--good)}
  .drow .mt{font-size:12.5px; color:var(--faint); margin-top:2px}
  .dbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    font-size:12.5px; color:var(--muted); background:var(--blue-wash);
    border:1px solid var(--blue-line); border-radius:8px;
    padding:9px 12px; margin-bottom:16px}
  .dbar b{color:var(--blue-ink); font-weight:600}
  .dbar .sp{flex:1}
  .lnk{background:none; border:0; padding:0; cursor:pointer; color:var(--blue);
    font:500 12.5px/1 "Inter",sans-serif; text-decoration:underline}
  .lnk:hover{color:var(--blue-dk)}

  /* Reading checklist — one row per source, updated as each one resolves. */
  .rrow{display:flex; gap:12px; padding:14px 0; border-top:1px solid var(--line)}
  .rrow:first-child{border-top:0}
  .rrow .ic{flex:none; width:20px; height:20px; margin-top:1px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font:600 11px/1 "Inter",sans-serif; color:#fff}
  .rrow .ic.wait{background:var(--tick-off)}
  .rrow .ic.read{background:var(--blue-wash); border:2px solid var(--blue);
    border-right-color:transparent; box-sizing:border-box; animation:spin .7s linear infinite}
  .rrow .ic.ok{background:var(--good)}
  .rrow .ic.fail{background:var(--critical)}
  .rrow .ic.skip{background:var(--mid)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .rrow .bd{flex:1; min-width:0}
  .rrow .nm{font-size:14px; font-weight:500; color:var(--ink);
    display:flex; gap:8px; align-items:baseline; flex-wrap:wrap}
  .rrow .via{font-size:12px; font-weight:400; color:var(--faint)}
  .rrow .st{font-size:13px; color:var(--muted); margin-top:3px}
  .rrow.fail .st{color:var(--critical)}
  .rrow .pv{font-size:12.5px; color:var(--faint); font-style:italic; margin-top:4px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .rrow .hnt{font-size:12.5px; color:var(--muted); margin-top:4px}
  .rrow .acts{display:flex; gap:8px; margin-top:9px; flex-wrap:wrap}
  .rrow .fix{margin-top:10px; display:none}
  .rrow .fix.on{display:block}
  .rrow .fix textarea{width:100%; min-height:90px; padding:10px 12px;
    border:1px solid var(--line); border-radius:8px; background:var(--surface);
    font:13.5px/1.5 "Inter",sans-serif; color:var(--ink); resize:vertical}
  .rrow .fix textarea:focus{outline:none; border-color:var(--blue);
    box-shadow:0 0 0 3px var(--blue-wash)}
  /* Higher specificity than .sect:first-child, which would otherwise strip the
     divider — the analysing panel is the only child of its wrapper. */
  #thinkWrap .sect{border-top:1px solid var(--line); padding:16px 24px}
  .thinking{display:flex; gap:12px; align-items:flex-start; padding:2px 0}
  .thinking .dots{flex:none; display:flex; gap:5px; margin-top:7px}
  .thinking .dots i{width:7px; height:7px; border-radius:50%; background:var(--blue);
    animation:pulse 1.2s ease-in-out infinite}
  .thinking .dots i:nth-child(2){animation-delay:.18s}
  .thinking .dots i:nth-child(3){animation-delay:.36s}
  @keyframes pulse{0%,100%{opacity:.25; transform:scale(.8)}50%{opacity:1; transform:scale(1)}}
  .thinking .tx{font-size:14px; color:var(--ink)}
  .thinking .el{font-size:12.5px; color:var(--faint); margin-top:2px;
    font-variant-numeric:tabular-nums}

  .feerow{display:flex; gap:9px; align-items:center; margin-bottom:8px}
  .feerow .fl{flex:1; padding:9px 11px; border:1px solid var(--line); border-radius:8px;
    font:14px/1.4 "Inter",sans-serif; background:var(--surface); color:var(--ink)}
  .feerow .fa{width:132px; flex:none; padding:9px 11px; border:1px solid var(--line);
    border-radius:8px; font:14px/1.4 "Inter",sans-serif; text-align:right;
    font-variant-numeric:tabular-nums; background:var(--surface); color:var(--ink)}
  .feerow input:focus{outline:none; border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-wash)}
  .feefoot{display:flex; align-items:center; gap:12px; margin-top:4px}
  .feetot{font-size:14px; color:var(--muted)}
  .feetot b{font-size:18px; color:var(--ink); font-variant-numeric:tabular-nums;
    margin-left:6px}
  .startrow{display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-top:12px}
  .startrow .mini{font-size:13.5px; color:var(--blue-ink); display:flex; align-items:center;
    gap:6px; cursor:pointer}
  .startrow .mini input{accent-color:var(--blue)}
  .startrow .btn{margin-left:auto}

  @media(max-width:760px){
    #app.on{grid-template-columns:1fr; background:var(--paper)}
    nav{height:auto; position:static; flex-direction:row; flex-wrap:wrap; align-items:center;
      padding:10px; border-right:0; border-bottom:1px solid var(--line)}
    nav .brand{padding:0 12px 0 6px}
    nav button{width:auto; margin-bottom:0}
    nav .spacer,nav .foot{display:none}
    .fields{grid-template-columns:1fr}
    /* A single non-wrapping flex row squeezes the company name to nothing and
       pushes the fraction off-screen. Stack identity above the status pills,
       and drop the per-task ticks — at this width they are sub-pixel and the
       fraction carries the same information. */
    .row{flex-wrap:wrap; row-gap:9px}
    .row .who{flex:1 0 100%}
    .row .act{width:100%}
    .ticks{display:none}
    .frac{min-width:0; text-align:left}
    .wrap{padding:18px 16px 36px}
    header{padding:16px}
    .task select{width:132px}
    /* The reading step's bar carries four items; on one row the status text
       wraps to three lines and shoves the primary button off the card. */
    .bar{flex-wrap:wrap}
    .bar .sp{flex:1 0 100%; height:0}
    .bar .note{flex:1 0 100%; order:-1}
    #goAnalyse{flex:1}
  }
</style>
</head>
<body>

<div id="gate">
  <div class="mark">LD</div>
  <h1>Onboarding</h1>
  <p>Enter the dashboard PIN.</p>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="••••">
  <div id="gateMsg"></div>
</div>

<div id="app">
  <nav>
    <div class="brand"><div class="mark">LD</div><b>Onboarding</b></div>
    <button data-v="overview" class="on"><span class="ic">◇</span>Overview</button>
    <button data-v="queue"><span class="ic">▸</span>Queue</button>
    <button data-v="clients"><span class="ic">▤</span>Clients</button>
    <div class="spacer"></div>
    <div class="foot">
      <button class="mono" id="refresh">↻ Refresh</button>
      <div id="stamp"></div>
    </div>
  </nav>
  <main>
    <header>
      <h1 id="hTitle">Overview</h1>
      <span class="sub" id="hSub"></span>
      <button class="btn pri" id="newBtn">+ New client</button>
    </header>
    <div class="wrap" id="view"></div>
  </main>
</div>

<script>
// ---------------------------------------------------------------- plumbing

var TOKEN = '';           // no localStorage in the Apps Script sandbox
var VIEW  = 'overview';
var CACHE = { overview:null, queue:null, platforms:null, options:null };

/**
 * How long a cached read of the sheet stays trustworthy.
 *
 * The database is a spreadsheet that people edit by hand — that is the whole
 * premise — so a cache with no expiry shows deleted clients until someone
 * thinks to press Refresh. Short enough that a sheet edit shows up on the next
 * click, long enough that moving between views does not refetch every time.
 */
var CACHE_TTL_MS = 30000;
var CACHE_AT = {};

function cachedRead(key, fetcher){
  var fresh = CACHE[key] && (Date.now() - (CACHE_AT[key] || 0)) < CACHE_TTL_MS;
  if (fresh) return Promise.resolve(CACHE[key]);
  return fetcher().then(function(d){
    CACHE[key] = d; CACHE_AT[key] = Date.now();
    return d;
  });
}
var DETAIL = null;

/**
 * Every server function this page calls. api() dispatches dynamically, which
 * hides the call sites from scripts/check.mjs — its whole job is proving each
 * google.script.run target exists and is public. So the list is declared here
 * and check.mjs validates it by name instead. Adding a call means adding it
 * here, or api() throws before the round trip.
 */
var SERVER_FNS = [
  'verifyPin', 'getDashboardOverview', 'getSendQueue', 'getClientDetail',
  'updateTaskStatus', 'updateClientField', 'dashCreateDrive',
  'dashPreview', 'dashPreviewNudge', 'dashSend', 'dashSendNudge',
  'getPlatformList', 'getIntakeOptions', 'submitIntake',
  'readSource', 'runExtraction', 'hasClickUpToken', 'startOnboarding',
  'createDraft', 'listDrafts', 'openDraft', 'saveDraft', 'deleteDraft', 'renameDraft',
  'buildClientProfile', 'getClientProfile'
];

/** google.script.run as a promise, so views can chain instead of nest. */
function api(fn){
  var args = [].slice.call(arguments, 1);
  if (SERVER_FNS.indexOf(fn) === -1){
    return Promise.reject(new Error('Unregistered server call: ' + fn));
  }
  return new Promise(function(res, rej){
    google.script.run
      .withSuccessHandler(res)
      .withFailureHandler(function(e){ rej(e); })[fn].apply(null, args);
  });
}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function el(id){ return document.getElementById(id); }
function toast(msg, bad){
  var t = document.createElement('div');
  t.className = 'toast' + (bad ? ' bad' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, bad ? 6000 : 3200);
}
function fail(e){ toast((e && e.message) || String(e), true); }
function ticks(done, total){
  var n = Math.min(total || 0, 26), out = '';
  var on = total ? Math.round((done / total) * n) : 0;
  for (var i = 0; i < n; i++) out += '<div class="tick' + (i < on ? ' on' : '') + '"></div>';
  return '<div class="ticks">' + out + '</div>';
}
/** Status colour always ships with its own text label — never colour alone. */
function pill(kind, label){
  return '<span class="pill ' + kind + '"><span class="dot ' + kind + '"></span>'
    + esc(label) + '</span>';
}
function loading(){
  var r = '';
  for (var i = 0; i < 4; i++){
    r += '<div class="row"><div class="who"><div class="skel" style="width:38%"></div>'
      + '<div class="skel" style="width:22%; margin-top:7px; height:9px"></div></div></div>';
  }
  return '<div class="card">' + r + '</div>';
}
function emptyState(title, body){
  return '<div class="card"><div class="empty"><b>' + esc(title) + '</b>' + esc(body) + '</div></div>';
}

// ---------------------------------------------------------------- gate

el('pin').addEventListener('keydown', function(e){
  if (e.key !== 'Enter') return;
  var v = el('pin').value;
  el('gateMsg').textContent = 'Checking…';
  api('verifyPin', v).then(function(r){
    if (!r.ok){ el('gateMsg').textContent = r.message; el('pin').select(); return; }
    TOKEN = r.token;
    el('gate').style.display = 'none';
    el('app').classList.add('on');
    go('overview');
  }).catch(function(e){ el('gateMsg').textContent = (e && e.message) || 'Failed.'; });
});
el('pin').focus();

// ---------------------------------------------------------------- routing

var TITLES = {
  overview:['Overview','How onboarding is tracking right now'],
  queue:['Queue','What can be sent, and what is blocking the rest'],
  clients:['Clients','Every account and where it has got to'],
  'new':['New client','One submit builds the record, tasks, folder and plan']
};
[].forEach.call(document.querySelectorAll('nav button[data-v]'), function(b){
  b.addEventListener('click', function(){ go(b.getAttribute('data-v')); });
});
el('newBtn').addEventListener('click', function(){ go('new'); });
el('refresh').addEventListener('click', function(){
  CACHE.overview = null; CACHE.queue = null; go(VIEW);
});

function go(v){
  VIEW = v; DETAIL = null;
  [].forEach.call(document.querySelectorAll('nav button[data-v]'), function(b){
    b.classList.toggle('on', b.getAttribute('data-v') === v);
  });
  el('hTitle').textContent = TITLES[v][0];
  el('hSub').textContent = TITLES[v][1];
  el('newBtn').style.display = (v === 'new') ? 'none' : '';
  if (v === 'overview') renderOverview();
  else if (v === 'queue') renderQueue();
  else if (v === 'clients') renderClients();
  else renderIntake();
}
function stamp(){
  var d = new Date();
  el('stamp').textContent = 'Updated ' + d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

// ---------------------------------------------------------------- overview

function renderOverview(){
  el('view').innerHTML = loading();
  var p = cachedRead('overview', function(){ return api('getDashboardOverview', TOKEN); });
  p.then(function(d){
    stamp();
    var t = d.totals || {clients:0, overdue:0, blocked:0, stale:0};
    var live = (d.clients || []).filter(function(c){
      return c.status !== 'Churned' && c.status !== 'Paused';
    });
    // A client belongs to exactly one section. Overdue/blocked outranks
    // waiting, otherwise the same row appears twice and the counts read as
    // more clients in trouble than there are.
    var attention = live.filter(function(c){ return c.overdue || c.blocked; });
    var seen = {};
    attention.forEach(function(c){ seen[c.clientId] = 1; });
    var waiting = live.filter(function(c){
      return !seen[c.clientId] && c.daysWaiting !== null && c.daysWaiting >= 5;
    });

    var h = '<div class="stats">'
      + statTile('idle', 'Onboarding', live.length, live.length === 1 ? 'client active' : 'clients active')
      + statTile('critical', 'Overdue', t.overdue, t.overdue === 1 ? 'client past due' : 'clients past due')
      + statTile('serious', 'Blocked', t.blocked, 'have a blocked task')
      + statTile('warning', 'Waiting', t.stale, 'chased 5+ days ago')
      + '</div>';

    h += '<div class="grp">Needs attention <span class="n">' + attention.length + '</span></div>';
    h += attention.length
      ? '<div class="card">' + attention.map(clientRow).join('') + '</div>'
      : emptyState('Nothing overdue or blocked', 'Every active client is on schedule.');

    if (waiting.length){
      h += '<div class="grp">Waiting on client <span class="n">' + waiting.length + '</span></div>';
      h += '<div class="card">' + waiting.map(clientRow).join('') + '</div>';
    }
    el('view').innerHTML = h;
    wireClientRows();
  }).catch(function(e){
    el('view').innerHTML = emptyState('Could not load', (e && e.message) || 'Unknown error.');
  });
}
function statTile(kind, label, value, cap){
  return '<div class="card stat">'
    + '<div class="k"><span class="dot ' + kind + '"></span>'
    + '<span class="eyebrow">' + esc(label) + '</span></div>'
    + '<div class="v">' + (value || 0) + '</div>'
    + '<div class="cap">' + esc(cap) + '</div></div>';
}
function clientRow(c){
  var tags = '';
  if (c.overdue) tags += pill('critical', c.overdue + ' overdue');
  if (c.blocked) tags += pill('serious', c.blocked + ' blocked');
  if (c.daysWaiting !== null && c.daysWaiting >= 5) tags += pill('warning', c.daysWaiting + 'd waiting');
  if (!tags && c.pct === 100) tags = pill('good', 'complete');
  return '<div class="row clickable" data-id="' + esc(c.clientId) + '">'
    + '<div class="who"><div class="co">' + esc(c.company) + '</div>'
    + '<div class="meta">' + esc(c.status || '—') + (c.owner ? ' · ' + esc(c.owner) : '') + '</div></div>'
    + tags + ticks(c.done, c.total)
    + '<div class="frac">' + c.done + '/' + c.total + '</div></div>';
}
/** One editable Clients-tab field. Saves on change; no explicit save button. */
function pField(field, label, value, options, area){
  var v = value == null ? '' : value;
  var input;
  if (options){
    var has = options.indexOf(v) !== -1;
    input = '<select data-field="' + field + '">'
      + (has ? '' : '<option value="' + esc(v) + '" selected>' + esc(v || '—') + '</option>')
      + options.map(function(o){
          return '<option' + (o === v ? ' selected' : '') + '>' + esc(o) + '</option>';
        }).join('') + '</select>';
  } else if (area){
    input = '<textarea data-field="' + field + '">' + esc(v) + '</textarea>';
  } else {
    input = '<input data-field="' + field + '" value="' + esc(v) + '">';
  }
  return '<div class="f' + (area ? ' wide' : '') + '"><label>' + esc(label) + '</label>'
    + input + '</div>';
}

function wireClientRows(){
  [].forEach.call(document.querySelectorAll('.row.clickable[data-id]'), function(r){
    r.addEventListener('click', function(){ openClient(r.getAttribute('data-id')); });
  });
}

// ---------------------------------------------------------------- queue

function renderQueue(){
  el('view').innerHTML = loading();
  var p = cachedRead('queue', function(){ return api('getSendQueue', TOKEN); });
  p.then(function(q){
    stamp();
    var h = '';
    h += section('Ready to send', q.ready, function(r){
      return actions(r, [['pri', 'Preview', 'preview']]);
    }, 'Nothing is ready', 'Every phase email is either sent or waiting on internal work.');

    h += section('Waiting on client', q.waiting, function(r){
      return (r.days != null ? pill('warning', r.days + 'd') : '')
        + actions(r, [['', 'Nudge', 'nudge']]);
    }, 'Nobody is waiting', 'No outstanding client requests.');

    h += section('Held by internal work', q.gated, function(r){
      return '<div class="frac">' + (r.reasons || []).length + ' gate'
        + ((r.reasons || []).length === 1 ? '' : 's') + '</div>';
    }, 'Nothing held', 'No phase is blocked by internal setup.');

    h += section('Needs fixing', q.blocked, function(r){
      return pill('critical', (r.problems || []).length + ' problem'
        + ((r.problems || []).length === 1 ? '' : 's'));
    }, 'Nothing broken', 'No preflight problems.');

    el('view').innerHTML = h;
    wireQueue();
  }).catch(function(e){
    el('view').innerHTML = emptyState('Could not load', (e && e.message) || 'Unknown error.');
  });
}
function section(title, rows, right, emptyTitle, emptyBody){
  rows = rows || [];
  var h = '<div class="grp">' + esc(title) + ' <span class="n">' + rows.length + '</span></div>';
  if (!rows.length) return h + emptyState(emptyTitle, emptyBody);
  h += '<div class="card">' + rows.map(function(r){
    var detail = [];
    if (r.phaseName) detail.push('Phase ' + r.phase + ' · ' + r.phaseName);
    if (r.owner) detail.push(r.owner);
    if (r.count) detail.push(r.count + ' task' + (r.count === 1 ? '' : 's'));
    var sub = (r.reasons || r.problems || []).slice(0, 2).join(' · ');
    return '<div class="row"><div class="who">'
      + '<div class="co">' + esc(r.company) + '</div>'
      + '<div class="meta">' + esc(detail.join(' · ')) + (sub ? ' — ' + esc(sub) : '') + '</div>'
      + '</div>' + right(r) + '</div>';
  }).join('') + '</div>';
  return h;
}
function actions(r, list){
  return '<div class="act">' + list.map(function(a){
    return '<button class="btn sm ' + a[0] + '" data-act="' + a[2] + '" data-id="'
      + esc(r.clientId) + '" data-phase="' + (r.phase || '') + '">' + a[1] + '</button>';
  }).join('') + '</div>';
}
function wireQueue(){
  [].forEach.call(document.querySelectorAll('[data-act]'), function(b){
    b.addEventListener('click', function(){
      var id = b.getAttribute('data-id'), ph = b.getAttribute('data-phase');
      var nudge = b.getAttribute('data-act') === 'nudge';
      b.disabled = true; b.textContent = '…';
      var call = nudge ? api('dashPreviewNudge', TOKEN, id) : api('dashPreview', TOKEN, id, Number(ph));
      call.then(function(p){
        b.disabled = false; b.textContent = nudge ? 'Nudge' : 'Preview';
        if (!p.ok){ toast(p.message || 'Cannot preview.', true); return; }
        showPreview(p, id, ph, nudge);
      }).catch(function(e){
        b.disabled = false; b.textContent = nudge ? 'Nudge' : 'Preview'; fail(e);
      });
    });
  });
}

/** Preview is read-only by contract — opening this must never mark anything. */
function showPreview(p, clientId, phase, nudge){
  var m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = '<div class="box">'
    + '<div class="hd"><h3>' + (nudge ? 'Nudge' : 'Phase email') + ' preview</h3>'
    + '<button class="btn sm" data-x="1">Close</button>'
    + '<button class="btn sm pri" data-send="1">Send now</button></div>'
    + '<div class="subj"><b>To</b> ' + esc(p.to || '—') + '<br><b>Subject</b> ' + esc(p.subject || '')
    + '</div><div class="bd">' + esc(p.body || '') + '</div></div>';
  document.body.appendChild(m);
  m.addEventListener('click', function(e){ if (e.target === m) m.remove(); });
  m.querySelector('[data-x]').addEventListener('click', function(){ m.remove(); });
  m.querySelector('[data-send]').addEventListener('click', function(){
    var b = m.querySelector('[data-send]');
    b.disabled = true; b.textContent = 'Sending…';
    var call = nudge ? api('dashSendNudge', TOKEN, clientId)
                     : api('dashSend', TOKEN, clientId, Number(phase));
    call.then(function(r){
      m.remove();
      toast(r.ok ? ('Sent to ' + (r.to || 'client')) : (r.message || 'Send failed.'), !r.ok);
      CACHE.queue = null; CACHE.overview = null;
      if (VIEW === 'queue') renderQueue();
    }).catch(function(e){ m.remove(); fail(e); });
  });
}

// ---------------------------------------------------------------- clients

function renderClients(){
  el('view').innerHTML = loading();
  var p = cachedRead('overview', function(){ return api('getDashboardOverview', TOKEN); });
  p.then(function(d){
    stamp();
    var all = d.clients || [];
    var h = '<div class="f" style="max-width:280px; margin-bottom:4px">'
      + '<input id="q" placeholder="Search company or owner…" autocomplete="off"></div>'
      + '<div id="list"></div>';
    el('view').innerHTML = h;
    var draw = function(){
      var term = (el('q').value || '').toLowerCase();
      var rows = all.filter(function(c){
        return !term || (c.company + ' ' + (c.owner || '')).toLowerCase().indexOf(term) !== -1;
      });
      el('list').innerHTML = rows.length
        ? '<div class="grp">' + rows.length + (rows.length === 1 ? ' client' : ' clients')
          + '</div><div class="card">' + rows.map(clientRow).join('') + '</div>'
        : emptyState('No match', 'Nothing matches “' + term + '”.');
      wireClientRows();
    };
    el('q').addEventListener('input', draw);
    draw();
  }).catch(function(e){
    el('view').innerHTML = emptyState('Could not load', (e && e.message) || 'Unknown error.');
  });
}

/**
 * Mirrors the Clients!Status validation list in applyValidation_(). There is no
 * server function that returns it, so it is duplicated here — change both
 * together or the dropdown will offer a value the sheet rejects.
 */
var CLIENT_STATUSES = ['Intake','Access Pending','Auditing','Building','Live','Paused','Churned'];
var CALL_STATES = ['Not applicable','To schedule','Scheduled','Running'];

/**
 * How to work with this client, as opposed to what they bought.
 *
 * Rendered from the markdown the model wrote, because the same text has to be
 * readable in the Clients tab — half the team works in the sheet, and JSON in a
 * cell is unreadable there.
 */
function profileCard(text){
  if (!text || !String(text).trim()){
    return '<h3>Not built yet</h3>'
      + '<div class="hint">A profile is written from the sales and kickoff calls '
      + 'when the client is created — how they communicate, what they care about, '
      + 'what will annoy them. This one has none, usually because it was created '
      + 'before the feature existed or without any documents.</div>'
      + '<div class="startrow"><button class="btn" id="mkProfile">Build profile</button></div>';
  }
  return '<div class="prof">' + mdLite(text) + '</div>'
    + '<div class="startrow"><button class="btn" id="mkProfile">Rebuild from the documents</button></div>';
}

/**
 * Just enough markdown for what the profile actually contains: ## headings,
 * - bullets, and paragraphs. Not a general renderer — a general renderer here
 * would be a lot of code to display six shapes.
 */
function mdLite(text){
  var out = [], list = null;
  String(text).split(/\n/).forEach(function(line){
    var t = line.trim();
    if (!t){ if (list){ out.push('</ul>'); list = null; } return; }
    if (t.indexOf('## ') === 0){
      if (list){ out.push('</ul>'); list = null; }
      out.push('<h4>' + esc(t.slice(3)) + '</h4>');
    } else if (t.indexOf('- ') === 0){
      if (!list){ out.push('<ul>'); list = true; }
      out.push('<li>' + esc(t.slice(2)) + '</li>');
    } else {
      if (list){ out.push('</ul>'); list = null; }
      out.push('<p>' + esc(t) + '</p>');
    }
  });
  if (list) out.push('</ul>');
  return out.join('');
}

/**
 * Builds or rebuilds the profile in place.
 *
 * Reads the draft's documents server-side, so this costs one API call and no
 * uploads however long ago the client was created — as long as the draft still
 * exists, which it does unless someone deleted it.
 */
function makeProfile(clientId, draftId, btn){
  if (btn){ btn.disabled = true; btn.textContent = 'Reading the documents…'; }
  api('buildClientProfile', clientId, draftId || '').then(function(r){
    if (!r.ok){
      if (btn){ btn.disabled = false; btn.textContent = 'Build profile'; }
      toast(r.message || 'Could not build the profile.', true);
      return;
    }
    if (DETAIL && DETAIL.client) DETAIL.client.profile = r.profile;
    if (el('profWrap')){
      el('profWrap').innerHTML = profileCard(r.profile);
      wireProfile(clientId, draftId);
    }
    toast('Profile built from ' + (r.sources || []).join(', ') + '.');
  }).catch(function(e){
    if (btn){ btn.disabled = false; btn.textContent = 'Build profile'; }
    fail(e);
  });
}

function wireProfile(clientId, draftId){
  if (!el('mkProfile')) return;
  el('mkProfile').addEventListener('click', function(){
    makeProfile(clientId, draftId, this);
  });
}

function openClient(clientId){
  el('hTitle').textContent = 'Client';
  el('hSub').textContent = '';
  el('view').innerHTML = loading();
  // getClientDetail returns billingOptions but not cadences, so the intake
  // options are fetched alongside rather than duplicating CADENCES here.
  Promise.all([
    api('getClientDetail', TOKEN, clientId),
    CACHE.options ? Promise.resolve(CACHE.options) : api('getIntakeOptions')
  ]).then(function(res){
    var d = res[0];
    CACHE.options = res[1];

    // A deleted row, or a response the server could not serialise, used to
    // reach `d.client` and throw a TypeError that told nobody anything.
    if (!d || !d.client){
      el('hTitle').textContent = 'Client';
      // Two different failures, and telling them apart is the whole point: a
      // structured notFound means the row is gone, while a null means the
      // server could not serialise its reply — usually a formula error in a
      // cell — and no amount of looking at the Clients tab will explain it.
      el('view').innerHTML = '<button class="back" id="back">← All clients</button>'
        + emptyState(d && d.notFound ? 'Client not found' : 'Could not read this client',
            (d && d.message) || 'The server returned nothing for ' + clientId
            + '. That usually means a cell on its row holds a formula error '
            + '(#REF!, #N/A, #VALUE!). Check the row in the Clients tab.');
      el('back').addEventListener('click', function(){ go('clients'); });
      return;
    }

    DETAIL = d;
    var c = d.client || {};
    el('hTitle').textContent = c.company || 'Client';
    el('hSub').textContent = (c.status || '') + (c.owner ? ' · ' + c.owner : '');

    var h = '<button class="back" id="back">← All clients</button>';

    // Creating a client and committing it to an onboarding are separate acts.
    // Once tasks exist there are due dates, owners and a queue entry, so the
    // second one gets its own deliberate button.
    if (c.onboarding !== 'Started' && c.onboarding !== 'Complete'){
      h += '<div class="okbox" style="margin-top:14px"><b>Onboarding not started</b>'
        + '<div>Check the details below, then start it. That builds the dated task '
        + 'checklist from the services and platforms, and creates the Drive folder.</div>'
        + '<div class="startrow">'
        + '<label class="mini"><input type="checkbox" id="optCall" checked> Weekly onboarding call</label>'
        + '<label class="mini"><input type="checkbox" id="optDrive" checked> Create Drive folder</label>'
        + '<label class="mini"><input type="checkbox" id="optPlan"> Generate onboarding plan</label>'
        + '<button class="btn pri" id="startOnb">Start onboarding</button></div></div>';
    }

    h += '<div class="grp">Client profile</div><div class="card">'
      + '<div class="sect" id="profWrap">' + profileCard(c.profile) + '</div></div>';

    var ps = d.phaseState || {};
    if (ps.phases && ps.phases.length){
      h += '<div class="grp">Phases</div><div class="card"><div class="rail">'
        + ps.phases.map(function(p){
            var cls = p.phase < ps.current ? 'done' : (p.phase === ps.current ? 'cur' : '');
            return '<div class="step ' + cls + '"><div class="p">Phase ' + p.phase + '</div>'
              + '<div class="n">' + esc(p.name) + '</div></div>';
          }).join('') + '</div></div>';
    }

    var s = d.summary || {done:0, total:0, pct:0};
    h += '<div class="grp">Progress</div><div class="card"><div class="row">'
      + '<div class="who"><div class="co">' + s.done + ' of ' + s.total + ' tasks complete</div>'
      + '<div class="meta">' + s.pct + '%</div></div>' + ticks(s.done, s.total) + '</div></div>';

    var tasks = d.tasks || [];
    var byPhase = {};
    tasks.forEach(function(t){ (byPhase[t.phase] = byPhase[t.phase] || []).push(t); });
    Object.keys(byPhase).sort().forEach(function(k){
      h += '<div class="grp">Phase ' + esc(k) + ' <span class="n">'
        + byPhase[k].length + '</span></div><div class="card">';
      h += byPhase[k].map(function(t){
        return '<div class="task"><div class="n">' + esc(t.task)
          + (t.gate ? ' <span class="pill">gate</span>' : '') + '</div>'
          + '<select data-task="' + esc(t.task) + '">'
          + (d.statuses || []).map(function(o){
              return '<option' + (o === t.status ? ' selected' : '') + '>' + esc(o) + '</option>';
            }).join('') + '</select></div>';
      }).join('');
      h += '</div>';
    });

    // Only the fields updateClientField accepts — anything else silently
    // returns { ok:false, message:'Unknown field.' }.
    h += '<div class="grp">Details</div><div class="card"><div class="sect"><div class="fields">'
      + pField('status', 'Status', c.status, CLIENT_STATUSES)
      + pField('owner', 'Onboarding owner', c.owner)
      + pField('cadence', 'Meeting cadence', c.cadence, d.cadences || CACHE.options.cadences)
      + pField('term', 'Contract term', c.term, d.terms)
      + pField('bizType', 'Business type', c.bizType, d.bizTypes)
      + pField('call', 'Onboarding call', c.call, CALL_STATES)
      + pField('slack', 'Slack channel', c.slack)
      + pField('alias', 'Email alias', c.alias)
      + pField('approvals', 'Approvals contact', c.approvals)
      + pField('scope', 'Scope', c.scope, null, true)
      + '</div></div></div>';

    h += '<div class="grp">Links</div><div class="card"><div class="row">'
      + '<div class="who"><div class="meta">'
      + (c.alias ? 'Alias ' + esc(c.alias) : 'No alias yet') + '</div></div>'
      + (c.drive ? '<a class="btn sm" href="' + esc(c.drive) + '" target="_blank">Drive</a>'
                 : '<button class="btn sm" id="mkDrive">Create Drive folder</button>')
      + '</div></div>';

    el('view').innerHTML = h;
    el('back').addEventListener('click', function(){ go('clients'); });

    // The draft that produced this client is where the documents live, so the
    // profile can be rebuilt months later without re-uploading anything.
    var draftId = (PENDING_PROFILE && PENDING_PROFILE.clientId === clientId)
      ? PENDING_PROFILE.draftId : (c.draftId || '');
    wireProfile(clientId, draftId);

    // Straight after Create client, build it without being asked — that is the
    // moment the documents are certainly still there and the request was to
    // have this happen on create.
    if (PENDING_PROFILE && PENDING_PROFILE.clientId === clientId){
      var pend = PENDING_PROFILE;
      PENDING_PROFILE = null;
      if (!c.profile) makeProfile(clientId, pend.draftId, el('mkProfile'));
    }

    [].forEach.call(document.querySelectorAll('[data-field]'), function(inp){
      inp.addEventListener('change', function(){
        api('updateClientField', TOKEN, clientId, inp.getAttribute('data-field'), inp.value)
          .then(function(r){
            toast(r.ok ? 'Saved.' : (r.message || 'Could not save.'), !r.ok);
            CACHE.overview = null; CACHE.queue = null;
          }).catch(fail);
      });
    });

    [].forEach.call(document.querySelectorAll('select[data-task]'), function(sel){
      sel.addEventListener('change', function(){
        api('updateTaskStatus', TOKEN, clientId, sel.getAttribute('data-task'), sel.value)
          .then(function(r){
            toast(r.ok ? 'Saved.' : (r.message || 'Could not save.'), !r.ok);
            CACHE.overview = null; CACHE.queue = null;
          }).catch(fail);
      });
    });
    var so = el('startOnb');
    if (so) so.addEventListener('click', function(){
      so.disabled = true; so.textContent = 'Starting…';
      api('startOnboarding', TOKEN, clientId, {
        weeklyCall: el('optCall').checked,
        makeDrive: el('optDrive').checked,
        generatePlan: el('optPlan').checked
      }).then(function(r){
        if (!r.ok){ so.disabled = false; so.textContent = 'Start onboarding';
                    toast(r.message || 'Could not start.', true); return; }
        CACHE.overview = null; CACHE.queue = null;
        toast(r.tasks + ' task' + (r.tasks === 1 ? '' : 's') + ' created.');
        openClient(clientId);
      }).catch(function(e){
        so.disabled = false; so.textContent = 'Start onboarding'; fail(e);
      });
    });

    var mk = el('mkDrive');
    if (mk) mk.addEventListener('click', function(){
      mk.disabled = true; mk.textContent = 'Creating…';
      api('dashCreateDrive', TOKEN, clientId).then(function(r){
        toast(r.ok ? 'Folder created.' : (r.message || 'Failed.'), !r.ok);
        openClient(clientId);
      }).catch(function(e){ mk.disabled = false; mk.textContent = 'Create Drive folder'; fail(e); });
    });
  }).catch(function(e){
    el('view').innerHTML = emptyState('Could not load', (e && e.message) || 'Unknown error.');
  });
}

// ---------------------------------------------------------------- intake

/**
 * Two steps. Step one takes the documents that already exist by the time a
 * deal closes and has Anthropic read them; step two is the ordinary form,
 * pre-filled, with the sentence behind each value shown underneath it.
 *
 * Step one is skippable. Not every client arrives with a transcript, and a
 * flow that cannot be skipped becomes a flow people work around.
 */
var INTAKE_STEP = 'sources';   // 'sources' | 'form'
var EXTRACT = null;            // last extraction result, or null when skipped
var CLICKUP = null;            // whether a ClickUp token is configured

function renderIntake(){
  INTAKE_STEP = 'sources';
  EXTRACT = null;
  READ = [];
  SRCVALS = {};
  DRAFT = null;
  el('view').innerHTML = loading();
  Promise.all([
    CACHE.platforms ? Promise.resolve(CACHE.platforms) : api('getPlatformList'),
    CACHE.options ? Promise.resolve(CACHE.options) : api('getIntakeOptions'),
    CLICKUP === null ? api('hasClickUpToken') : Promise.resolve(CLICKUP),
    api('listDrafts')
  ]).then(function(r){
    CACHE.platforms = r[0]; CACHE.options = r[1]; CLICKUP = r[2];
    DRAFTS = (r[3] && r[3].drafts) || [];
    drawSources();
  }).catch(function(e){
    el('view').innerHTML = emptyState('Could not load', (e && e.message) || 'Unknown error.');
  });
}

var SOURCES = [
  { key:'sales', label:'Sales call transcript',
    hint:'The call where the deal was won. Usually carries the company, the contact, the vertical and what was promised.' },
  { key:'kickoff', label:'Onboarding / kickoff call transcript',
    hint:'Who does what, meeting cadence, approvals, launch expectations.' },
  { key:'sow', label:'Scope of work',
    hint:'The contract. Where MRR, start date, renewal and the platform list actually live.' },
  { key:'deck', label:'Pitch deck',
    hint:'Google Slides link, or upload the PDF. The fees and payment slide is where the monthly figure and its breakdown by channel live.' },
  { key:'form', label:'ClickUp onboarding form',
    hint:'The submitted form as a ClickUp task link — app.clickup.com/t/… . The answers are read from its custom fields, not just the description.' }
];

function drawSources(){
  var h = '<div class="steps">'
    + '<span class="stp on">1 · Sources</span>'
    + '<span class="stp">2 · Review &amp; create</span></div>';

  // Everything read is kept, so the common case after the first week is picking
  // up something already half-done rather than starting from an empty form.
  if (DRAFTS.length){
    h += '<div class="card form"><div class="sect">'
      + '<h3>Pick up where you left off</h3>'
      + '<div class="hint">Documents already read are stored in Drive. Reopening '
      + 'one costs no re-upload — you can swap a source and re-analyse.</div>'
      + '<div id="dlist">'
      + DRAFTS.map(function(d){
          return '<div class="drow">'
            + '<div class="bd"><div class="nm">' + esc(d.name)
            + '<span class="tag ' + (d.status === 'Submitted' ? 'done' : '') + '">'
            + esc(d.status) + '</span></div>'
            + '<div class="mt">' + d.sourceCount + ' document'
            + (d.sourceCount === 1 ? '' : 's')
            + (d.analysed ? ' · analysed' : ' · not analysed yet')
            + ' · updated ' + esc(d.updated) + '</div></div>'
            + '<button type="button" class="btn sm" data-open="' + esc(d.draftId)
            + '">Open</button>'
            + '<button type="button" class="clr" data-del="' + esc(d.draftId)
            + '">Delete</button>'
            + '</div>';
        }).join('')
      + '</div></div></div>';
  }

  h += '<div class="card form"><div class="sect">'
    + '<h3>Drop in what you already have</h3>'
    + '<div class="hint">All optional, but the more you add the less you type. '
    + 'Paste the text, upload a file, or paste a ClickUp link (doc or task), '
    + 'or a Google Doc link, and it will be fetched.</div>';

  if (!CLICKUP){
    h += '<div class="warnbox"><b>ClickUp links will not work yet.</b> '
      + 'No API token is set. In the sheet: Onboarding → Set ClickUp API token. '
      + 'Pasted text and Google Doc links work regardless.</div>';
  }

  h += SOURCES.map(function(s){
    // Carried back from the reading step, so returning here to add a source you
    // forgot does not cost you the four you already pasted.
    var prev = SRCVALS[s.key];
    var ptext = (typeof prev === 'string') ? prev : '';
    var pfile = (prev && typeof prev === 'object') ? (prev.name || 'file') : '';
    return '<div class="f wide" style="margin-bottom:16px">'
      + '<label for="src_' + s.key + '">' + esc(s.label) + '</label>'
      + '<div class="note" style="margin:-2px 0 4px">' + esc(s.hint) + '</div>'
      + '<textarea id="src_' + s.key + '" placeholder="Paste the text, or a link…">'
      + esc(ptext) + '</textarea>'
      + '<div class="drop" id="drop_' + s.key + '">'
      // No accept filter: it makes the OS picker open on "Custom Files" with
      // everything else greyed out, and the list was never right anyway — an
      // .eml, a .pages, a .csv all convert fine through Drive. An unsupported
      // file now fails on its own row with a reason, which is a better answer
      // than being unable to select it.
      + '<input type="file" id="file_' + s.key + '" hidden>'
      + '<button type="button" class="btn sm" data-pick="' + s.key + '">Upload a file</button>'
      + '<span class="fn' + (pfile ? ' has' : '') + '" id="fn_' + s.key + '">'
      + (pfile ? esc(pfile) + ' · attached' : 'PDF, Word, or plain text') + '</span>'
      + '<button type="button" class="clr" data-clear="' + s.key + '"'
      + (pfile ? '' : ' hidden') + '>Remove</button>'
      + '</div></div>';
  }).join('');

  h += '</div><div class="bar">'
    + '<button class="btn" id="skip">Skip, fill in manually</button>'
    + '<span class="sp"></span><span class="note" id="exMsg"></span>'
    + '<button class="btn pri" id="analyse">Analyse and continue</button>'
    + '</div></div>';

  el('view').innerHTML = h;

  [].forEach.call(document.querySelectorAll('[data-pick]'), function(b){
    var k = b.getAttribute('data-pick');
    b.addEventListener('click', function(){ el('file_' + k).click(); });
    el('file_' + k).addEventListener('change', function(){ showFile(k); });
  });
  [].forEach.call(document.querySelectorAll('[data-clear]'), function(b){
    var k = b.getAttribute('data-clear');
    b.addEventListener('click', function(){
      el('file_' + k).value = ''; delete SRCVALS[k]; showFile(k);
    });
  });

  el('skip').addEventListener('click', function(){ EXTRACT = null; drawForm(); });
  el('analyse').addEventListener('click', collectAndRead);

  if (el('dlist')){
    el('dlist').addEventListener('click', function(ev){
      var k;
      if ((k = ev.target.getAttribute('data-open'))) return resumeDraft(k);
      if ((k = ev.target.getAttribute('data-del'))) return removeDraft(k, ev.target);
    });
  }
}

/**
 * Reopens a draft. The stored sources come back as already-read rows, so the
 * reading step shows the same checklist it would after a fresh read — with the
 * same Retry / Replace buttons, and Analyse ready to run again.
 */
function resumeDraft(draftId){
  el('view').innerHTML = loading();
  api('openDraft', draftId).then(function(d){
    if (!d.ok){ toast(d.message || 'Could not open that draft.', true); renderIntake(); return; }

    DRAFT = { draftId: d.draftId, name: d.name, status: d.status,
              folderUrl: d.folderUrl, clientId: d.clientId };
    EXTRACT = d.extraction || null;
    DRAFTFORM = d.form || null;
    SRCVALS = {};

    READ = (d.sources || []).map(function(s){
      return {
        key: s.key, label: s.label, raw: s.origin || '',
        // A source whose Drive file has been deleted is shown as failed rather
        // than quietly dropped — otherwise Analyse would run on less than the
        // checklist claims.
        state: s.gone ? 'fail' : 'ok',
        res: s.gone
          ? { error: 'The stored copy is gone from Drive.',
              hint: 'Read it again, or paste the text in.', via: s.via }
          : { ok:true, key:s.key, label:s.label, via:s.via, fileId:s.fileId,
              originalId:s.originalId || '', originalMime:s.originalMime || '',
              chars:s.chars, words:s.words, preview:s.preview, warn:'' }
      };
    });

    // Missing documents are not toasted: each one already says so on its own
    // row, with the buttons to fix it, and a toast here lands on top of the
    // action bar at exactly the moment it is needed.
    if (!READ.length){ drawSources(); return; }
    drawReading();
  }).catch(function(e){ fail(e); renderIntake(); });
}

function removeDraft(draftId, btn){
  if (btn.getAttribute('data-armed') !== '1'){
    btn.setAttribute('data-armed', '1');
    btn.textContent = 'Really delete?';
    setTimeout(function(){
      if (!btn.parentNode) return;
      btn.removeAttribute('data-armed'); btn.textContent = 'Delete';
    }, 4000);
    return;
  }
  api('deleteDraft', draftId).then(function(){
    DRAFTS = DRAFTS.filter(function(d){ return d.draftId !== draftId; });
    // Deleting the draft you are currently inside has to clear the handle too.
    // Leaving it set means the next upload reuses a draft that no longer
    // exists, and every source fails on save after being fetched in full.
    if (DRAFT && DRAFT.draftId === draftId){
      DRAFT = null; READ = []; EXTRACT = null; DRAFTFORM = null;
    }
    drawSources();
    toast('Draft deleted. Its Drive folder is in the trash.');
  }).catch(fail);
}

// ------------------------------------------------------- reading the sources

/**
 * Fetching is the step that fails. A ClickUp doc in a Space you are not in, a
 * scanned PDF with no text layer, a deck nobody shared — each of those used to
 * surface as one line of raw API error for the whole batch, with no way to fix
 * the one broken document without redoing the rest.
 *
 * So each source is read on its own and reports its own outcome, and a failed
 * one can be retried, replaced with pasted text, or skipped while the others
 * keep their result. Nothing goes to Claude until you say so.
 */
var READ = [];        // [{key,label,raw,state,res}] — wait|read|ok|fail|skip
var SRCVALS = {};     // what was entered on the sources step, for going back
var DRAFT = null;     // the open draft: {draftId, name, status, folderUrl}
var DRAFTS = [];      // the resume list
var DRAFTFORM = null; // form values saved on the draft, applied over EXTRACT
var PENDING_PROFILE = null;  // {clientId, draftId} — build one on first open

function collectAndRead(){
  var b = el('analyse');
  b.disabled = true; b.textContent = 'Reading…';

  // A file wins over the textarea for the same source: picking one is the more
  // deliberate act, and sending both would double the prompt.
  Promise.all(SOURCES.map(function(s){
    var f = el('file_' + s.key).files[0];
    if (f) return readFile(f);
    var typed = el('src_' + s.key).value.trim();
    if (typed) return Promise.resolve(typed);
    var carried = SRCVALS[s.key];
    return Promise.resolve(carried && typeof carried === 'object' ? carried : null);
  })).then(function(vals){
    SRCVALS = {};
    var items = [];
    SOURCES.forEach(function(s, i){
      if (!vals[i]) return;
      SRCVALS[s.key] = vals[i];
      items.push({ key: s.key, label: s.label, raw: vals[i], state: 'wait', res: null });
    });
    if (!items.length){
      b.disabled = false; b.textContent = 'Analyse and continue';
      el('exMsg').textContent = 'Add at least one source, or skip.';
      return;
    }
    READ = items;
    // The draft has to exist before the first read, because that read writes
    // its text into the draft's Drive folder.
    if (DRAFT) { drawReading(); readNext(0); return; }
    return api('createDraft', draftName()).then(function(d){
      DRAFT = { draftId: d.draftId, name: d.name, status: 'Draft',
                folderUrl: d.folderId
                  ? 'https://drive.google.com/drive/folders/' + d.folderId : '' };
      if (d.folderMissing){
        toast('No Drive folder could be created for this draft, so documents '
          + 'will not be stored. Check the Drive Root Folder ID on the Config tab.', true);
      }
      drawReading();
      readNext(0);
    });
  }).catch(function(e){
    b.disabled = false; b.textContent = 'Analyse and continue';
    fail(e);
  });
}

/** A draft is named before anything has been read, so guess from the sources. */
function draftName(){
  var link = '';
  for (var i = 0; i < SOURCES.length; i++){
    var v = SRCVALS[SOURCES[i].key];
    if (v && typeof v === 'object' && v.name){
      return String(v.name).replace(/\.[^.]+$/, '').slice(0, 60);
    }
    if (!link && typeof v === 'string' && v) link = v;
  }
  var d = new Date();
  return 'New client · ' + d.toLocaleDateString();
}

function drawReading(){
  var h = '<div class="steps">'
    + '<span class="stp done" id="backStep">1 · Sources</span>'
    + '<span class="stp on">Reading</span>'
    + '<span class="stp">2 · Review &amp; create</span></div>';

  h += '<div class="card form"><div class="sect">'
    + '<h3>Reading your sources</h3>'
    + '<div class="hint">Each one is fetched separately, so a document that fails '
    + 'does not cost you the others. Nothing is sent to Claude until you press '
    + 'Analyse.</div>'
    + (DRAFT ? '<div class="dbar">Saved as <b id="draftName">' + esc(DRAFT.name) + '</b>'
        + '<button type="button" class="lnk" id="renameDraft">Rename</button>'
        + (DRAFT.folderUrl ? '<a class="lnk" id="draftFolder" href="' + esc(DRAFT.folderUrl)
            + '" target="_blank" rel="noopener">Drive folder</a>' : '')
        + '<span class="sp"></span>Documents are stored — you can come back to '
        + 'this without uploading again.</div>' : '')
    + '<div id="rlist">'
    + READ.map(function(r, i){
        return '<div class="rrow ' + r.state + '" id="rrow_' + r.key + '">'
          + rowInner(i) + '</div>';
      }).join('')
    + '</div></div>'
    + '<div id="thinkWrap"></div>'
    + '<div class="bar rbar">'
    + '<button class="btn" id="backSrc">Back to sources</button>'
    + '<button class="btn" id="skip2">Skip, fill in manually</button>'
    + '<span class="sp"></span><span class="note" id="rdMsg"></span>'
    + '<button class="btn pri" id="goAnalyse" disabled>Analyse</button>'
    + '</div></div>';

  el('view').innerHTML = h;
  el('backSrc').addEventListener('click', drawSources);
  el('backStep').addEventListener('click', drawSources);
  el('skip2').addEventListener('click', function(){ drawForm(); });
  el('goAnalyse').addEventListener('click', doAnalyse);
  if (el('renameDraft')) el('renameDraft').addEventListener('click', promptRename);
  wireRows();
  updateFoot();

  // Reopening an already-analysed draft should not force another API call to
  // see what it said last time.
  if (EXTRACT && el('goAnalyse')){
    el('goAnalyse').insertAdjacentHTML('beforebegin',
      '<button class="btn" id="useLast">Use the last analysis</button>');
    el('useLast').addEventListener('click', function(){ drawForm(); });
    el('goAnalyse').textContent = 'Re-analyse';
  }
}

function promptRename(){
  var next = window.prompt('Name this draft', DRAFT ? DRAFT.name : '');
  if (next === null) return;
  api('renameDraft', DRAFT.draftId, next).then(function(r){
    if (!r.ok){ toast(r.message || 'Could not rename.', true); return; }
    DRAFT.name = String(next).trim() || 'Untitled draft';
    drawReading();
  }).catch(fail);
}

function rowInner(i){
  var r = READ[i], res = r.res || {};
  var icon = { wait: '', read: '', ok: '✓', fail: '!', skip: '–' }[r.state] || '';
  var h = '<div class="ic ' + r.state + '">' + icon + '</div><div class="bd">';

  h += '<div class="nm">' + esc(r.label)
     + (res.via ? '<span class="via">' + esc(res.via) + '</span>' : '')
     + '</div>';

  if (r.state === 'wait'){
    h += '<div class="st">Waiting.</div>';
  } else if (r.state === 'read'){
    h += '<div class="st">Fetching…</div>';
  } else if (r.state === 'skip'){
    h += '<div class="st">Skipped — this one will not be sent to Claude.</div>';
  } else if (r.state === 'ok'){
    h += '<div class="st">Read ' + fmtNum(res.words) + ' words, '
       + fmtNum(res.chars) + ' characters.'
       + (res.warn ? ' ' + esc(res.warn) : '') + '</div>';
    if (res.preview){
      h += '<div class="pv">“' + esc(res.preview) + '…”</div>';
    }
  } else if (r.state === 'fail'){
    h += '<div class="st">' + esc(res.error || 'Could not read it.') + '</div>';
    if (res.hint) h += '<div class="hnt">' + esc(res.hint) + '</div>';
  }

  if (r.state === 'fail' || r.state === 'skip' || r.state === 'ok'){
    h += '<div class="acts">'
      + '<button type="button" class="btn sm" data-retry="' + r.key + '">'
      + (r.state === 'ok' ? 'Read again' : 'Retry') + '</button>'
      + '<button type="button" class="btn sm" data-fix="' + r.key + '">'
      + (r.state === 'ok' ? 'Replace' : 'Paste it in instead') + '</button>'
      + (r.state === 'fail'
          ? '<button type="button" class="btn sm" data-skip="' + r.key
            + '">Skip this one</button>' : '')
      + '</div>'
      + '<div class="fix" id="fix_' + r.key + '">'
      + '<textarea id="fixtx_' + r.key + '" placeholder="Paste the document text here…">'
      + '</textarea>'
      + '<div class="drop">'
      + '<input type="file" id="fixf_' + r.key + '" hidden>'
      + '<button type="button" class="btn sm" data-fixpick="' + r.key + '">Upload a file</button>'
      + '<span class="fn" id="fixfn_' + r.key + '">PDF, Word, or plain text</span>'
      + '<span style="flex:1"></span>'
      + '<button type="button" class="btn sm pri" data-fixgo="' + r.key + '">Use this</button>'
      + '</div></div>';
  }
  return h + '</div>';
}

/** Delegated, because rows are repainted in place as each read finishes. */
function wireRows(){
  var list = el('rlist');
  list.addEventListener('click', function(ev){
    var t = ev.target, k;
    if ((k = t.getAttribute('data-retry'))){ readOne(rowIdx(k)); return; }
    if ((k = t.getAttribute('data-skip'))){ setState(k, 'skip'); return; }
    if ((k = t.getAttribute('data-fix'))){ el('fix_' + k).classList.toggle('on'); return; }
    if ((k = t.getAttribute('data-fixpick'))){ el('fixf_' + k).click(); return; }
    if ((k = t.getAttribute('data-fixgo'))){ applyFix(k); return; }
  });
  list.addEventListener('change', function(ev){
    var id = ev.target.id || '';
    if (id.indexOf('fixf_') !== 0) return;
    var k = id.slice(5);
    var f = el('fixf_' + k).files[0];
    var nm = el('fixfn_' + k);
    nm.textContent = f ? f.name : 'PDF, Word, or plain text';
    nm.className = f ? 'fn has' : 'fn';
  });
}

/** The "Saved as …" line, repainted in place when the draft is replaced. */
function refreshDraftBanner(){
  var n = el('draftName');
  if (n && DRAFT) n.textContent = DRAFT.name;
  var f = el('draftFolder');
  if (f && DRAFT && DRAFT.folderUrl) f.href = DRAFT.folderUrl;
}

function rowIdx(key){
  for (var i = 0; i < READ.length; i++) if (READ[i].key === key) return i;
  return -1;
}

function paintRow(i){
  var node = el('rrow_' + READ[i].key);
  if (!node) return;
  node.className = 'rrow ' + READ[i].state;
  node.innerHTML = rowInner(i);
}

function setState(key, state){
  var i = rowIdx(key);
  if (i < 0) return;
  READ[i].state = state;
  paintRow(i);
  updateFoot();
}

/** Swap in pasted text or a fresh file for one source, then read it again. */
function applyFix(key){
  var i = rowIdx(key);
  if (i < 0) return;
  var f = el('fixf_' + key).files[0];
  var typed = el('fixtx_' + key).value.trim();

  if (f){
    readFile(f).then(function(obj){
      READ[i].raw = obj; SRCVALS[key] = obj; readOne(i);
    }).catch(fail);
    return;
  }
  if (!typed){
    toast('Paste the text or pick a file first.', true);
    return;
  }
  READ[i].raw = typed; SRCVALS[key] = typed;
  readOne(i);
}

function readOne(i){
  if (i < 0) return Promise.resolve();
  var r = READ[i];
  r.state = 'read'; r.res = null;
  paintRow(i); updateFoot();

  return api('readSource', r.key, r.raw, DRAFT && DRAFT.draftId).then(function(res){
    // The draft went away underneath us — deleted here, deleted from the sheet,
    // or a second tab got there first. Start a new one and read again rather
    // than handing back a failure the user can only fix by reloading.
    if (res && res.draftGone){
      return api('createDraft', draftName()).then(function(d){
        DRAFT = { draftId: d.draftId, name: d.name, status: 'Draft',
                  folderUrl: d.folderId
                    ? 'https://drive.google.com/drive/folders/' + d.folderId : '' };
        refreshDraftBanner();
        return api('readSource', r.key, r.raw, DRAFT.draftId);
      });
    }
    return res;
  }).then(function(res){
    r.res = res;
    r.state = res && res.ok ? 'ok' : 'fail';
  }).catch(function(e){
    // A thrown server error rather than a returned one — usually a timeout on a
    // very large file. Same row, same buttons.
    r.res = { error: (e && e.message) || String(e),
              hint: 'Retry, or paste the text in instead.' };
    r.state = 'fail';
  }).then(function(){
    paintRow(i); updateFoot();
  });
}

/** One at a time, so the checklist reads as progress rather than a flicker. */
function readNext(i){
  while (i < READ.length && (READ[i].state === 'ok' || READ[i].state === 'skip')) i++;
  if (i >= READ.length){ updateFoot(); return; }
  readOne(i).then(function(){ readNext(i + 1); });
}

function updateFoot(){
  var b = el('goAnalyse');
  if (!b) return;

  var busy = 0, ok = 0, bad = 0, sk = 0;
  READ.forEach(function(r){
    if (r.state === 'wait' || r.state === 'read') busy++;
    else if (r.state === 'ok') ok++;
    else if (r.state === 'fail') bad++;
    else if (r.state === 'skip') sk++;
  });

  // Reworded rather than set once, because every row change repaints this.
  var verb = EXTRACT ? 'Re-analyse' : 'Analyse';
  b.disabled = !!busy || !ok;
  b.textContent = ok ? verb + ' ' + ok + ' document' + (ok === 1 ? '' : 's') : verb;

  var m = [];
  if (busy){
    m.push('Reading ' + busy + ' more…');
  } else {
    if (ok) m.push(ok + ' read');
    if (bad) m.push(bad + ' failed');
    if (sk) m.push(sk + ' skipped');
    if (bad) m.push('retry, replace, or skip to continue');
    else if (!ok) m.push('nothing left to analyse — skip to the form');
  }
  el('rdMsg').textContent = m.join(' · ');
}

// ------------------------------------------------------------- the analysis

function doAnalyse(){
  var items = [], words = 0;
  READ.forEach(function(r){
    if (r.state !== 'ok' || !r.res || !r.res.fileId) return;
    // originalId rides along so the server can attach the PDF itself, not just
    // the text scraped out of it — a fee table exported as an image has no text.
    items.push({ key: r.key, fileId: r.res.fileId,
                 originalId: r.res.originalId || '',
                 originalMime: r.res.originalMime || '' });
    words += r.res.words || 0;
  });
  if (!items.length){ updateFoot(); return; }

  el('goAnalyse').disabled = true;
  el('backSrc').disabled = true;

  var t0 = Date.now();
  el('thinkWrap').innerHTML = '<div class="sect">'
    + '<div class="thinking"><div class="dots"><i></i><i></i><i></i></div>'
    + '<div><div class="tx">Claude is reading ' + items.length + ' document'
    + (items.length === 1 ? '' : 's') + ' — ' + fmtNum(words) + ' words — for the '
    + 'company, the contract, the fees and who does what.</div>'
    + '<div class="el" id="elap">0s · usually 20–40 seconds</div></div></div></div>';

  // A real elapsed counter rather than a fake progress bar: it is one request,
  // and pretending otherwise would only mislead about where the time goes.
  var timer = setInterval(function(){
    var e = el('elap');
    if (!e){ clearInterval(timer); return; }
    var s = Math.round((Date.now() - t0) / 1000);
    e.textContent = s + 's · ' + (s < 45
      ? 'usually 20–40 seconds'
      : 'longer than usual — long transcripts take more');
  }, 1000);

  var stop = function(){
    clearInterval(timer);
    el('thinkWrap').innerHTML = '';
    if (el('goAnalyse')) el('goAnalyse').disabled = false;
    if (el('backSrc')) el('backSrc').disabled = false;
    updateFoot();
  };

  api('runExtraction', items, DRAFT && DRAFT.draftId).then(function(r){
    if (!r || !r.ok){
      stop();
      toast((r && r.message) || 'Analysis failed.', true);
      return;
    }
    clearInterval(timer);
    EXTRACT = r;
    // A fresh reading supersedes what was typed against the previous one.
    DRAFTFORM = null;
    // Trimming is the one thing that can quietly cost accuracy, so it is said
    // out loud rather than left in the server response.
    if (r.trimmed && r.trimmed.length){
      toast(r.trimmed.map(function(t){
        return t.label + ' was too long and was trimmed to fit ('
          + fmtNum(t.from) + ' → ' + fmtNum(t.to) + ' characters). '
          + 'Check anything it got from that one.';
      }).join(' '), true);
    }
    drawForm();
  }).catch(function(e){
    stop(); fail(e);
  });
}

function fmtNum(n){
  return String(n == null ? 0 : n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

/** Client-side cap, so an oversized file fails instantly instead of after a
    slow upload that the server would reject anyway. */
var MAX_UPLOAD = 12 * 1024 * 1024;

function showFile(key){
  var f = el('file_' + key).files[0];
  var nm = el('fn_' + key);
  var clr = document.querySelector('[data-clear="' + key + '"]');
  if (!f){
    nm.textContent = 'PDF, Word, or plain text';
    nm.className = 'fn';
    clr.hidden = true;
    el('src_' + key).disabled = false;
    return;
  }
  if (f.size > MAX_UPLOAD){
    nm.textContent = f.name + ' is too big (limit 12 MB)';
    nm.className = 'fn bad';
    clr.hidden = false;
    return;
  }
  nm.textContent = f.name + ' · ' + Math.max(1, Math.round(f.size / 1024)) + ' KB';
  nm.className = 'fn has';
  clr.hidden = false;
  // The file supersedes anything typed, so say so rather than silently ignoring it.
  el('src_' + key).disabled = true;
}

function wireFees(){
  [].forEach.call(document.querySelectorAll('.feerow .fa'), function(i){
    i.oninput = recalcFees;
  });
  [].forEach.call(document.querySelectorAll('[data-delfee]'), function(b){
    b.onclick = function(){
      if (document.querySelectorAll('.feerow').length > 1) b.closest('.feerow').remove();
      else { b.closest('.feerow').querySelector('.fl').value = '';
             b.closest('.feerow').querySelector('.fa').value = ''; }
      recalcFees();
    };
  });
  recalcFees();
}

function readFile(f){
  return new Promise(function(res, rej){
    if (f.size > MAX_UPLOAD){ rej(new Error(f.name + ' is over the 12 MB limit.')); return; }
    var r = new FileReader();
    r.onerror = function(){ rej(new Error('Could not read ' + f.name)); };
    r.onload = function(){
      // readAsDataURL gives "data:<mime>;base64,<payload>" — the server wants
      // the payload only.
      var s = String(r.result);
      res({ name: f.name, mimeType: f.type || 'application/octet-stream',
            data: s.slice(s.indexOf(',') + 1) });
    };
    r.readAsDataURL(f);
  });
}

/** A field's extracted value, or '' when nothing was extracted. */
function exVal(name){
  // A saved draft's typed value wins over the extraction: it is the later, more
  // deliberate act. Re-analysing clears the saved form so the fresh reading
  // shows through rather than being masked by what was typed before it.
  if (DRAFTFORM && DRAFTFORM[name] != null && DRAFTFORM[name] !== ''){
    return String(DRAFTFORM[name]);
  }
  var f = EXTRACT && EXTRACT.fields && EXTRACT.fields[name];
  return f && f.value != null ? String(f.value) : '';
}
/** The sentence the value came from, rendered under the input. */
function exQuote(name){
  var f = EXTRACT && EXTRACT.fields && EXTRACT.fields[name];
  if (!f || !f.quote) return '';
  var c = (f.confidence || 'medium').toLowerCase();
  return '<div class="src ' + (c === 'low' ? 'low' : '') + '">'
    + '<span class="cf">' + esc(c) + '</span>'
    + '<span class="qt">“' + esc(String(f.quote).slice(0, 220)) + '”</span>'
    + (f.source ? '<span class="sr">' + esc(f.source) + '</span>' : '')
    + '</div>';
}

function field(id, label, opts){
  opts = opts || {};
  var v = opts.value == null ? '' : String(opts.value);
  var input;
  if (opts.type === 'textarea'){
    input = '<textarea id="' + id + '" placeholder="' + esc(opts.ph || '') + '">' + esc(v) + '</textarea>';
  } else if (opts.options){
    var has = opts.options.indexOf(v) !== -1;
    input = '<select id="' + id + '">'
      + (opts.blank || !has ? '<option value=""' + (has ? '' : ' selected') + '></option>' : '')
      + opts.options.map(function(o){
          return '<option' + (o === v ? ' selected' : '') + '>' + esc(o) + '</option>';
