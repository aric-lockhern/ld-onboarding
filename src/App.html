<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Lockhern Digital brand.
     Blues and greys come from the brand sheet. Tertiary navy (#0E2970) is
     used for text and the logo mark only, never as a surface — it makes the
     whole tool feel like a database admin panel.

     Status colours are darker steps than the stock palette so all four clear
     3:1 against both the card and the page (the lighter amber and orange did
     not). They are reserved for state, never decoration, and every one renders
     beside its own word — "3 overdue", "1 blocked" — so hue never carries the
     meaning by itself. Blocked and overdue deliberately share a red: they are
     both problems, and the label is what tells them apart. */
  :root{
    --blue:#317AE0; --blue-dk:#2A62B4; --blue-ink:#0E2970;
    --blue-wash:#EAF1FC; --blue-line:#CFE0F7;
    --ink:#0E0E0E; --muted:#6B7A99; --faint:#8E9BB5;
    --line:#E7ECF4; --mid:#BAC3D6;
    --paper:#F7F9FC; --surface:#FFFFFF;
    --good:#0F7B2E; --warning:#B26A00; --critical:#C22B2B; --serious:#C22B2B;
    --tick-off:#DDE4EF;
    --sidebar-w:216px;
    --shadow:0 1px 2px rgba(14,41,112,.05), 0 1px 3px rgba(14,41,112,.04);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0; background:var(--paper); color:var(--ink);
    font:15px/1.55 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased; font-feature-settings:"cv11","ss01"}
  .num,.stat .v,.frac{font-variant-numeric:tabular-nums}
  .eyebrow{font-size:12.5px; font-weight:500; color:var(--muted); letter-spacing:0;
    text-transform:none}
  h1,h2,h3{margin:0; font-weight:600; letter-spacing:-.011em}
  a{color:var(--blue); text-decoration:none}
  a:hover{text-decoration:underline}

  /* ---------------------------------------------------------------- gate */
  #gate{max-width:340px; margin:14vh auto; padding:0 20px}
  #gate .mark{width:42px; height:42px; border-radius:10px; background:var(--blue);
    display:grid; place-items:center; color:#fff; font-size:16px; font-weight:700;
    margin-bottom:20px; letter-spacing:-.02em}
  #gate h1{font-size:24px; margin:0 0 6px}
  #gate p{color:var(--muted); font-size:14.5px; margin:0 0 22px}
  #pin{width:100%; padding:13px 14px; border:1px solid var(--line); border-radius:9px;
    font:17px/1 "Inter",sans-serif; letter-spacing:.22em; text-align:center;
    background:var(--surface); color:var(--ink)}
  #pin::placeholder{letter-spacing:.1em; color:var(--mid)}
  #pin:focus{outline:none; border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-wash)}
  #gateMsg{margin-top:12px; font-size:13.5px; color:var(--critical); min-height:18px}

  /* --------------------------------------------------------------- shell */
  #app{display:none; min-height:100%}
  #app.on{display:grid; grid-template-columns:var(--sidebar-w) 1fr;
    background:linear-gradient(90deg, var(--surface) 0, var(--surface) var(--sidebar-w),
      var(--paper) var(--sidebar-w))}

  nav{background:var(--surface); border-right:1px solid var(--line); padding:18px 12px;
    position:sticky; top:0; height:100vh; display:flex; flex-direction:column}
  nav .brand{display:flex; align-items:center; gap:10px; padding:2px 8px 22px}
  nav .brand .mark{width:30px; height:30px; border-radius:8px; background:var(--blue);
    display:grid; place-items:center; color:#fff; font-size:12.5px; font-weight:700;
    letter-spacing:-.02em}
  nav .brand b{font-size:15px; font-weight:600; color:var(--blue-ink); letter-spacing:-.012em}
  nav button{display:flex; align-items:center; gap:11px; width:100%; text-align:left;
    background:none; border:0; color:var(--muted); padding:9px 10px; cursor:pointer;
    font:500 14.5px/1.2 "Inter",sans-serif; border-radius:8px; margin-bottom:2px}
  nav button:hover{color:var(--blue-ink); background:var(--paper)}
  nav button.on{color:var(--blue); background:var(--blue-wash); font-weight:600}
  nav button .ic{width:18px; text-align:center; font-size:15px; opacity:.85}
  nav .spacer{flex:1}
  nav .foot{padding:12px 10px 0; font-size:12.5px; color:var(--faint); border-top:1px solid var(--line)}
  nav .foot button{padding:5px 0; font-size:13px; color:var(--muted)}
  nav .foot button:hover{background:none; color:var(--blue)}

  main{min-width:0; display:flex; flex-direction:column}
  header{display:flex; align-items:center; gap:14px; padding:20px 28px 16px;
    background:var(--paper); position:sticky; top:0; z-index:5;
    border-bottom:1px solid var(--line)}
  header h1{font-size:21px; margin-right:auto}
  header .sub{color:var(--muted); font-size:13.5px}
  .wrap{padding:22px 28px 48px; max-width:1120px; width:100%}

  /* --------------------------------------------------------------- bits */
  button.btn{border:1px solid var(--line); background:var(--surface); color:var(--ink);
    padding:8px 14px; border-radius:8px; cursor:pointer;
    font:500 13.5px/1.2 "Inter",sans-serif; box-shadow:var(--shadow)}
  button.btn:hover{border-color:var(--mid); background:var(--paper)}
  button.btn.pri{background:var(--blue); border-color:var(--blue); color:#fff; font-weight:600}
  button.btn.pri:hover{background:var(--blue-dk); border-color:var(--blue-dk)}
  button.btn:disabled{opacity:.5; cursor:default}
  button.btn.sm{padding:6px 11px; font-size:13px}
  a.btn{display:inline-block; text-decoration:none}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:12px;
    box-shadow:var(--shadow)}
  .grp{font-size:13.5px; font-weight:600; color:var(--muted); letter-spacing:0;
    text-transform:none; padding:26px 2px 10px; display:flex; align-items:center; gap:8px}
  .grp .n{color:var(--faint); font-weight:400}

  /* Stat tiles, not charts — each is a single headline number, so a plot
     would add nothing but ink. */
  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:12px}
  .stat{padding:16px 18px}
  .stat .k{display:flex; align-items:center; gap:7px; margin-bottom:9px}
  .stat .v{font-size:32px; font-weight:600; line-height:1; letter-spacing:-.025em}
  .stat .cap{font-size:13px; color:var(--faint); margin-top:6px}
  .dot{width:9px; height:9px; border-radius:50%; flex:none; display:inline-block}
  .dot.good{background:var(--good)} .dot.warning{background:var(--warning)}
  .dot.serious{background:var(--serious)} .dot.critical{background:var(--critical)}
  .dot.idle{background:var(--mid)}

  .row{display:flex; align-items:center; gap:13px; padding:14px 18px;
    border-top:1px solid var(--line)}
  .row:first-child{border-top:0}
  .row .who{flex:1; min-width:0}
  .row .co{font-weight:600; font-size:15px; letter-spacing:-.01em; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap}
  .row .meta{color:var(--muted); font-size:13.5px; margin-top:2px}
  .row .act{display:flex; gap:8px; flex:none}
  .row.clickable{cursor:pointer}
  .row.clickable:hover{background:var(--paper)}

  .pill{font-size:12.5px; font-weight:500; letter-spacing:0; text-transform:none;
    padding:4px 10px; border-radius:20px; background:var(--paper); color:var(--muted);
    flex:none; display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line)}
  .pill.critical{background:#FDECEC; color:#9B2020; border-color:#F6D5D5}
  .pill.warning{background:#FDF3E3; color:#8A5200; border-color:#F3E2C4}
  .pill.serious{background:#FDECEC; color:#9B2020; border-color:#F6D5D5}
  .pill.good{background:#E9F6EE; color:#0D6528; border-color:#CDE9D8}

  /* One tick per task, filled = complete. Magnitude against a known whole. */
  .ticks{display:flex; gap:2px; flex:none}
  .tick{width:6px; height:16px; border-radius:2px; background:var(--tick-off)}
  .tick.on{background:var(--blue)}
  .frac{font-size:13px; color:var(--muted); flex:none; min-width:52px; text-align:right}

  .empty{padding:34px 20px; text-align:center; color:var(--faint); font-size:14px}
  .empty b{display:block; color:var(--muted); font-weight:600; margin-bottom:4px; font-size:15px}
  .skel{height:13px; background:linear-gradient(90deg,#EDF1F7,#F7F9FC,#EDF1F7);
    background-size:200% 100%; animation:sh 1.3s infinite; border-radius:5px}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}

  .toast{position:fixed; right:22px; bottom:22px; background:var(--blue-ink); color:#fff;
    padding:13px 17px; border-radius:10px; font-size:14px; max-width:360px; z-index:50;
    box-shadow:0 8px 26px rgba(14,41,112,.22)}
  .toast.bad{background:#8F2020}

  /* --------------------------------------------------------------- forms */
  .form{max-width:760px}
  .sect{padding:22px 24px; border-top:1px solid var(--line)}
  .sect:first-child{border-top:0}
  .sect h3{font-size:16px; margin-bottom:3px}
  .sect .hint{color:var(--faint); font-size:13.5px; margin-bottom:18px}
  .fields{display:grid; grid-template-columns:1fr 1fr; gap:16px}
  .f{display:flex; flex-direction:column; gap:6px}
  .f.wide{grid-column:1/-1}
  .f label{font-size:13.5px; font-weight:500; color:var(--muted); letter-spacing:0;
    text-transform:none}
  .f input,.f select,.f textarea{padding:10px 12px; border:1px solid var(--line);
    border-radius:8px; font:14.5px/1.5 "Inter",sans-serif; background:var(--surface);
    color:var(--ink); width:100%}
  .f textarea{min-height:92px; resize:vertical}
  .f input::placeholder,.f textarea::placeholder{color:var(--mid)}
  .f input:focus,.f select:focus,.f textarea:focus{outline:none; border-color:var(--blue);
    box-shadow:0 0 0 3px var(--blue-wash)}
  .f .note{font-size:12.5px; color:var(--faint)}
  .checks{display:grid; grid-template-columns:repeat(auto-fill,minmax(232px,1fr)); gap:9px}
  .chk{display:flex; align-items:flex-start; gap:10px; padding:11px 13px;
    border:1px solid var(--line); border-radius:9px; cursor:pointer; background:var(--surface)}
  .chk:hover{border-color:var(--blue-line); background:var(--paper)}
  .chk.on{border-color:var(--blue); background:var(--blue-wash)}
  .chk input{margin:2px 0 0; accent-color:var(--blue); width:15px; height:15px}
  .chk .nm{font-size:14px; font-weight:500}
  .chk .cat{font-size:12.5px; color:var(--faint)}
  .bar{display:flex; gap:12px; align-items:center; padding:18px 24px;
    border-top:1px solid var(--line); background:var(--paper); border-radius:0 0 12px 12px}
  .bar .sp{flex:1}
  /* The reading bar runs to four controls plus a status line; without this the
     status text steals width and clips the label off the primary button. */
  .bar .btn{flex:none; white-space:nowrap}
  .bar .note{min-width:0}
  /* The reading bar can reach five controls once a draft offers its previous
     analysis. Status gets its own line rather than competing for width. */
  .bar.rbar{flex-wrap:wrap; row-gap:10px}
  .bar.rbar .note{flex:1 0 100%; order:-1}

  /* -------------------------------------------------------------- detail */
  .back{background:none; border:0; color:var(--muted); cursor:pointer; padding:0;
    font:500 13.5px/1 "Inter",sans-serif}
  .back:hover{color:var(--blue)}
  .rail{display:flex; gap:8px; padding:18px; overflow-x:auto}
  .step{flex:1; min-width:118px; padding:11px 13px; border-radius:9px;
    background:var(--paper); border:1px solid var(--line)}
  .step.done{background:#EDF7F1; border-color:#CFE7DA}
  .step.cur{background:var(--blue); border-color:var(--blue); color:#fff}
  .step .p{font-size:12px; font-weight:500; opacity:.72}
  .step .n{font-size:14px; font-weight:600; margin-top:4px; letter-spacing:-.008em}
  /* Top-aligned, not centred. The assignee carries a line of age text under it
     and the status does not, so centring split the difference and left the two
     selects on visibly different lines. */
  .task{display:flex; align-items:flex-start; gap:12px; padding:12px 18px;
    border-top:1px solid var(--line)}
  .task .n{flex:1; min-width:0; font-size:14.5px; padding-top:7px}
  .task select{padding:7px 9px; border:1px solid var(--line); border-radius:7px;
    font:13.5px/1 "Inter",sans-serif; background:var(--surface); width:148px; flex:none;
    color:var(--ink)}
  .task select:focus{outline:none; border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-wash)}
  /* The assignee sits left of the status with its age under it: who has it and
     how long they have had it are one question, and reading them apart is what
     let tasks sit assigned and untouched without anyone noticing. */
  .asgw{flex:none; width:158px; display:flex; flex-direction:column; gap:3px}
  .asgw select.asg{width:100%}
  /* block, not inline: min-height does nothing to an inline span, so an empty
     age collapsed to zero and every row with an owner sat taller than one
     without — which is what knocked the two dropdowns out of line. */
  .asgw .age{display:block; height:14px; font-size:11.5px; color:var(--faint);
    padding-left:2px; font-variant-numeric:tabular-nums; overflow:hidden}
  /* Own class rather than reusing the reading checklist's row: these carry two
     buttons, and a flex row that stretches its children turns them into two
     tall columns on a phone. */
  .crow{display:flex; align-items:flex-start; gap:10px; padding:13px 0;
    border-top:1px solid var(--line); flex-wrap:wrap}
  .crow .bd{flex:1 1 240px; min-width:0}
  .crow .nm{font-size:14px; font-weight:500}
  .crow .meta{font-size:12.5px; color:var(--faint); margin-top:2px;
    overflow-wrap:anywhere}
  .crow .btn{flex:none; align-self:center}
  .crow.off{opacity:.55}
  .task .ping{flex:none; width:30px; height:34px; padding:0; border-radius:7px;
    border:1px solid var(--line); background:var(--surface); cursor:pointer;
    color:var(--muted); font-size:13px; line-height:1}
  .task .ping:hover{border-color:var(--blue); color:var(--blue); background:var(--blue-wash)}
  .task .ping:disabled{opacity:.4; cursor:default}
  .grp .gact{float:right; font:500 12px/1 "Inter",sans-serif; color:var(--blue);
    background:none; border:0; cursor:pointer; padding:0 2px; text-transform:none;
    letter-spacing:0}
  .grp .gact:hover{text-decoration:underline}
  .grp .gact:disabled{color:var(--faint); cursor:default; text-decoration:none}
  .modal{position:fixed; inset:0; background:rgba(14,41,112,.34); display:grid;
    place-items:center; padding:24px; z-index:40}
  .modal .box{background:var(--surface); border-radius:14px; max-width:660px; width:100%;
    max-height:86vh; overflow:auto; box-shadow:0 18px 50px rgba(14,41,112,.26)}
  .modal .hd{padding:18px 22px; border-bottom:1px solid var(--line); display:flex;
    align-items:center; gap:11px; position:sticky; top:0; background:var(--surface)}
  .modal .hd h3{font-size:16px; margin-right:auto}
  .modal .bd{padding:18px 22px; font-size:14.5px; white-space:pre-wrap; line-height:1.62;
    color:#26303F}
  .modal .subj{font-size:13.5px; color:var(--muted); padding:0 22px 14px}
  .modal .subj b{color:var(--ink); font-weight:600}

  /* ------------------------------------------------------- intake step 1 */
  /* Banners share the form's measure so the column has one left and right
     edge rather than two competing ones. */
  .steps,.okbox,.warnbox,.qbox{max-width:760px}
  .steps{display:flex; gap:8px; align-items:center; margin-bottom:16px}
  .stp{font-size:13px; font-weight:500; color:var(--faint); padding:5px 12px;
    border-radius:20px; background:var(--surface); border:1px solid var(--line)}
  .stp.on{color:var(--blue); border-color:var(--blue-line); background:var(--blue-wash);
    font-weight:600}
  .stp.done{color:var(--muted); cursor:pointer}
  .stp.done:hover{border-color:var(--mid); color:var(--blue-ink)}

  .okbox,.warnbox,.qbox{border-radius:10px; padding:14px 16px; margin-bottom:12px;
    font-size:13.5px; line-height:1.55}
  .okbox{background:var(--blue-wash); border:1px solid var(--blue-line); color:var(--blue-ink)}
  .warnbox{background:#FDF3E3; border:1px solid #F3E2C4; color:#7A4A00}
  .qbox{background:var(--surface); border:1px solid var(--line); color:var(--ink)}
  .okbox b,.warnbox b,.qbox b{display:block; margin-bottom:3px; font-weight:600}
  .qbox ul{margin:6px 0 0; padding-left:20px}
  .qbox li{margin-bottom:4px}
  .warnbox .q{margin-top:5px; color:#6B4A10; font-style:italic}
  .warnbox .note{margin-top:6px; color:#8A6A30; font-style:normal}

  /* The sentence a value came from. Shown by default, not behind a hover —
     the whole point is checking the number without going looking for it. */
  .src{display:flex; align-items:flex-start; gap:7px; margin-top:5px; font-size:12px;
    color:var(--muted); line-height:1.45}
  .src .cf{flex:none; padding:1px 7px; border-radius:20px; background:var(--blue-wash);
    color:var(--blue-ink); font-weight:500; font-size:11px; text-transform:capitalize}
  .src.low .cf{background:#FDF3E3; color:#8A5200}
  .src .qt{flex:1; min-width:0; font-style:italic}
  .src .sr{flex:none; color:var(--faint)}
  .f.filled input,.f.filled select,.f.filled textarea{background:#FCFDFF;
    border-color:var(--blue-line)}

  .drop{display:flex; align-items:center; gap:10px; margin-top:7px}
  .drop .fn{font-size:12.5px; color:var(--faint)}
  .drop .fn.has{color:var(--blue-ink); font-weight:500}
  .drop .fn.bad{color:var(--critical)}
  .drop .clr{background:none; border:0; color:var(--muted); font:500 12.5px/1 "Inter",sans-serif;
    cursor:pointer; padding:4px}
  .drop .clr:hover{color:var(--critical)}
  .f textarea:disabled{background:var(--paper); color:var(--faint)}

  /* Client profile — prose, so it gets reading measure and spacing */
  /* ------------------------------------------------------- client profile */
  /* Ten thousand characters of genuinely useful prose is still a wall, and a
     wall gets skimmed once and never opened again. The lead stays visible; the
     rest collapses to one line per section so the shape of what is known is
     readable in three seconds and any part of it is one click away. */
  .pro-lead{font-size:15.5px; line-height:1.6; color:var(--ink); max-width:74ch;
    margin:0 0 4px}
  .pro-bar{display:flex; align-items:center; gap:10px; margin:16px 0 10px;
    flex-wrap:wrap}
  .pro-bar .sp{flex:1}
  .pro-secs{display:grid; gap:8px}
  .pro-sec{border:1px solid var(--line); border-radius:10px; background:var(--surface);
    overflow:hidden}
  .pro-sec.warn{border-color:#F0D9BE}
  .pro-head{display:flex; align-items:center; gap:11px; width:100%; text-align:left;
    padding:12px 14px; background:none; border:0; cursor:pointer; font:inherit;
    color:var(--ink)}
  .pro-head:hover{background:var(--paper)}
  .pro-head .tw{flex:none; width:11px; color:var(--mid); font-size:10px;
    transition:transform .12s ease}
  .pro-sec.on .tw{transform:rotate(90deg); color:var(--blue)}
  .pro-head .ti{font-size:14px; font-weight:600; letter-spacing:-.006em; flex:none}
  .pro-sec.on .pro-head .ti{color:var(--blue)}
  /* The teaser is what makes a collapsed section worth having: the section
     name alone says a topic exists, not what it says. */
  .pro-head .te{font-size:13px; color:var(--faint); flex:1; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .pro-head .ct{flex:none; font-size:11.5px; color:var(--faint);
    background:var(--paper); border-radius:999px; padding:3px 8px;
    font-variant-numeric:tabular-nums}
  .pro-sec.warn .pro-head .ct{background:#FDF4E9; color:var(--warning)}
  .pro-body{display:none; padding:2px 16px 16px 36px; font-size:14px; line-height:1.6}
  .pro-sec.on .pro-body{display:block}
  .pro-body p{margin:0 0 10px; max-width:74ch}
  .pro-pt{margin:0 0 12px; max-width:74ch}
  .pro-pt:last-child{margin-bottom:0}
  /* Every bullet in this profile is one claim followed by its evidence.
     Weighting the claim lets the eye take the section in a glance and read the
     support only where it matters. */
  .pro-pt .cl{display:block; font-weight:600; color:var(--ink)}
  .pro-pt .ev{display:block; color:var(--muted); font-size:13.5px; margin-top:2px}
  .pro-q{margin:0 0 14px; padding-left:13px; border-left:2px solid var(--blue-line);
    max-width:74ch}
  .pro-q:last-child{margin-bottom:0}
  .pro-q .qt{display:block; font-size:14.5px; color:var(--blue-ink); font-style:italic}
  .pro-q .qw{display:block; font-size:13px; color:var(--muted); margin-top:4px;
    font-style:normal}
  @media (max-width:640px){
    .pro-body{padding-left:16px}
    .pro-head .te{display:none}
  }

  .prof{max-width:760px; font-size:14px; line-height:1.65; color:var(--ink)}
  .prof p{margin:0 0 10px}
  .prof h4{font-size:12px; font-weight:600; text-transform:uppercase;
    letter-spacing:.05em; color:var(--muted); margin:18px 0 7px}
  .prof h4:first-child{margin-top:0}
  .prof ul{margin:0 0 10px; padding-left:18px}
  .prof li{margin-bottom:5px}

  /* Draft resume list */
  .drow{display:flex; gap:12px; align-items:center; padding:12px 0;
    border-top:1px solid var(--line)}
  .drow:first-child{border-top:0}
  .drow .bd{flex:1; min-width:0}
  .drow .nm{font-size:14px; font-weight:500; color:var(--ink);
    display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .drow .tag{font-size:11px; font-weight:600; text-transform:uppercase;
    letter-spacing:.03em; padding:2px 7px; border-radius:5px;
    background:var(--blue-wash); color:var(--blue-ink)}
  .drow .tag.done{background:#E6F4EA; color:var(--good)}
  .drow .mt{font-size:12.5px; color:var(--faint); margin-top:2px}
  .dbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    font-size:12.5px; color:var(--muted); background:var(--blue-wash);
    border:1px solid var(--blue-line); border-radius:8px;
    padding:9px 12px; margin-bottom:16px}
  .dbar b{color:var(--blue-ink); font-weight:600}
  .dbar .sp{flex:1}
  .lnk{background:none; border:0; padding:0; cursor:pointer; color:var(--blue);
    font:500 12.5px/1 "Inter",sans-serif; text-decoration:underline}
  .lnk:hover{color:var(--blue-dk)}
  .chk.off{opacity:.55}
  .pri-h{font-size:11px; font-weight:700; text-transform:uppercase;
    letter-spacing:.06em; color:var(--muted); margin:16px 0 6px}
  .pri-h:first-child{margin-top:4px}
  .pri-h span{color:var(--faint); font-weight:500}
  .act{display:flex; gap:12px; align-items:flex-start; padding:10px 0;
    border-top:1px solid var(--line)}
  .act .bd{flex:1; min-width:0}
  .act .nm{font-size:14px; font-weight:500; color:var(--ink)}
  .act .mt{font-size:13px; color:var(--muted); margin-top:2px}
  .act .meta{font-size:12px; color:var(--faint); margin-top:3px}
  .act .meta b{color:var(--warning); font-weight:600}
  .act.done .nm{text-decoration:line-through; color:var(--faint)}
  .act select{flex:none; width:124px}
  /* Wider than the status select next to it: a status is one short word, an
     owner is a person's full name and "Alexandra McCur…" names nobody. */
  .act .acts{flex:none; display:flex; flex-direction:column; gap:6px}
  .act .acts select{width:156px}
  .btn.danger{border-color:#F0C9C9; color:var(--critical)}
  .btn.danger:hover{background:#FDF2F2; border-color:var(--critical)}

  /* Facts first: name, contact, website, what they pay. Two columns of
     label/value, no inputs — reading these is a hundred times more common than
     editing them, and the editable form is still down in Details. */
  .facts{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr));

  .fact .v{flex:1; min-width:0; font-size:14px; overflow-wrap:anywhere}

  /* The profile is 10,000 characters even collapsed-by-section. Capping it and
     letting it scroll keeps the rest of the page reachable without a fold. */
  .prof-half{max-height:46vh; overflow-y:auto}
  .prof-half::-webkit-scrollbar{width:9px}
  .prof-half::-webkit-scrollbar-thumb{background:var(--tick-off); border-radius:9px}

  /* A phase heading is a button now, so a finished phase can be folded away.
     NOT scoped to .grp: docsCard renders the same toggle inside .card, where a
     .grp-scoped rule never matched — so it fell back to a default browser
     button, border and all, with "5 documents" and "uploaded at intake" run
     together because the flex gap was never applied either. */
  .phtog{background:none; border:0; padding:0; cursor:pointer; font:inherit;
    color:inherit; text-transform:inherit; letter-spacing:inherit;
    display:inline-flex; align-items:center; gap:7px; text-align:left}
  .phtog .tw{font-size:9px; color:var(--mid)}
  .phtog:hover{color:var(--blue)}
  .phtog .st{font-weight:500; color:var(--faint); text-transform:none;
    letter-spacing:0}

  /* ----------------------------------------------------------- team admin */
  .person{display:flex; gap:14px; align-items:flex-start; padding:14px 0;
    border-top:1px solid var(--line)}
  .person:first-child{border-top:0}
  .person .bd{flex:1; min-width:0}
  .person .nm{font-size:14.5px; font-weight:600}
  .person .nm .off{font-weight:500; color:var(--faint); font-size:12.5px;
    margin-left:7px}
  .person .em{font-size:13px; color:var(--muted); margin-top:1px;
    overflow-wrap:anywhere}
  .person .acts{flex:none; display:flex; gap:8px}
  /* Specialties are a chip list, not a comma string in a cell. The whole point
     of the admin screen is that the sheet's free text stopped being editable
     by anyone who is not the person who built the sheet. */
  .tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:7px}
  .tag{font:500 12px/1 "Inter",sans-serif; padding:5px 9px; border-radius:999px;
    background:var(--blue-wash); color:var(--blue-ink); border:1px solid var(--blue-line)}
  .tag.grey{background:var(--paper); color:var(--muted); border-color:var(--line)}
  .tag.none{background:none; border-style:dashed; border-color:var(--mid);
    color:var(--warning)}
  .skillbox{max-height:236px; overflow:auto; border:1px solid var(--line);
    border-radius:9px; padding:12px}
  .skillbox .pri-h:first-child{margin-top:0}

  /* Reading checklist — one row per source, updated as each one resolves. */
  .rrow{display:flex; gap:12px; padding:14px 0; border-top:1px solid var(--line)}
  .rrow:first-child{border-top:0}
  .rrow .ic{flex:none; width:20px; height:20px; margin-top:1px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font:600 11px/1 "Inter",sans-serif; color:#fff}
  .rrow .ic.wait{background:var(--tick-off)}
  .rrow .ic.read{background:var(--blue-wash); border:2px solid var(--blue);
    border-right-color:transparent; box-sizing:border-box; animation:spin .7s linear infinite}
  .rrow .ic.ok{background:var(--good)}
  .rrow .ic.fail{background:var(--critical)}
  .rrow .ic.skip{background:var(--mid)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .rrow .bd{flex:1; min-width:0}
  .rrow .nm{font-size:14px; font-weight:500; color:var(--ink);
    display:flex; gap:8px; align-items:baseline; flex-wrap:wrap}
  .rrow .via{font-size:12px; font-weight:400; color:var(--faint)}
  .rrow .st{font-size:13px; color:var(--muted); margin-top:3px}
  .rrow.fail .st{color:var(--critical)}
  .rrow .pv{font-size:12.5px; color:var(--faint); font-style:italic; margin-top:4px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .rrow .hnt{font-size:12.5px; color:var(--muted); margin-top:4px}
  .rrow .acts{display:flex; gap:8px; margin-top:9px; flex-wrap:wrap}
  .rrow .fix{margin-top:10px; display:none}
  .rrow .fix.on{display:block}
  .rrow .fix textarea{width:100%; min-height:90px; padding:10px 12px;
    border:1px solid var(--line); border-radius:8px; background:var(--surface);
    font:13.5px/1.5 "Inter",sans-serif; color:var(--ink); resize:vertical}
  .rrow .fix textarea:focus{outline:none; border-color:var(--blue);
    box-shadow:0 0 0 3px var(--blue-wash)}
  /* Higher specificity than .sect:first-child, which would otherwise strip the
     divider — the analysing panel is the only child of its wrapper. */
  #thinkWrap .sect{border-top:1px solid var(--line); padding:16px 24px}
  .thinking{display:flex; gap:12px; align-items:flex-start; padding:2px 0}
  .thinking .dots{flex:none; display:flex; gap:5px; margin-top:7px}
  .thinking .dots i{width:7px; height:7px; border-radius:50%; background:var(--blue);
    animation:pulse 1.2s ease-in-out infinite}
  .thinking .dots i:nth-child(2){animation-delay:.18s}
  .thinking .dots i:nth-child(3){animation-delay:.36s}
  @keyframes pulse{0%,100%{opacity:.25; transform:scale(.8)}50%{opacity:1; transform:scale(1)}}
  .thinking .tx{font-size:14px; color:var(--ink)}
  .thinking .el{font-size:12.5px; color:var(--faint); margin-top:2px;
    font-variant-numeric:tabular-nums}

  .feerow{display:flex; gap:9px; align-items:center; margin-bottom:8px}
  .feerow .fl{flex:1; padding:9px 11px; border:1px solid var(--line); border-radius:8px;
    font:14px/1.4 "Inter",sans-serif; background:var(--surface); color:var(--ink)}
  .feerow .fa{width:132px; flex:none; padding:9px 11px; border:1px solid var(--line);
    border-radius:8px; font:14px/1.4 "Inter",sans-serif; text-align:right;
    font-variant-numeric:tabular-nums; background:var(--surface); color:var(--ink)}
  .feerow input:focus{outline:none; border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-wash)}
  .feefoot{display:flex; align-items:center; gap:12px; margin-top:4px}
  .feetot{font-size:14px; color:var(--muted)}
  .feetot b{font-size:18px; color:var(--ink); font-variant-numeric:tabular-nums;
    margin-left:6px}
  .startrow{display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-top:12px}
  .startrow .mini{font-size:13.5px; color:var(--blue-ink); display:flex; align-items:center;
    gap:6px; cursor:pointer}
  .startrow .mini input{accent-color:var(--blue)}
  .startrow .btn{margin-left:auto}

  @media(max-width:760px){
    #app.on{grid-template-columns:1fr; background:var(--paper)}
    nav{height:auto; position:static; flex-direction:row; flex-wrap:wrap; align-items:center;
      padding:10px; border-right:0; border-bottom:1px solid var(--line)}
    nav .brand{padding:0 12px 0 6px}
    nav button{width:auto; margin-bottom:0}
    nav .spacer,nav .foot{display:none}
    .fields{grid-template-columns:1fr}
    /* A single non-wrapping flex row squeezes the company name to nothing and
       pushes the fraction off-screen. Stack identity above the status pills,
       and drop the per-task ticks — at this width they are sub-pixel and the
       fraction carries the same information. */
    .row{flex-wrap:wrap; row-gap:9px}
    .row .who{flex:1 0 100%}
    .row .act{width:100%}
    .ticks{display:none}
    .frac{min-width:0; text-align:left}
    .wrap{padding:18px 16px 36px}
    header{padding:16px}
    .task select{width:132px}
    /* Two selects plus a task name will not fit a phone in one row, so the
       task name takes the full width and the controls sit under it. */
    .task{flex-wrap:wrap; row-gap:9px}
    .task .n{flex:1 0 100%}
    .asgw{flex:1; width:auto; min-width:0}
    .asgw select.asg{width:100%}
    /* The reading step's bar carries four items; on one row the status text
       wraps to three lines and shoves the primary button off the card. */
    .bar{flex-wrap:wrap}
    .bar .sp{flex:1 0 100%; height:0}
    .bar .note{flex:1 0 100%; order:-1}
    #goAnalyse{flex:1}
  }
</style>

<body>

<div id="gate">
  <div class="mark">LD</div>
  <h1>Onboarding</h1>
  <p>Enter the dashboard PIN.</p>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="••••">
  <div id="gateMsg"></div>
</div>

<div id="app">
  <nav>
    <div class="brand"><div class="mark">LD</div><b>Onboarding</b></div>
    <button data-v="overview" class="on"><span class="ic">◇</span>Overview</button>
    <button data-v="queue"><span class="ic">▸</span>Queue</button>
    <button data-v="clients"><span class="ic">▤</span>Clients</button>
    <button data-v="team"><span class="ic">◍</span>Team</button>
    <button data-v="settings"><span class="ic">⚙</span>Settings</button>
    <div class="spacer"></div>
    <div class="foot">
      <button class="mono" id="refresh">↻ Refresh</button>
      <div id="stamp"></div>
    </div>
  </nav>
  <main>
    <header>
      <h1 id="hTitle">Overview</h1>
      <span class="sub" id="hSub"></span>
      <button class="btn pri" id="newBtn">+ New client</button>
    </header>
    <div class="wrap" id="view"></div>
  </main>
</div>

<script>
// ---------------------------------------------------------------- plumbing

var TOKEN = '';           // no localStorage in the Apps Script sandbox
var VIEW  = 'overview';
var CACHE = { overview:null, queue:null, platforms:null, options:null };

/**
 * How long a cached read of the sheet stays trustworthy.
 *
 * The database is a spreadsheet that people edit by hand — that is the whole
 * premise — so a cache with no expiry shows deleted clients until someone
 * thinks to press Refresh. Short enough that a sheet edit shows up on the next
 * click, long enough that moving between views does not refetch every time.
 */
var CACHE_TTL_MS = 30000;
var CACHE_AT = {};

function cachedRead(key, fetcher){
  var fresh = CACHE[key] && (Date.now() - (CACHE_AT[key] || 0)) < CACHE_TTL_MS;
  if (fresh) return Promise.resolve(CACHE[key]);
  return fetcher().then(function(d){
    CACHE[key] = d; CACHE_AT[key] = Date.now();
    return d;
  });
}
var DETAIL = null;

/**
 * Every server function this page calls. api() dispatches dynamically, which
 * hides the call sites from scripts/check.mjs — its whole job is proving each
 * google.script.run target exists and is public. So the list is declared here
 * and check.mjs validates it by name instead. Adding a call means adding it
 * here, or api() throws before the round trip.
 */
var SERVER_FNS = [
  'verifyPin', 'getDashboardOverview', 'getSendQueue', 'getClientDetail',
  'updateTaskStatus', 'updateClientField', 'dashCreateDrive', 'assignTask',
  'addTask', 'deleteTask', 'getRecentContext', 'addRecentNote', 'deleteRecentNote',
  'addManualCall', 'deleteRecentCall',
  'draftScopeEmail',
  'getTaskLibrary', 'saveTaskTemplate', 'deleteTaskTemplate',
  'getEmailTemplates', 'saveEmailTemplate', 'resetEmailTemplate',
  'dashPreview', 'dashPreviewNudge', 'dashSend', 'dashSendNudge',
  'getPlatformList', 'getIntakeOptions', 'submitIntake',
  'readSource', 'runExtraction', 'hasClickUpToken', 'startOnboarding',
  'createDraft', 'listDrafts', 'openDraft', 'saveDraft', 'deleteDraft', 'renameDraft',
  'buildClientProfile', 'getClientProfile', 'deleteClient',
  'getClientDocs', 'getTeam',
  'buildActionItems', 'getActionItems', 'updateActionItem',
  'slackTest', 'slackPeople', 'slackCreateChannel', 'slackPingOutstanding',
  'hasSlackToken', 'slackInvite', 'slackChannels', 'slackLinkChannel',
  'slackPingTasks', 'slackJoinChannel',
  'clickupFindCalls', 'clickupImportCall',
  'getTeamAdmin', 'saveTeamMember', 'deleteTeamMember', 'assignClientOwner',
  'syncTeamSlackIds', 'slackRoster', 'importTeamMembers'
];

/** google.script.run as a promise, so views can chain instead of nest. */
function api(fn){
  var args = [].slice.call(arguments, 1);
  if (SERVER_FNS.indexOf(fn) === -1){
    return Promise.reject(new Error('Unregistered server call: ' + fn));
  }
  return new Promise(function(res, rej){
    google.script.run
      .withSuccessHandler(res)
      .withFailureHandler(function(e){ rej(e); })[fn].apply(null, args);
  });
}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function el(id){ return document.getElementById(id); }
function toast(msg, bad){
  var t = document.createElement('div');
  t.className = 'toast' + (bad ? ' bad' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, bad ? 6000 : 3200);
}
function fail(e){ toast((e && e.message) || String(e), true); }
function ticks(done, total){
  var n = Math.min(total || 0, 26), out = '';
  var on = total ? Math.round((done / total) * n) : 0;
  for (var i = 0; i < n; i++) out += '<div class="tick' + (i < on ? ' on' : '') + '"></div>';
  return '<div class="ticks">' + out + '</div>';
}
/** Status colour always ships with its own text label — never colour alone. */
function pill(kind, label){
  return '<span class="pill ' + kind + '"><span class="dot ' + kind + '"></span>'
    + esc(label) + '</span>';
}
function loading(){
  var r = '';
  for (var i = 0; i < 4; i++){
    r += '<div class="row"><div class="who"><div class="skel" style="width:38%"></div>'
      + '<div class="skel" style="width:22%; margin-top:7px; height:9px"></div></div></div>';
  }
  return '<div class="card">' + r + '</div>';
}
function emptyState(title, body){
  return '<div class="card"><div class="empty"><b>' + esc(title) + '</b>' + esc(body) + '</div></div>';
}

// ---------------------------------------------------------------- gate

function enterApp(token){
  TOKEN = token;
  el('gate').style.display = 'none';
  el('app').classList.add('on');
  go('overview');
}

el('pin').addEventListener('keydown', function(e){
  if (e.key !== 'Enter') return;
  var v = el('pin').value;
  el('gateMsg').textContent = 'Checking…';
  api('verifyPin', v).then(function(r){
    if (!r.ok){ el('gateMsg').textContent = r.message; el('pin').select(); return; }
    enterApp(r.token);
  }).catch(function(e){ el('gateMsg').textContent = (e && e.message) || 'Failed.'; });
});

/**
 * No PIN set means no gate at all.
 *
 * verifyPin already issues a token when there is nothing to check, so the
 * screen was a box you typed anything into and pressed Enter — a lock with no
 * key in it, which is worse than no lock: it looks like security while being
 * a keystroke. Reaching this URL at all requires a signed-in account on the
 * Workspace domain, and that is the boundary that actually holds.
 */
el('gateMsg').textContent = 'Checking…';
api('verifyPin', '').then(function(r){
  if (r && r.ok && r.unset){ enterApp(r.token); return; }
  el('gateMsg').textContent = '';
  el('pin').focus();
}).catch(function(){
  // A failure here is not a reason to lock somebody out of a tool with no
  // PIN on it — fall back to showing the box.
  el('gateMsg').textContent = '';
  el('pin').focus();
});

// ---------------------------------------------------------------- routing

var TITLES = {
  overview:['Overview','How onboarding is tracking right now'],
  queue:['Queue','What can be sent, and what is blocking the rest'],
  clients:['Clients','Every account and where it has got to'],
  team:['Team','Who works here, what they cover, and which accounts they own'],
  settings:['Settings','The task library and the email copy every client gets'],
  'new':['New client','One submit builds the record, tasks, folder and plan']
};
[].forEach.call(document.querySelectorAll('nav button[data-v]'), function(b){
  b.addEventListener('click', function(){ go(b.getAttribute('data-v')); });
});
el('newBtn').addEventListener('click', function(){ go('new'); });
el('refresh').addEventListener('click', function(){
  CACHE.overview = null; CACHE.queue = null; go(VIEW);
});

function go(v){
  VIEW = v; DETAIL = null;
  [].forEach.call(document.querySelectorAll('nav button[data-v]'), function(b){
    b.classList.toggle('on', b.getAttribute('data-v') === v);
  });
  el('hTitle').textContent = TITLES[v][0];
  el('hSub').textContent = TITLES[v][1];
  el('newBtn').style.display = (v === 'new') ? 'none' : '';
  if (v === 'overview') renderOverview();
  else if (v === 'queue') renderQueue();
  else if (v === 'team') renderTeam();
  else if (v === 'settings') renderSettings();
  else if (v === 'clients') renderClients();
  else renderIntake();
}
function stamp(){
  var d = new Date();
  el('stamp').textContent = 'Updated ' + d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

// ---------------------------------------------------------------- overview

function renderOverview(){
  el('view').innerHTML = loading();
  var p = cachedRead('overview', function(){ return api('getDashboardOverview', TOKEN); });
  p.then(function(d){
    stamp();
    var t = d.totals || {clients:0, overdue:0, blocked:0, stale:0};
    var live = (d.clients || []).filter(function(c){
      return c.status !== 'Churned' && c.status !== 'Paused';
    });
    // A client belongs to exactly one section. Overdue/blocked outranks
    // waiting, otherwise the same row appears twice and the counts read as
    // more clients in trouble than there are.
    var attention = live.filter(function(c){ return c.overdue || c.blocked; });
    var seen = {};
    attention.forEach(function(c){ seen[c.clientId] = 1; });
    var waiting = live.filter(function(c){
      return !seen[c.clientId] && c.daysWaiting !== null && c.daysWaiting >= 5;
    });

    var h = '<div class="stats">'
      + statTile('idle', 'Onboarding', live.length, live.length === 1 ? 'client active' : 'clients active')
      + statTile('critical', 'Overdue', t.overdue, t.overdue === 1 ? 'client past due' : 'clients past due')
      + statTile('serious', 'Blocked', t.blocked, 'have a blocked task')
      + statTile('warning', 'Waiting', t.stale, 'chased 5+ days ago')
      + '</div>';

    h += '<div class="grp">Needs attention <span class="n">' + attention.length + '</span></div>';
    h += attention.length
      ? '<div class="card">' + attention.map(clientRow).join('') + '</div>'
      : emptyState('Nothing overdue or blocked', 'Every active client is on schedule.');

    if (waiting.length){
      h += '<div class="grp">Waiting on client <span class="n">' + waiting.length + '</span></div>';
      h += '<div class="card">' + waiting.map(clientRow).join('') + '</div>';
    }
    el('view').innerHTML = h;
    wireClientRows();
  }).catch(function(e){
    el('view').innerHTML = emptyState('Could not load', (e && e.message) || 'Unknown error.');
  });
}
function statTile(kind, label, value, cap){
  return '<div class="card stat">'
    + '<div class="k"><span class="dot ' + kind + '"></span>'
    + '<span class="eyebrow">' + esc(label) + '</span></div>'
    + '<div class="v">' + (value || 0) + '</div>'
    + '<div class="cap">' + esc(cap) + '</div></div>';
}
function clientRow(c){
  var tags = '';
  if (c.overdue) tags += pill('critical', c.overdue + ' overdue');
  if (c.blocked) tags += pill('serious', c.blocked + ' blocked');
  if (c.daysWaiting !== null && c.daysWaiting >= 5) tags += pill('warning', c.daysWaiting + 'd waiting');
  if (!tags && c.pct === 100) tags = pill('good', 'complete');
  return '<div class="row clickable" data-id="' + esc(c.clientId) + '">'
    + '<div class="who"><div class="co">' + esc(c.company) + '</div>'
    + '<div class="meta">' + esc(c.status || '—') + (c.owner ? ' · ' + esc(c.owner) : '') + '</div></div>'
    + tags + ticks(c.done, c.total)
    + '<div class="frac">' + c.done + '/' + c.total + '</div></div>';
}
/**
 * The answers to "who are these people", above everything else.
 *
 * Every one of these already existed on the page, as an editable field halfway
 * down. That is the right place to CHANGE a website and the wrong place to
 * READ one — answering "what is their URL" meant scrolling past ten thousand
 * characters of profile to reach a text input.
 */
function factsCard(c){
  var rows = [
    ['Contact', c.contact],
    ['Email', c.email ? '<a href="mailto:' + esc(c.email) + '">' + esc(c.email) + '</a>' : '', true],
    ['Website', c.website
      ? '<a href="' + esc(/^https?:/i.test(c.website) ? c.website : 'https://' + c.website)
        + '" target="_blank">' + esc(c.website) + '</a>' : '', true],
    ['Vertical', c.vertical],
    ['Contract start', c.contractStart],
    ['MRR', c.mrr ? (typeof c.mrr === 'number' ? '$' + c.mrr.toLocaleString() : c.mrr) : ''],
    ['Term', c.term],
    ['Owner', c.owner],
    ['Services', c.services],
    ['Slack', c.slack]
  ].filter(function(r){ return r[1]; });

  return '<div class="card facts">' + rows.map(function(r){
    return '<div class="fact"><span class="k">' + esc(r[0]) + '</span>'
      + '<span class="v">' + (r[2] ? r[1] : esc(r[1])) + '</span></div>';
  }).join('') + '</div>';
}

/**
 * Who a task is on, and how long it has been on them.
 *
 * People are ranked against the task rather than listed alphabetically. A
 * checklist is twenty rows deep and every row wants a different specialist —
 * scrolling a flat list of fourteen names twenty times is how assignment stops
 * happening. Whoever covers "Google Ads" comes first on the Google Ads row.
 *
 * The client sits in their own group. A third of the checklist is not our work
 * at all, and "waiting on them" is a different state from "nobody picked it up"
 * even though an empty Owner cell renders both the same.
 */
function assignCell(t, assignees){
  var suggested = [], others = [], client = [];
  assignees.forEach(function(p){
    if (p.kind === 'client'){ client.push(p); return; }
    (coversTask(p, t) ? suggested : others).push(p);
  });

  function opts(list){
    return list.map(function(p){
      return '<option' + (p.name === t.owner ? ' selected' : '') + '>'
        + esc(p.name) + '</option>';
    }).join('');
  }

  var sel = '<select class="asg" data-assign="' + esc(t.task) + '">'
    + '<option value=""' + (t.owner ? '' : ' selected') + '>Unassigned</option>'
    + (suggested.length ? '<optgroup label="Covers this">' + opts(suggested) + '</optgroup>' : '')
    + (others.length ? '<optgroup label="Team">' + opts(others) + '</optgroup>' : '')
    + (client.length ? '<optgroup label="Client">' + opts(client) + '</optgroup>' : '');

  // An owner who has left the team still has work against their name. Keeping
  // them as an option is what stops opening the dropdown from silently
  // reassigning the row to nobody.
  var known = assignees.some(function(p){ return p.name === t.owner; });
  if (t.owner && !known) sel += '<option selected>' + esc(t.owner) + '</option>';
  sel += '</select>';

  return '<div class="asgw">' + sel
    + '<span class="age" data-age="' + esc(t.task) + '">' + esc(assignAge(t)) + '</span></div>';
}

/** "assigned 9d ago" — silent once the task is closed or nobody owns it. */
function assignAge(t){
  if (!t.owner) return '';
  if (t.status === 'Complete' || t.status === 'N/A') return '';
  if (!t.assignedDays) return t.assigned ? 'assigned today' : '';
  return 'assigned ' + t.assignedDays + 'd ago';
}

/**
 * Whether someone's specialties cover this task.
 *
 * Every word of the specialty has to appear, not just the distinctive-looking
 * ones. Dropping short words first looks reasonable and is how "Google Ads"
 * became "google" and put the paid-search specialist at the top of the Google
 * Analytics row — the harness caught exactly that.
 *
 * Matching is per token against tokens, so "Google Analytics 4" still covers
 * "Google Analytics (GA4)" through the 4 in GA4, while "Google Ads" does not
 * cover it at all. Stopwords are dropped because "Analytics and tracking"
 * should not require the word "and" to appear in a task name.
 */
var SKILL_STOP = { and:1, the:1, of:1, for:1, to:1, a:1 };

function coversTask(p, t){
  var hay = tokens_((t.task || '') + ' ' + (t.category || ''));
  if (!hay.length) return false;

  return (p.skills || []).some(function(s){
    var want = tokens_(s);
    if (!want.length) return false;
    return want.every(function(w){
      return hay.some(function(h){ return h === w || h.indexOf(w) !== -1; });
    });
  });
}

function tokens_(s){
  return String(s || '').toLowerCase().split(/[^a-z0-9]+/)
    .filter(function(w){ return w && !SKILL_STOP[w]; });
}

/** One editable Clients-tab field. Saves on change; no explicit save button. */
function pField(field, label, value, options, area){
  var v = value == null ? '' : value;
  var input;
  if (options){
    var has = options.indexOf(v) !== -1;
    input = '<select data-field="' + field + '">'
      + (has ? '' : '<option value="' + esc(v) + '" selected>' + esc(v || '—') + '</option>')
      + options.map(function(o){
          return '<option' + (o === v ? ' selected' : '') + '>' + esc(o) + '</option>';
        }).join('') + '</select>';
  } else if (area){
    input = '<textarea data-field="' + field + '">' + esc(v) + '</textarea>';
  } else {
    input = '<input data-field="' + field + '" value="' + esc(v) + '">';
  }
  return '<div class="f' + (area ? ' wide' : '') + '"><label>' + esc(label) + '</label>'
    + input + '</div>';
}

/**
 * The library, grouped by phase then category.
 *
 * Phase is the axis people think in — "what happens in phase 2" is a real
 * question and "show me everything alphabetically" is not. Category is the
 * channel grouping inside it.
 */
function taskLibraryCard(r){
  var tasks = r.tasks || [];
  var byPhase = {};
  tasks.forEach(function(t){ (byPhase[t.phase] = byPhase[t.phase] || []).push(t); });

  var h = '';
  Object.keys(byPhase).sort().forEach(function(k){
    var list = byPhase[k].slice().sort(function(a, b){
      return (a.category || '').localeCompare(b.category || '')
        || a.task.localeCompare(b.task);
    });
    h += '<div class="grp">Phase ' + esc(k) + ' <span class="n">'
      + list.length + '</span></div><div class="card"><div class="sect">'
      + list.map(function(t){
          var bits = [t.category || 'Uncategorised', t.method];
          if (t.always) bits.push('always included');
          if (t.requires) bits.push('needs ' + t.requires);
          if (t.bizType) bits.push(t.bizType + ' only');
          if (t.gate) bits.push('gate');
          if (t.offset !== '') bits.push('due +' + t.offset + 'd');
          if (t.owner) bits.push(t.owner);
          return '<div class="crow' + (t.active ? '' : ' off') + '">'
            + '<div class="bd"><div class="nm">' + esc(t.task)
            + (t.active ? '' : ' <span class="pill">inactive</span>') + '</div>'
            + '<div class="meta">' + esc(bits.join(' · ')) + '</div></div>'
            + '<button class="btn sm" data-edit-task="' + t.row + '">Edit</button>'
            + '</div>';
        }).join('')
      + '</div></div>';
  });

  if (!tasks.length){
    h = emptyState('No task templates',
      'Run setup() in the sheet to seed the standard library.');
  }

  h += '<div class="grp">Editor</div><div class="card">'
    + '<div class="sect" id="stEdit">'
    + (SETTINGS.editing
        ? taskTemplateForm(SETTINGS.editing, r)
        : '<h3>Nobody selected</h3><div class="hint" style="margin:0">Pick a task '
          + 'above, or add one.</div>')
    + '</div><div class="sect"><div class="startrow">'
    + '<button class="btn pri" id="addTaskTpl">+ Add a task</button></div>'
    + '</div></div>';
  return h;
}

function taskTemplateForm(t, r){

  function sel(id, val, opts, blank){

    + '<div class="f"><label>How access is granted</label>'

    + '<div class="f"><label>Business type</label>'
      + sel('tpBiz', t.bizType, r.bizTypes, 'Any') + '</div>'
    + '<div class="f"><label>Only when we also have</label>'
      + sel('tpReq', t.requires,
            (r.taskNames || []).filter(function(n){ return n !== t.task; }),
            'Nothing — include on its own') + '</div>'
    + '<div class="f"><label>Default owner</label>'
      + sel('tpOwner', t.owner, r.team, 'Onboarding owner') + '</div>'
    + '<div class="f"><label>Due offset (days from contract start)</label>'
      + '<input id="tpOffset" type="number" value="' + esc(t.offset) + '"></div>'
    + '<div class="f"><label>Typical lead time</label>'
      + '<input id="tpLead" value="' + esc(t.lead) + '" placeholder="1-3 days"></div>'
    + '<div class="f wide"><label>What we need from the client</label>'
      + '<input id="tpNeeds" value="' + esc(t.needs) + '"></div>'
    + '<div class="f wide"><label>How it is granted, in words</label>'
      + '<textarea id="tpHow">' + esc(t.how) + '</textarea></div>'
    + '</div>'
    + '<div class="startrow">'
    + '<label class="mini"><input type="checkbox" id="tpAlways"'
      + (t.always ? ' checked' : '') + '> Always include</label>'
    + '<label class="mini"><input type="checkbox" id="tpGate"'
      + (t.gate ? ' checked' : '') + '> Gate</label>'
    + '<label class="mini"><input type="checkbox" id="tpActive"'

}

function wireTaskLibrary(){
  [].forEach.call(document.querySelectorAll('[data-edit-task]'), function(b){
    b.addEventListener('click', function(){
      var row = Number(b.getAttribute('data-edit-task'));
      SETTINGS.editing = (SETTINGS.lib.tasks || [])
        .filter(function(t){ return t.row === row; })[0];
      renderSettings();
    });
  });

  if (el('addTaskTpl')){
    el('addTaskTpl').addEventListener('click', function(){
      SETTINGS.editing = null;
      el('stEdit').innerHTML = taskTemplateForm(null, SETTINGS.lib);
      wireTaskForm();
      el('stEdit').scrollIntoView({ behavior:'smooth', block:'nearest' });
    });
  }
  wireTaskForm();
}

function wireTaskForm(){
  if (!el('tpSave')) return;

  el('tpCancel').addEventListener('click', function(){
    SETTINGS.editing = null; renderSettings();
  });

  if (el('tpDel')){
    el('tpDel').addEventListener('click', function(){
      var b = this;
      if (b.getAttribute('data-armed') !== '1'){
        b.setAttribute('data-armed', '1'); b.textContent = 'Really delete?';
        setTimeout(function(){
          if (!b.parentNode) return;
          b.removeAttribute('data-armed'); b.textContent = 'Delete';
        }, 5000);
        return;
      }
      b.disabled = true;
      api('deleteTaskTemplate', TOKEN, Number(el('tpRow').value)).then(function(r){
        if (!r.ok){ b.disabled = false; b.textContent = 'Delete'; toast(r.message, true); return; }
        toast('Deleted "' + r.task + '". Existing checklists keep it.');
        SETTINGS.editing = null; renderSettings();
      }).catch(function(e){
        b.disabled = false; b.textContent = 'Delete'; fail(e);
      });
    });
  }

  el('tpSave').addEventListener('click', function(){
    var b = this; b.disabled = true; b.textContent = 'Saving…';
    api('saveTaskTemplate', TOKEN, {
      row: Number(el('tpRow').value) || 0,
      task: el('tpTask').value,
      category: el('tpCat').value,
      method: el('tpMethod').value,
      needs: el('tpNeeds').value,
      how: el('tpHow').value,
      lead: el('tpLead').value,
      offset: el('tpOffset').value,
      owner: el('tpOwner').value,
      phase: Number(el('tpPhase').value) || 1,
      gate: el('tpGate').checked,
      always: el('tpAlways').checked,
      active: el('tpActive').checked,
      bizType: el('tpBiz').value,
      requires: el('tpReq').value
    }).then(function(r){
      b.disabled = false; b.textContent = 'Save';
      if (!r.ok){ toast(r.message, true); return; }
      toast(r.created ? 'Added "' + r.task + '".' : 'Saved.');
      SETTINGS.editing = null; renderSettings();
    }).catch(function(e){
      b.disabled = false; b.textContent = 'Save'; fail(e);
    });
  });
}

function emailTemplatesCard(r){
  function group(title, list, hint){
    if (!list.length) return '';
    return '<div class="grp">' + esc(title) + ' <span class="n">' + list.length
      + '</span></div><div class="card"><div class="sect">'
      + (hint ? '<div class="hint">' + hint + '</div>' : '')
      + list.map(function(t){
          // Three states, and they are not the same. Edited means somebody
          // changed it; shipped means the wording in the code is what sends,
          // and showing that as "no copy yet" is how the welcome email looked
          // missing while it was going out perfectly well.
          var tag = t.source === 'shipped' ? ' <span class="pill">shipped copy</span>'
                  : t.source === 'none' ? ' <span class="pill">no copy yet</span>' : '';
          return '<div class="crow"><div class="bd">'
            + '<div class="nm">' + esc(t.label) + tag + '</div>'
            + '<div class="meta">' + esc(t.subject || t.when || 'Not written') + '</div>'
            + '</div>'
            + '<button class="btn sm" data-edit-mail="' + esc(t.key) + '">'
            + (t.source === 'none' ? 'Write' : 'Edit') + '</button></div>';
        }).join('')
      + '</div></div>';
  }

  var h = group('Moments', r.moments || [],
    'Emails that belong to a point in the relationship rather than to a task. '
    + 'Before this they lived in somebody\'s drafts folder.');

  h += group('Per task', r.tasks || [],
    'The access request for each task. Anything left blank falls back to the '
    + 'wording shipped in the code, so an empty row is not a broken email.');

  h += group('Orphaned', r.orphans || [],
    'Copy on the Templates tab matching no task or moment — usually a task '
    + 'renamed since. Nothing sends these.');

  h += '<div class="grp">Editor</div><div class="card"><div class="sect" id="mailEdit">'
    + '<h3>Nothing open</h3><div class="hint" style="margin:0">Pick a template '
    + 'above.</div></div></div>';
  return h;
}

function wireEmailTemplates(){
  [].forEach.call(document.querySelectorAll('[data-edit-mail]'), function(b){

}

function personRow(p){
  var tags = (p.skills || []).map(function(s){
    return '<span class="tag">' + esc(s) + '</span>';
  }).join('');
  // No specialties is worth saying out loud: it is the difference between
  // someone the audit can assign work to and someone it will skip.
  if (!tags) tags = '<span class="tag none">no specialties — cannot be assigned by skill</span>';
  if (!p.slackId) tags += '<span class="tag grey">no Slack ID</span>';
  (p.clients || []).slice(0, 4).forEach(function(c){
    tags += '<span class="tag grey">' + esc(c) + '</span>';
  });
  if ((p.clients || []).length > 4){
    tags += '<span class="tag grey">+' + (p.clients.length - 4) + ' more</span>';
  }

  return '<div class="person">'
    + '<div class="bd"><div class="nm">' + esc(p.name)
    + (p.active ? '' : '<span class="off">inactive</span>') + '</div>'
    + '<div class="em">' + esc(p.email || 'no email')
    + (p.role ? ' · ' + esc(p.role) : '') + '</div>'
    + '<div class="tags">' + tags + '</div></div>'
    + '<div class="acts">'
    + '<button class="btn sm" data-edit-row="' + p.row + '">Edit</button>'
    + '<button class="btn sm danger" data-del-row="' + p.row + '">Remove</button>'
    + '</div></div>';
}

/**
 * The add/edit form.
 *
 * Specialties are checkboxes off a known list rather than a text field. The
 * audit matches them loosely against services and platforms, and a loose match
 * against something somebody typed is how "PPC" and "Paid search" become two
 * skills that assign to nobody.
 */
function teamForm(p){
  p = p || { row:0, name:'', email:'', slackId:'', skills:[], role:'', active:true };
  var have = {};
  (p.skills || []).forEach(function(s){ have[s.toLowerCase()] = 1; });

  var groups = {};
  TEAM.skillOptions.forEach(function(s){
    (groups[s.group] = groups[s.group] || []).push(s);
  });

  var picker = '';
  ['Discipline', 'Service', 'Platform'].forEach(function(g){
    if (!groups[g]) return;
    picker += '<div class="pri-h">' + esc(g) + '<span> ' + groups[g].length + '</span></div>';
    picker += '<div class="checks">' + groups[g].map(function(s){
      return '<label class="chk"><input type="checkbox" data-skill="' + esc(s.name) + '"'
        + (have[s.name.toLowerCase()] ? ' checked' : '') + '>'
        + '<span><span class="nm">' + esc(s.name) + '</span></span></label>';
    }).join('') + '</div>';
  });

  return '<h3>' + (p.row ? esc(p.name) : 'Add someone') + '</h3>'
    + '<div class="hint">Specialties decide who audit action items land on. '
    + 'The Slack member ID (U01AB…) is what invites and mentions use — leave it '
    + 'blank and "Match everyone to Slack" will fill it in from the email.</div>'
    + '<input type="hidden" id="tmRow" value="' + (p.row || 0) + '">'
    + '<div class="fields">'
    + '<div class="f"><label>Name</label><input id="tmName" value="' + esc(p.name) + '"></div>'
    + '<div class="f"><label>Work email</label><input id="tmEmail" value="' + esc(p.email) + '"></div>'
    + '<div class="f"><label>Role</label><select id="tmRole">'
    + '<option value="">—</option>'
    + TEAM.roles.map(function(o){
        return '<option' + (o === p.role ? ' selected' : '') + '>' + esc(o) + '</option>';
      }).join('')
    + (p.role && TEAM.roles.indexOf(p.role) === -1
        ? '<option selected>' + esc(p.role) + '</option>' : '')
    + '</select></div>'
    + '<div class="f"><label>Slack member ID</label>'
    + '<input id="tmSlack" value="' + esc(p.slackId) + '" placeholder="U01ABC2DEF"></div>'
    + '<div class="f wide"><label>Specialties</label>'
    + '<div class="skillbox">' + picker + '</div></div>'
    + '</div>'
    + '<div class="startrow">'
    + '<label class="mini"><input type="checkbox" id="tmActive"'
    + (p.active === false ? '' : ' checked') + '> Active</label>'
    + '<button class="btn" id="tmCancel">Cancel</button>'
    + '<button class="btn pri" id="tmSave">Save</button></div>';
}

function wireTeam(){

      api('slackRoster').then(function(r){
        b.disabled = false; b.textContent = 'Import from Slack';
        if (!r || !r.ok){
          box.innerHTML = '<div class="grp">From Slack</div>'

    el('syncSlack').addEventListener('click', function(){

        .then(function(r){
          toast(r.ok ? 'Assigned to ' + sel.value + '.' : r.message, !r.ok);
          if (r.ok){ CACHE.overview = null; renderTeam(); }
        }).catch(fail);
    });

/**
 * The Slack workspace, as a pick list.
 *
 * Building the team by typing eleven names, emails and member IDs is the kind
 * of setup people abandon halfway, and the half-built directory then assigns
 * work to nobody without saying so. Slack already holds all three.
 */
var ROSTER = [];

function rosterCard(r){
  var addable = ROSTER.filter(function(p){ return !p.onTeam; });

  var h = '<h3>' + ROSTER.length + ' in the workspace</h3>'
    + '<div class="hint">Tick who belongs on the team. Names, emails and member '
    + 'IDs come across as they are. Specialties are left blank — Slack does not '
    + 'know who does paid search, and a job title is not something to assign '
    + 'real work off — so set those in the editor afterwards.</div>';

  if (r.emailScopeMissing){
    h += '<div class="hint" style="color:var(--warning)">Slack returned nobody '
      + 'with an email, which is what a missing <b>users:read.email</b> scope '
      + 'looks like. People will import without one and can still be matched by '
      + 'member ID. Add the scope and reinstall the app to get emails.</div>';
  }
  if (!addable.length){
    return h + '<div class="hint" style="margin:0">Everyone in the workspace is '
      + 'already on the team.</div>';
  }

  h += '<div class="f" style="margin-bottom:14px">'
    + '<input id="rosterFind" placeholder="Filter by name or email">'
    + '<span class="note" id="rosterCount"></span></div>';

  h += '<div class="checks" id="rosterList">' + ROSTER.map(function(p, i){
    var sub = p.email || 'no email';
    if (p.title) sub += ' · ' + p.title;
    if (p.guest) sub += ' · guest';
    if (p.onTeam) sub = 'already on the team';
    return '<label class="chk' + (p.onTeam ? ' off' : '') + '" data-roster="' + i + '" '
      + 'data-find="' + esc((p.name + ' ' + p.email).toLowerCase()) + '">'
      + '<input type="checkbox" data-pick="' + i + '"' + (p.onTeam ? ' disabled' : '') + '>'
      + '<span><span class="nm">' + esc(p.name) + '</span><br>'
      + '<span class="cat">' + esc(sub) + '</span></span></label>';
  }).join('') + '</div>';

  h += '<div class="startrow">'
    + '<button class="btn" id="rosterAll">Select all ' + addable.length + '</button>'
    + '<button class="btn" id="rosterNone">Clear</button>'
    + '<button class="btn pri" id="rosterAdd">Add selected</button></div>';
  return h;
}

function wireRoster(){
  function count(){
    var n = document.querySelectorAll('[data-pick]:checked').length;
    if (el('rosterCount')) el('rosterCount').textContent = n + ' selected';
  }
  [].forEach.call(document.querySelectorAll('[data-pick]'), function(i){
    i.addEventListener('change', count);
  });
  count();

  if (el('rosterFind')){
    el('rosterFind').addEventListener('input', function(){
      var q = this.value.trim().toLowerCase();
      [].forEach.call(document.querySelectorAll('[data-roster]'), function(l){
        l.style.display = (!q || l.getAttribute('data-find').indexOf(q) !== -1)
          ? '' : 'none';
      });
    });
  }

  if (el('rosterAll')){
    el('rosterAll').addEventListener('click', function(){
      // Only what is on screen: with a filter applied, "select all" meaning
      // the whole workspace is how you import forty people by accident.
      [].forEach.call(document.querySelectorAll('[data-roster]'), function(l){
        var i = l.querySelector('[data-pick]');
        if (i && !i.disabled && l.style.display !== 'none') i.checked = true;
      });
      count();
    });
  }
  if (el('rosterNone')){
    el('rosterNone').addEventListener('click', function(){
      [].forEach.call(document.querySelectorAll('[data-pick]'), function(i){ i.checked = false; });
      count();
    });
  }

  if (el('rosterAdd')){
    el('rosterAdd').addEventListener('click', function(){
      var b = this;
      var picked = [].filter.call(document.querySelectorAll('[data-pick]'),
        function(i){ return i.checked; })
        .map(function(i){ return ROSTER[Number(i.getAttribute('data-pick'))]; })
        .filter(Boolean);

      if (!picked.length){ toast('Tick who should be added first.', true); return; }
      b.disabled = true; b.textContent = 'Adding ' + picked.length + '…';
      api('importTeamMembers', TOKEN, picked.map(function(p){
        return { name:p.name, email:p.email, slackId:p.slackId, role:'' };
      })).then(function(r){
        b.disabled = false; b.textContent = 'Add selected';
        if (!r.ok){ toast(r.message, true); return; }
        toast('Added ' + r.added
          + (r.skipped.length ? ', skipped ' + r.skipped.length + ' already on the team' : '')
          + '. Set their specialties next.');
        if (r.noEmail){
          toast(r.noEmail + ' came across without an email — they can still be '
            + 'invited to channels by member ID.', true);
        }
        renderTeam();
      }).catch(function(e){
        b.disabled = false; b.textContent = 'Add selected'; fail(e);
      });
    });
  }
}

function openTeamForm(p){

// ---------------------------------------------------------------- queue

function renderQueue(){
  el('view').innerHTML = loading();
  var p = cachedRead('queue', function(){ return api('getSendQueue', TOKEN); });
  p.then(function(q){
    stamp();
    var h = '';
    h += section('Ready to send', q.ready, function(r){
      return actions(r, [['pri', 'Preview', 'preview']]);
    }, 'Nothing is ready', 'Every phase email is either sent or waiting on internal work.');

    h += section('Waiting on client', q.waiting, function(r){
      return (r.days != null ? pill('warning', r.days + 'd') : '')
        + actions(r, [['', 'Nudge', 'nudge']]);
    }, 'Nobody is waiting', 'No outstanding client requests.');

    h += section('Held by internal work', q.gated, function(r){
      return '<div class="frac">' + (r.reasons || []).length + ' gate'
        + ((r.reasons || []).length === 1 ? '' : 's') + '</div>';
    }, 'Nothing held', 'No phase is blocked by internal setup.');

    h += section('Needs fixing', q.blocked, function(r){
      return pill('critical', (r.problems || []).length + ' problem'
        + ((r.problems || []).length === 1 ? '' : 's'));
    }, 'Nothing broken', 'No preflight problems.');

    el('view').innerHTML = h;
    wireQueue();
  }).catch(function(e){
    el('view').innerHTML = emptyState('Could not load', (e && e.message) || 'Unknown error.');
  });
}
function section(title, rows, right, emptyTitle, emptyBody){
  rows = rows || [];
  var h = '<div class="grp">' + esc(title) + ' <span class="n">' + rows.length + '</span></div>';
  if (!rows.length) return h + emptyState(emptyTitle, emptyBody);
  h += '<div class="card">' + rows.map(function(r){
    var detail = [];
    if (r.phaseName) detail.push('Phase ' + r.phase + ' · ' + r.phaseName);
    if (r.owner) detail.push(r.owner);
    if (r.count) detail.push(r.count + ' task' + (r.count === 1 ? '' : 's'));
    var sub = (r.reasons || r.problems || []).slice(0, 2).join(' · ');
    return '<div class="row"><div class="who">'
      + '<div class="co">' + esc(r.company) + '</div>'
      + '<div class="meta">' + esc(detail.join(' · ')) + (sub ? ' — ' + esc(sub) : '') + '</div>'
      + '</div>' + right(r) + '</div>';
  }).join('') + '</div>';
  return h;
}
function actions(r, list){
  return '<div class="act">' + list.map(function(a){
    return '<button class="btn sm ' + a[0] + '" data-act="' + a[2] + '" data-id="'
      + esc(r.clientId) + '" data-phase="' + (r.phase || '') + '">' + a[1] + '</button>';
  }).join('') + '</div>';
}
function wireQueue(){
  [].forEach.call(document.querySelectorAll('[data-act]'), function(b){
    b.addEventListener('click', function(){
      var id = b.getAttribute('data-id'), ph = b.getAttribute('data-phase');
      var nudge = b.getAttribute('data-act') === 'nudge';
      b.disabled = true; b.textContent = '…';
      var call = nudge ? api('dashPreviewNudge', TOKEN, id) : api('dashPreview', TOKEN, id, Number(ph));
      call.then(function(p){
        b.disabled = false; b.textContent = nudge ? 'Nudge' : 'Preview';
        if (!p.ok){ toast(p.message || 'Cannot preview.', true); return; }
        showPreview(p, id, ph, nudge);
      }).catch(function(e){
        b.disabled = false; b.textContent = nudge ? 'Nudge' : 'Preview'; fail(e);
      });
    });
  });
}

/** Preview is read-only by contract — opening this must never mark anything. */
function showPreview(p, clientId, phase, nudge){
  var m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = '<div class="box">'
    + '<div class="hd"><h3>' + (nudge ? 'Nudge' : 'Phase email') + ' preview</h3>'
    + '<button class="btn sm" data-x="1">Close</button>'
    + '<button class="btn sm pri" data-send="1">Send now</button></div>'
    + '<div class="subj"><b>To</b> ' + esc(p.to || '—') + '<br><b>Subject</b> ' + esc(p.subject || '')
    + '</div><div class="bd">' + esc(p.body || '') + '</div></div>';
  document.body.appendChild(m);
  m.addEventListener('click', function(e){ if (e.target === m) m.remove(); });
  m.querySelector('[data-x]').addEventListener('click', function(){ m.remove(); });
  m.querySelector('[data-send]').addEventListener('click', function(){
    var b = m.querySelector('[data-send]');
    b.disabled = true; b.textContent = 'Sending…';
    var call = nudge ? api('dashSendNudge', TOKEN, clientId)
                     : api('dashSend', TOKEN, clientId, Number(phase));
    call.then(function(r){
      m.remove();
      toast(r.ok ? ('Sent to ' + (r.to || 'client')) : (r.message || 'Send failed.'), !r.ok);
      CACHE.queue = null; CACHE.overview = null;
      if (VIEW === 'queue') renderQueue();
    }).catch(function(e){ m.remove(); fail(e); });
  });
}

/**
 * Mirrors the Clients!Status validation list in applyValidation_(). There is no
 * server function that returns it, so it is duplicated here — change both
 * together or the dropdown will offer a value the sheet rejects.

var CLIENT_STATUSES = ['Intake','Access Pending','Auditing','Building','Live','Paused','Churned'];
var CALL_STATES = ['Not applicable','To schedule','Scheduled','Running'];

/**
 * How to work with this client, as opposed to what they bought.

/**

/**

function wireSlack(clientId, c){
  if (el('slackCheck')){
    el('slackCheck').addEventListener('click', function(){
      var b = this; b.disabled = true; b.textContent = 'Checking…';
      api('slackTest').then(function(r){
        b.disabled = false; b.textContent = 'Test connection';
        if (!r.ok){ toast(r.message, true); return; }
        if (r.scopesUnknown){
