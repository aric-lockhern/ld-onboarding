        }).join('') + '</select>';
  } else {
    input = '<input id="' + id + '" type="' + (opts.type || 'text') + '" value="' + esc(v)
      + '" placeholder="' + esc(opts.ph || '') + '">';
  }
  return '<div class="f' + (opts.wide ? ' wide' : '') + (v ? ' filled' : '') + '">'
    + '<label for="' + id + '">' + esc(label) + '</label>' + input
    + (opts.note ? '<div class="note">' + esc(opts.note) + '</div>' : '')
    + (opts.quote || '') + '</div>';
}

function drawForm(){
  INTAKE_STEP = 'form';
  el('view').innerHTML = intakeHtml(CACHE.platforms, CACHE.options);
  wireIntake();
  window.scrollTo(0, 0);
}

function intakeHtml(platforms, options){
  var picked = savedList(DRAFTFORM && DRAFTFORM.platforms)
    || (EXTRACT && EXTRACT.platforms && EXTRACT.platforms.value) || [];
  var h = '<div class="steps">'
    + '<span class="stp done" id="backStep">1 · Sources</span>'
    + '<span class="stp on">2 · Review &amp; create</span></div>';

  if (EXTRACT){
    var n = Object.keys(EXTRACT.fields || {}).length;
    h += '<div class="okbox"><b>' + n + ' field' + (n === 1 ? '' : 's') + ' pre-filled</b> from '
      + esc((EXTRACT.sourcesUsed || []).join(', '))
      + ((EXTRACT.attached || []).length
          ? '. ' + esc(EXTRACT.attached.join(' and ')) + ' also went across as the '
            + 'original file, so pricing laid out as an image could be read'
          : '')
      + '. Every value shows the sentence it came from — check the money and the dates.</div>';

    // Fees are the field most often missing and the most expensive to be wrong
    // about, so when they come back empty the reason is stated rather than left
    // as a blank row the user has to interpret.
    var feeLines = (EXTRACT.fees && EXTRACT.fees.value) || [];
    if (!feeLines.length){
      var why = [];
      (EXTRACT.notAttached || []).forEach(function(n){
        why.push(n.label + ' — ' + n.reason);
      });
      h += '<div class="warnbox"><b>No fees found</b>'
        + '<div>' + (EXTRACT.feePass === 'second-empty'
            ? 'Claude read the attached pages specifically looking for a fee '
              + 'table and did not find one.'
            : EXTRACT.feePass === 'second-failed'
            ? 'The follow-up read of the attached pages failed. Re-analyse to '
              + 'try again.'
            : (EXTRACT.attached || []).length
            ? 'Nothing priced was found in the documents.'
            : 'No document was sent as a page, so a fee table laid out as an '
              + 'image could not be read.') + '</div>'
        + why.map(function(w){ return '<div class="note">' + esc(w) + '</div>'; }).join('')
        + '<div class="note">Upload the contract or deck as a PDF — pasted text '
        + 'loses any pricing that is a picture. Otherwise type the lines below.</div>'
        + '</div>';
    }

    // Something was sold that has no service to put it in. Silence here is how
    // a whole workstream disappears from a scope that names it on page two.
    if ((EXTRACT.unmatchedServices || []).length){
      h += '<div class="warnbox"><b>Sold, but not on the services list</b>'
        + '<div>Nothing was ticked for these. Add them to the Services tab in '
        + 'the sheet if you sell them, or note them in the scope.</div>'
        + EXTRACT.unmatchedServices.map(function(u){
            return '<div class="q">' + esc(u.name || '')
              + (u.quote ? ' — “' + esc(String(u.quote).slice(0, 180)) + '”' : '')
              + '</div>';
          }).join('')
        + '</div>';
    }

    (EXTRACT.conflicts || []).forEach(function(c){
      h += '<div class="warnbox"><b>Sources disagree on ' + esc(c.field || 'something') + '</b>'
        + '<div>' + esc(c.note || '') + '</div>'
        + (c.a ? '<div class="q">' + esc(c.a.source || 'A') + ': “' + esc(c.a.quote || '') + '”</div>' : '')
        + (c.b ? '<div class="q">' + esc(c.b.source || 'B') + ': “' + esc(c.b.quote || '') + '”</div>' : '')
        + '<div class="note">The scope of work reading was used for the field.</div></div>';
    });

    if ((EXTRACT.openQuestions || []).length){
      h += '<div class="qbox"><b>Open questions these documents do not answer</b><ul>'
        + EXTRACT.openQuestions.map(function(q){ return '<li>' + esc(q) + '</li>'; }).join('')
        + '</ul></div>';
    }
  }

  h += '<div class="card form">'
    + '<div class="sect"><h3>Company</h3><div class="hint">Only the company name is required.</div>'
    + '<div class="fields">'
    + field('company', 'Company', {wide:true, value:exVal('company'), quote:exQuote('company')})
    + field('contact', 'Primary contact', {value:exVal('contact'), quote:exQuote('contact')})
    + field('email', 'Contact email', {type:'email', value:exVal('email'), quote:exQuote('email')})
    + field('website', 'Website', {ph:'https://', value:exVal('website'), quote:exQuote('website')})
    + field('vertical', 'Vertical', {value:exVal('vertical'), quote:exQuote('vertical')})
    + '</div></div>'

    + '<div class="sect"><h3>Contract breakdown</h3>'
    + '<div class="hint">Contract start drives every task due date. Blank uses today.</div>'
    + '<div class="fields">'
    + field('contractStart', 'Contract start', {type:'date', value:exVal('contractStart'), quote:exQuote('contractStart')})
    + field('term', 'Contract term', {options:options.terms, value:exVal('term') || 'Month to month', quote:exQuote('term')})
    + field('bizType', 'Business type', {options:options.bizTypes, blank:true, value:exVal('bizType'), quote:exQuote('bizType')})
    + field('cadence', 'Meeting cadence', {options:options.cadences, blank:true, value:exVal('cadence'), quote:exQuote('cadence')})
    + field('owner', 'Onboarding owner', {note:'Blank uses the Config default.', value:exVal('owner'), quote:exQuote('owner')})
    + field('approvals', 'Approvals contact', {value:exVal('approvals'), quote:exQuote('approvals')})
    + field('slack', 'Slack channel', {ph:'#client-name', value:exVal('slack'), quote:exQuote('slack')})
    + field('scope', 'Scope', {type:'textarea', wide:true, ph:'What we are contracted to do.', value:exVal('scope'), quote:exQuote('scope')})
    + '</div></div>'

    + servicesSection(options)

    + '<div class="sect"><h3>Platforms</h3>'
    + '<div class="hint">What we need access to. Ticking a service above adds its platforms automatically; add anything else here.'
    + (picked.length ? ' Pre-selected from the documents.' : '') + '</div>'
    + (EXTRACT && EXTRACT.platforms ? exQuote('__platforms__placeholder') : '')
    + '<div class="checks">' + platforms.map(function(p){
        var on = picked.indexOf(p.name) !== -1;
        return '<label class="chk' + (on ? ' on' : '') + '">'
          + '<input type="checkbox" value="' + esc(p.name) + '"' + (on ? ' checked' : '') + '>'
          + '<span><span class="nm">' + esc(p.name) + '</span><br>'
          + '<span class="cat">' + esc(p.category) + ' · ' + esc(p.method) + '</span></span></label>';
      }).join('') + '</div>'
    + (EXTRACT && EXTRACT.platforms && EXTRACT.platforms.quote
        ? '<div class="src"><span class="cf">' + esc(EXTRACT.platforms.confidence || 'medium')
          + '</span><span class="qt">“' + esc(String(EXTRACT.platforms.quote).slice(0,220))
          + '”</span></div>' : '')
    + '</div>'

    // These two feed the Intake tab, which is what the onboarding plan is
    // written from. When a draft supplied the documents they are filled from it
    // on submit, so asking anyone to paste a transcript they already uploaded
    // is just a large empty box that looks broken.
    + '<div class="sect"><h3>Context</h3>'
    + (READ.length
        ? '<div class="hint">The transcript and contract come from the documents '
          + 'you uploaded, and are written to the Intake tab when the client is '
          + 'created — that is what the onboarding plan is generated from.</div>'
          + '<div class="okbox">' + esc(READ.filter(function(r){ return r.state === 'ok'; })
              .map(function(r){ return r.label; }).join(' · ')) + '</div>'
          + '<div class="fields">'
          + '<textarea id="transcript" hidden></textarea>'
          + '<textarea id="contract" hidden></textarea>'
        : '<div class="hint">Stored on the Intake tab and fed to the onboarding plan. '
          + 'Long text is moved to a Doc automatically.</div>'
          + '<div class="fields">'
          + field('transcript', 'Sales transcript', {type:'textarea', wide:true})
          + field('contract', 'Contract text', {type:'textarea', wide:true}))
    + field('notes', 'Context notes', {type:'textarea', wide:true,
        note: 'Anything the documents do not say. Goes to the onboarding plan.',
        value: EXTRACT && (EXTRACT.openQuestions || []).length
          ? 'Open questions from intake analysis:\n- ' + EXTRACT.openQuestions.join('\n- ') : ''})
    + '</div></div>'

    + '<div class="sect"><h3>What happens next</h3>'
    + '<div class="hint">This creates the client record only. Nothing is sent, '
    + 'no tasks exist yet, and every field above stays editable. You start the '
    + 'onboarding from the client page once the details are right.</div></div>'

    + '<div class="bar"><button class="btn" id="backSrc">Back</button>'
    + (DRAFT ? '<button class="btn" id="saveDraft">Save draft</button>' : '')
    + '<span class="sp"></span>'
    + '<span class="note" id="formMsg"></span>'
    + '<button class="btn pri" id="submit">Create client</button></div></div>';
  return h;
}

/** Everything typed into the form, for both saving a draft and submitting. */
function formPayload(){
  return {
    company: el('company').value.trim(),
    contact: el('contact').value.trim(),
    email: el('email').value.trim(),
    website: el('website').value.trim(),
    vertical: el('vertical').value.trim(),
    bizType: el('bizType').value,
    contractStart: el('contractStart').value,
    term: el('term').value,
    cadence: el('cadence').value,
    owner: el('owner').value.trim(),
    services: readServices(),
    fees: readFees(),
    mrr: readFees().reduce(function(a, l){ return a + (l.amount || 0); }, 0),
    approvals: el('approvals').value.trim(),
    slack: el('slack').value.trim(),
    scope: el('scope').value.trim(),
    platforms: readPlatforms(),
    transcript: el('transcript').value,
    contract: el('contract').value,
    notes: el('notes').value
  };
}

/**
 * Saves the typed form onto the draft without creating anything. This is the
 * "come back to it" button — the record is still not a client, and the
 * documents behind it stay exactly where they are.
 */
function saveDraftNow(btn){
  if (!DRAFT) return;
  btn.disabled = true;
  var was = btn.textContent;
  btn.textContent = 'Saving…';
  api('saveDraft', DRAFT.draftId, { form: formPayload() }).then(function(r){
    btn.disabled = false; btn.textContent = was;
    if (!r.ok){ toast(r.message || 'Could not save the draft.', true); return; }
    el('formMsg').textContent = 'Draft saved ' + (r.saved || '');
  }).catch(function(e){
    btn.disabled = false; btn.textContent = was; fail(e);
  });
}

/**
 * Services are what the client bought. Platforms are what we need access to.
 * They are not the same list and conflating them is how an access email ends
 * up asking for a Merchant Center on a lead-gen account.
 *
 * The fee table mirrors the pricing slide line for line, discounts included,
 * so a mid-term upsell is one more row rather than an edit to a single number
 * nobody can explain later.
 */
function servicesSection(options){
  var sold = savedList(DRAFTFORM && DRAFTFORM.services)
    || (EXTRACT && EXTRACT.services && EXTRACT.services.value) || [];
  var lines = savedList(DRAFTFORM && DRAFTFORM.fees)
    || (EXTRACT && EXTRACT.fees && EXTRACT.fees.value) || [];
  var list = options.services || [];

  // Belt and braces on top of the prompt now reading the Services tab: if the
  // model still returns a name with no checkbox — the tab changed since the
  // analysis, someone deleted a row — say so rather than dropping it. A ticked
  // box the user can see is the only place a service actually lands.
  var noHome = sold.filter(function(n){
    return !list.some(function(sv){ return sv.name === n; });
  });

  var h = '<div class="sect"><h3>Services sold</h3>'
    + '<div class="hint">What we are being paid to do. Each one pulls in the '
    + 'platform access it needs.</div>'
    + '<div class="checks">' + list.map(function(sv){
        var on = sold.indexOf(sv.name) !== -1;
        return '<label class="chk' + (on ? ' on' : '') + '">'
          + '<input type="checkbox" data-service="' + esc(sv.name) + '"'
          + ' value="' + esc(sv.name) + '"' + (on ? ' checked' : '') + '>'
          + '<span><span class="nm">' + esc(sv.name) + '</span><br>'
          + '<span class="cat">' + esc(svPlatformLabel(sv)) + '</span>'
          + '</span></label>';
      }).join('') + '</div>'
    + (noHome.length
        ? '<div class="warnbox" style="margin-top:12px"><b>No checkbox for '
          + esc(noHome.join(', ')) + '</b><div>The documents sold '
          + (noHome.length === 1 ? 'this' : 'these') + ', but the Services tab '
          + 'has no row for it, so nothing was ticked and no platform access '
          + 'was pulled in. Add the row in the sheet, then re-analyse.</div></div>'
        : '')
    + (EXTRACT && EXTRACT.services && EXTRACT.services.quote
        ? '<div class="src"><span class="cf">' + esc(EXTRACT.services.confidence || 'medium')
          + '</span><span class="qt">“' + esc(String(EXTRACT.services.quote).slice(0,220))
          + '”</span></div>' : '')
    + '</div>';

  h += '<div class="sect"><h3>Monthly fees</h3>'
    + '<div class="hint">One line per channel, discounts as negative numbers. '
    + 'The total is the MRR written to the client record.</div>'
    + '<div id="feeRows">'
    + (lines.length ? lines.map(feeRow).join('') : feeRow({label:'', amount:''}))
    + '</div>'
    + '<div class="feefoot">'
    + '<button type="button" class="btn sm" id="addFee">Add line</button>'
    + '<span class="sp"></span><span class="feetot">Monthly total '
    + '<b id="feeTotal">0</b></span></div>'
    + (EXTRACT && EXTRACT.fees && EXTRACT.fees.quote
        ? '<div class="src"><span class="cf">' + esc(EXTRACT.fees.confidence || 'medium')
          + '</span><span class="qt">“' + esc(String(EXTRACT.fees.quote).slice(0,220))
          + '”</span></div>' : '')
    + '</div>';
  return h;
}

function feeRow(l){
  l = l || {};
  return '<div class="feerow">'
    + '<input class="fl" placeholder="Channel or line item" value="' + esc(l.label || '') + '">'
    + '<input class="fa" type="number" step="any" placeholder="0" value="'
    + (l.amount === 0 || l.amount ? esc(l.amount) : '') + '">'
    + '<button type="button" class="clr" data-delfee="1">Remove</button></div>';
}

/** Platform subtitle, marking the ones that depend on the business type. */
function svPlatformLabel(sv){
  var rules = sv.platformRules || (sv.platforms || []).map(function(p){
    return { name: p, onlyFor: '' };
  });
  if (!rules.length) return 'no platform access';
  return rules.map(function(r){
    return r.onlyFor ? r.name + ' (' + r.onlyFor + ' only)' : r.name;
  }).join(', ');
}

function readServices(){
  return [].filter.call(document.querySelectorAll('[data-service]'),
    function(i){ return i.checked; }).map(function(i){ return i.value; });
}

function readPlatforms(){
  return [].filter.call(
    document.querySelectorAll('.checks .chk input[type=checkbox][value]'),
    function(i){ return i.checked; }).map(function(i){ return i.value; });
}

/**
 * A saved draft value only wins over the extraction if it actually holds
 * something.
 *
 * [] is truthy in JavaScript, and readFees() on an untouched form returns
 * [{label:'', amount:0}] — so once a draft was saved with no fees, the saved
 * blank masked every later extraction of them, permanently. Re-reading the
 * documents, re-analysing, attaching the PDF: none of it could get past a
 * truthy empty array. Typing over a value is a deliberate act; leaving a row
 * untouched is not.
 */
function savedList(v){
  if (!Array.isArray(v) || !v.length) return null;
  var real = v.filter(function(x){
    if (x == null) return false;
    if (typeof x === 'string') return !!x.trim();
    return !!String(x.label || '').trim() || !!Number(x.amount);
  });
  return real.length ? v : null;
}

function readFees(){
  return [].map.call(document.querySelectorAll('.feerow'), function(r){
    return { label: r.querySelector('.fl').value.trim(),
             amount: Number(r.querySelector('.fa').value || 0) };
  }).filter(function(l){ return l.label || l.amount; });
}

function recalcFees(){
  var t = readFees().reduce(function(a, l){ return a + (l.amount || 0); }, 0);
  el('feeTotal').textContent = t.toLocaleString();
}

/** Ticking a service ticks the platforms it implies. Unticking never removes
    them — the platform may have been wanted on its own, and silently dropping
    an access request is worse than an extra tick to clear. */
/**
 * Ticking a service ticks the platforms it needs — but some of those depend on
 * the kind of business. Shopping and PMax need a Merchant Center, so Google Ads
 * pulls one in for an eCommerce client and not for a lead-gen one, which has no
 * feed and no use for it.
 */
function applyServicePlatforms(name){
  var sv = (CACHE.options.services || []).find(function(x){ return x.name === name; });
  if (!sv) return;
  var biz = el('bizType') ? el('bizType').value : '';
  (sv.platformRules || sv.platforms.map(function(p){ return {name:p, onlyFor:''}; }))
    .filter(function(r){
      return !r.onlyFor || r.onlyFor.toLowerCase() === String(biz).toLowerCase();
    })
    .forEach(function(r){
      var box = document.querySelector('.checks .chk input[value="'
        + r.name.replace(/"/g, '\\"') + '"]:not([data-service])');
      if (box && !box.checked){
        box.checked = true;
        box.closest('.chk').classList.add('on');
      }
    });
}

/**
 * Platforms that follow from the kind of business rather than from anything
 * sold. An eCommerce client needs a Merchant Center whether or not a document
 * happened to mention one.
 */
function applyBizTypePlatforms(){
  var biz = el('bizType') ? String(el('bizType').value).toLowerCase() : '';
  var map = (CACHE.options && CACHE.options.bizPlatforms) || {};
  (map[biz] || []).forEach(function(name){
    var box = document.querySelector('.checks .chk input[value="'
      + name.replace(/"/g, '\\"') + '"]:not([data-service])');
    if (box && !box.checked){
      box.checked = true;
      box.closest('.chk').classList.add('on');
    }
  });
}

/** Business type changes what the ticked services need, so re-apply them all. */
function reapplyPlatformsForBizType(){
  readServices().forEach(applyServicePlatforms);
  applyBizTypePlatforms();
}

function wireIntake(){
  [].forEach.call(document.querySelectorAll('.chk input'), function(i){
    i.addEventListener('change', function(){ i.closest('.chk').classList.toggle('on', i.checked); });
  });
  [].forEach.call(document.querySelectorAll('[data-service]'), function(i){
    i.addEventListener('change', function(){
      if (i.checked) applyServicePlatforms(i.value);
    });
    // Services arriving pre-ticked from the extraction never fire a change
    // event, so their platforms have to be applied on first render too —
    // otherwise AI Search SEO is selected with no Search Console access.
    if (i.checked) applyServicePlatforms(i.value);
  });
  // Switching to eCommerce should pull in what an eCommerce client needs — the
  // extraction sets both fields, but a correction here has to follow through.
  if (el('bizType')){
    el('bizType').addEventListener('change', reapplyPlatformsForBizType);
    // The extraction fills bizType in without firing a change event, so the
    // business-type platforms have to be applied on first render as well —
    // otherwise eCommerce is selected and no Merchant Center is requested.
    applyBizTypePlatforms();
  }
  if (el('addFee')){
    el('addFee').addEventListener('click', function(){
      el('feeRows').insertAdjacentHTML('beforeend', feeRow({}));
      wireFees();
    });
    wireFees();
  }

  // Back returns to the reading checklist when there is one, so the sources
  // stay visible and swappable; only a form reached with no sources at all
  // falls through to the empty sources screen.
  var back = function(){ READ.length ? drawReading() : drawSources(); };
  if (el('backSrc')) el('backSrc').addEventListener('click', back);
  if (el('backStep')) el('backStep').addEventListener('click', back);
  if (el('saveDraft')){
    el('saveDraft').addEventListener('click', function(){ saveDraftNow(this); });
  }

  el('submit').addEventListener('click', function(){
    var b = el('submit');
    var company = el('company').value.trim();
    if (!company){
      el('formMsg').textContent = 'Company is required.';
      el('company').focus();
      return;
    }
    var payload = formPayload();
    payload.makeDrive = false;
    // The draft is kept and marked submitted, not consumed — its Drive folder
    // becomes the deal's document record.
    if (DRAFT) payload.draftId = DRAFT.draftId;

    b.disabled = true;
    b.textContent = 'Creating…';
    el('formMsg').textContent = '';
    api('submitIntake', payload).then(function(r){
      CACHE.overview = null; CACHE.queue = null;
      // Picked up by openClient, which builds the profile once the page is up
      // rather than making Create client sit on a 30-second API call.
      PENDING_PROFILE = { clientId: r.clientId, draftId: r.draftId || '' };
      toast('Created ' + company + ' — review, then start onboarding.');
      openClient(r.clientId);
    }).catch(function(e){
      b.disabled = false; b.textContent = 'Create client';
      el('formMsg').textContent = '';
      fail(e);
    });
  });
}

</script>
</body>
