name: Deploy

# Static checks run on every PR. Deploys happen only from main, and only
# after the checks pass. Apps Script has no local runtime, so `check` is the
# entire automated safety net between a commit and the live tool.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One deploy at a time. `clasp push` overwrites the whole script project,
# so two concurrent runs could interleave and leave a half-updated script.
concurrency:
  group: apps-script-deploy
  cancel-in-progress: false

jobs:
  check:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # scripts/check.mjs imports only node: builtins, so there is nothing
      # to install. Keep it that way — it makes this job fast and unbreakable
      # by a bad dependency.
      - name: Parse, resolve google.script.run targets, verify column maps
        run: node scripts/check.mjs

  deploy:
    name: Push to Apps Script
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Pinned exactly, and pinned to 3.x deliberately: `npx clasp login`
      # installs the latest clasp, which writes {"tokens":{"default":{...}}}.
      # clasp 2.x only reads the older {"token":{...}} shape and dies with
      # "Cannot read properties of undefined (reading 'access_token')" on a
      # 3.x credential file. 3.3.0 reads all three historical shapes, so this
      # pin must be >= the version whoever ran `clasp login` used.
      - name: Install clasp
        run: npm install -g @google/clasp@3.3.0

      # The script ID lives in the committed .clasp.json. It is an address,
      # not a credential — reaching that script still requires Google
      # permission on it — so there is nothing gained by hiding it, and one
      # fewer secret to get wrong. CLASPRC_JSON is the only real secret here.
      - name: Write credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::CLASPRC_JSON secret is empty or unset. Add it at"
            echo "::error::Settings -> Secrets and variables -> Actions -> New repository secret."
            echo "::error::It must be a Secret, not a Variable, and not an Environment secret."
            exit 1
          fi

          # printf, not echo — keeps the token out of the log and off argv.
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

          if ! node -e 'JSON.parse(require("fs").readFileSync(process.env.HOME + "/.clasprc.json", "utf8"))'; then
            echo "::error::CLASPRC_JSON is not valid JSON. Re-copy ~/.clasprc.json verbatim,"
            echo "::error::from the opening { to the closing }, with nothing added."
            exit 1
          fi

          # Recognise the shape before clasp does, so a version mismatch
          # reports itself here instead of as an undefined-property crash.
          node -e '
            const rc = JSON.parse(require("fs").readFileSync(process.env.HOME + "/.clasprc.json", "utf8"));
            const shape = rc.tokens ? "v3 (tokens.default)"
                        : rc.token  ? "legacy v2 (token + oauth2ClientSettings)"
                        : rc.access_token ? "legacy v1 (flat access_token)"
                        : null;
            if (!shape) {
              // Key names, never values — enough to identify the wrong file
              // without printing anything sensitive.
              const keys = Object.keys(rc);
              console.log("::error::CLASPRC_JSON has no recognisable credential shape.");
              console.log("::error::Expected one of: tokens.default, token, or access_token.");
              console.log("::error::Top-level keys found: " + (keys.join(", ") || "(none)"));
              if (keys.includes("scriptId")) {
                console.log("::error::Those are .clasp.json keys. CLASPRC_JSON needs the OTHER file:");
                console.log("::error::  ~/.clasprc.json  (the login token, in your home directory)");
              } else {
                console.log("::error::Run `npx clasp login`, then copy all of: cat ~/.clasprc.json");
              }
              process.exit(1);
            }
            console.log("Credential format: " + shape);
          '

          if [ ! -f .clasp.json ]; then
            echo "::error::.clasp.json is missing from the repository."
            exit 1
          fi
          echo "Pushing to script $(node -p "require('./.clasp.json').scriptId")"

      # --force skips the interactive manifest-change prompt, which would
      # otherwise hang a non-interactive runner. It also means this push
      # overwrites the remote unconditionally — see docs/OPERATIONS.md.
      - name: clasp push
        run: clasp push --force

      # A push updates the code the SHEET MENU runs. It does not move the web
      # app URL — that serves whatever version was last deployed, so without
      # this step the menu and the URL run different code until someone opens
      # the editor and cuts a version by hand.
      #
      # -i redeploys the EXISTING deployment, which is the whole point. Leave it
      # off and clasp mints a brand new deployment with a brand new URL, and
      # every redirect in netlify.toml keeps pointing at the old one — silently,
      # because the old deployment goes on working. A wrong ID fails loudly here
      # instead, which is the outcome we want.
      #
      # The ID is the same public one netlify.toml forwards to. Access is still
      # gated by the Google domain sign-in on script.google.com.
      - name: Publish a new version of the web app
        env:
          DEPLOYMENT_ID: AKfycbxq2X6YLR_SxQ51-8vYlU2R3Tyev9akVcvzmAYVxkw4AUorfK0coUU-5c-6sHLp9yQskQ
        run: |
          clasp create-deployment \
            -i "$DEPLOYMENT_ID" \
            -d "main@$(git rev-parse --short HEAD)"

      # Only the credential — .clasp.json is tracked now and must survive.
      - name: Shred credentials
        if: always()
        run: rm -f "$HOME/.clasprc.json"
